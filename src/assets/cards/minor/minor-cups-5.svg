<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯五：左失右存，一线水引">
  <defs>
    <radialGradient id="c5-ground" cx="40%" cy="28%" r="98%">
      <stop offset="0" stop-color="#111c24"/><stop offset="0.62" stop-color="#0d161e"/><stop offset="1" stop-color="#07101a"/>
    </radialGradient>
    <radialGradient id="c5-hope" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fc2c9" stop-opacity="0.4"/><stop offset="1" stop-color="#6fc2c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c5-ground)"/>

  <!-- 岸线：从左下向右中缓升（视觉引导的基础） -->
  <path d="M 0 252 C 70 262, 150 250, 224 236 C 252 231, 278 228, 300 228" fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.6"/>

  <!-- 左近景：三只倾覆的杯（失落） -->
  <g>
    <g transform="translate(58 268) rotate(-118)">
      <path d="M -12 -10 L 12 -10 C 12 -3, 8 1, 3 3 L 3 8 L 8 11 L -8 11 L -3 8 L -3 3 C -8 1, -12 -3, -12 -10 Z"
            fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    </g>
    <g transform="translate(96 276) rotate(96)">
      <path d="M -12 -10 L 12 -10 C 12 -3, 8 1, 3 3 L 3 8 L 8 11 L -8 11 L -3 8 L -3 3 C -8 1, -12 -3, -12 -10 Z"
            fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    </g>
    <g transform="translate(80 296) rotate(-38)">
      <path d="M -12 -10 L 12 -10 C 12 -3, 8 1, 3 3 L 3 8 L 8 11 L -8 11 L -3 8 L -3 3 C -8 1, -12 -3, -12 -10 Z"
            fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    </g>
    <!-- 洒落的水渍（静置，不流向失落侧） -->
    <path d="M 44 292 C 60 296, 84 296, 104 292" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- 披巾身影（左侧背影，低首不看观者） -->
  <g>
    <path d="M 128 296
             C 128 268, 134 246, 148 234
             C 158 226, 172 224, 182 228
             L 184 244 C 174 246, 166 252, 162 262
             C 158 272, 158 284, 160 296 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 168 228 C 166 216, 172 206, 182 204 C 190 203, 196 208, 197 216 C 197 222, 193 227, 187 228"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
    <!-- 披巾 -->
    <path d="M 152 240 C 144 254, 140 272, 142 292" fill="none" stroke="#8a93ad" stroke-width="1.4" opacity="0.8"/>
    <path d="M 148 236 C 140 252, 136 272, 138 294" fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 一线细水：把视线从左下失落引向右侧仍存（构图动线） -->
  <path d="M 118 300 C 150 292, 178 276, 200 258 C 214 246, 228 240, 244 238"
        fill="none" stroke="#6fc2c9" stroke-width="1.2" opacity="0.7"/>
  <g fill="#6fc2c9" opacity="0.7">
    <circle cx="150" cy="288" r="1.2"/><circle cx="178" cy="274" r="1.2"/><circle cx="204" cy="258" r="1.2"/>
  </g>

  <!-- 右中景：两只直立的杯（仍存，光源落点） -->
  <g>
    <g transform="translate(238 232)">
      <circle r="22" fill="url(#c5-hope)"/>
      <path d="M -14 -12 L 14 -12 C 14 -4, 9 1, 4 3 L 4 10 L 10 14 L -10 14 L -4 10 L -4 3 C -9 1, -14 -4, -14 -12 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
      <ellipse cx="0" cy="-12" rx="14" ry="2.8" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -11 -10 C -6 -7, 6 -7, 11 -10 L 10 -6 C 5 -3, -5 -3, -10 -6 Z" fill="#6fc2c9" opacity="0.55"/>
    </g>
    <g transform="translate(272 220)">
      <circle r="17" fill="url(#c5-hope)" opacity="0.8"/>
      <path d="M -12 -10 L 12 -10 C 12 -3, 8 1, 4 3 L 4 9 L 9 12 L -9 12 L -4 9 L -4 3 C -8 1, -12 -3, -12 -10 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <ellipse cx="0" cy="-10" rx="12" ry="2.4" fill="none" stroke="#c7cedd" stroke-width="1"/>
      <path d="M -9 -8 C -5 -6, 5 -6, 9 -8 L 8 -5 C 4 -2, -4 -2, -8 -5 Z" fill="#6fc2c9" opacity="0.5"/>
    </g>
    <!-- 石台 -->
    <path d="M 218 254 L 292 244 L 296 256 L 222 266 Z" fill="#101736" stroke="#8a93ad" stroke-width="0.9"/>
  </g>

  <!-- 天际微星 -->
  <g fill="#c7cedd" opacity="0.45">
    <circle cx="60" cy="56" r="0.9"/><circle cx="150" cy="44" r="1"/><circle cx="248" cy="60" r="0.9"/>
  </g>
</svg>
