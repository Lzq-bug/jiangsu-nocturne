<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币四：石门缝后被锁的环璧">
  <defs>
    <radialGradient id="p4-ground" cx="66%" cy="30%" r="95%">
      <stop offset="0" stop-color="#181f12"/><stop offset="0.6" stop-color="#12180e"/><stop offset="1" stop-color="#0a0d08"/>
    </radialGradient>
    <radialGradient id="p4-slit" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7cedd" stop-opacity="0.35"/><stop offset="1" stop-color="#c7cedd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-stone" width="20" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 6 L 20 6 M 10 0 L 10 6 M 5 6 L 5 12 M 15 6 L 15 12" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#p4-ground)"/>

  <!-- 石墙（主体右侧）：仓室外墙 -->
  <g>
    <path d="M 128 340 L 128 88 C 128 62, 146 46, 172 46 L 300 46 L 300 340 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 128 340 L 128 88 C 128 62, 146 46, 172 46 L 300 46" fill="url(#p4-stone)" opacity="0.7"/>
    <path d="M 122 340 L 122 84" stroke="#8a93ad" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 门缝（叙事光源：垂直冷光一线） -->
  <g>
    <rect x="238" y="70" width="5" height="240" fill="#e9edf5" opacity="0.24"/>
    <ellipse cx="240" cy="190" rx="26" ry="120" fill="url(#p4-slit)"/>
    <path d="M 240 70 L 240 310" stroke="#e9edf5" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- 缝内：架上被铁链十字缠绕的环璧（守持的核心物） -->
  <g transform="translate(240 190)">
    <circle r="20" fill="#0b0f20" stroke="#a8b87a" stroke-width="2"/>
    <circle r="13.4" fill="none" stroke="#a8b87a" stroke-width="0.9" opacity="0.85"/>
    <path d="M -13 0 L 13 0 M 0 -13 L 0 13" stroke="#8a93ad" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="3" fill="#a8b87a" opacity="0.9"/>
  </g>
  <!-- 架 -->
  <path d="M 222 214 L 258 214" stroke="#8a93ad" stroke-width="1.4"/>

  <!-- 门外左侧：一只手自画外伸向门缝（够不到的距离） -->
  <g>
    <path d="M 0 268 C 34 264, 62 256, 84 244 C 92 240, 98 234, 102 228" fill="none" stroke="#c7cedd" stroke-width="5.4" opacity="0.95"/>
    <path d="M 102 228 C 106 224, 110 222, 114 222" fill="none" stroke="#c7cedd" stroke-width="4" opacity="0.95"/>
    <path d="M 96 252 C 104 248, 110 244, 116 240" fill="none" stroke="#8a93ad" stroke-width="1.1" opacity="0.7"/>
  </g>

  <!-- 地面与墙脚 -->
  <path d="M 0 320 L 300 320" stroke="#8a93ad" stroke-width="0.8" opacity="0.55"/>
  <path d="M 128 316 L 300 316" stroke="#e9edf5" stroke-width="0.7" opacity="0.4"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 30 330 L 110 330 M 160 332 L 250 332"/>
  </g>
  <!-- 门缝光在地面的落带 -->
  <ellipse cx="240" cy="322" rx="26" ry="5" fill="url(#p4-slit)" opacity="0.7"/>

  <!-- 墙头枯草（守成的岁月感） -->
  <g stroke="#a8b87a" stroke-width="0.9" opacity="0.7" fill="none">
    <path d="M 150 44 C 150 38, 153 34, 157 32 M 157 44 C 158 39, 161 35, 165 33"/>
    <path d="M 196 44 C 196 38, 199 34, 203 32"/>
  </g>
</svg>
