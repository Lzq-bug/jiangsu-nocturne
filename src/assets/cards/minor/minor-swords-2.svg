<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑二：蒙眼的抉择僵局">
  <defs>
    <radialGradient id="s2-ground" cx="50%" cy="30%" r="92%">
      <stop offset="0" stop-color="#141c2e"/><stop offset="0.62" stop-color="#101728"/><stop offset="1" stop-color="#0a0f1c"/>
    </radialGradient>
    <radialGradient id="s2-x" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fb6d9" stop-opacity="0.42"/><stop offset="1" stop-color="#9fb6d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s2-ground)"/>

  <!-- 极静的海平线 + 风痕（宝剑族冷白锋线） -->
  <path d="M 0 226 L 300 226" stroke="#8a93ad" stroke-width="0.9" opacity="0.6"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 30 238 L 96 238 M 210 244 L 272 244 M 60 254 L 120 254"/>
  </g>
  <g stroke="#c7cedd" stroke-width="0.8" opacity="0.55" stroke-linecap="round">
    <path d="M 36 88 L 84 84"/><path d="M 52 106 L 88 104"/>
    <path d="M 214 96 L 266 92"/><path d="M 226 114 L 262 112"/>
  </g>
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="70" cy="52" r="1"/><circle cx="232" cy="60" r="1.1"/><circle cx="150" cy="36" r="0.9"/>
  </g>

  <!-- 交叉双剑（竖扶横抱于胸前），交点冷光（叙事光源）+ 冷白锋刃提亮 -->
  <g transform="translate(150 150)">
    <circle r="28" fill="url(#s2-x)"/>
    <g transform="rotate(24)">
      <path d="M 0 -54 L 5 -8 L 3 44 L 0 56 L -3 44 L -5 -8 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
      <path d="M 0 -50 L 2 -10 L 1 40" fill="none" stroke="#e9edf5" stroke-width="1.1" opacity="0.95"/>
      <rect x="-11" y="-64" width="22" height="7" rx="2.5" fill="#0b0f20" stroke="#e9edf5" stroke-width="1.2"/>
      <circle cx="0" cy="-70" r="4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
    </g>
    <g transform="rotate(-24)">
      <path d="M 0 -54 L 5 -8 L 3 44 L 0 56 L -3 44 L -5 -8 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
      <path d="M 0 -50 L 2 -10 L 1 40" fill="none" stroke="#e9edf5" stroke-width="1.1" opacity="0.95"/>
      <rect x="-11" y="-64" width="22" height="7" rx="2.5" fill="#0b0f20" stroke="#e9edf5" stroke-width="1.2"/>
      <circle cx="0" cy="-70" r="4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
    </g>
    <circle cx="0" cy="-4" r="2.4" fill="#e9edf5" opacity="1"/>
  </g>

  <!-- 蒙眼坐影：双臂抱剑的姿态由剑体暗示，人形在剑后 -->
  <g>
    <!-- 头与蒙眼布 -->
    <path d="M 128 176 C 124 158, 132 144, 150 142 C 168 144, 176 158, 172 176 C 160 182, 140 182, 128 176 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 126 162 C 140 156, 160 156, 174 162" fill="none" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 126 162 C 122 164, 120 168, 121 172 M 174 162 C 178 164, 180 168, 179 172" fill="none" stroke="#c7cedd" stroke-width="1.2" opacity="0.8"/>
    <!-- 肩与袍 -->
    <path d="M 132 180 C 118 188, 110 204, 108 226 L 192 226 C 190 204, 182 188, 168 180 C 156 186, 144 186, 132 180 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
    <g stroke="#8a93ad" stroke-width="0.7" opacity="0.55" fill="none">
      <path d="M 138 192 C 134 202, 132 214, 132 224"/>
      <path d="M 162 192 C 166 202, 168 214, 168 224"/>
    </g>
  </g>

  <!-- 石凳与袍摆 -->
  <path d="M 92 226 L 208 226 L 214 240 L 86 240 Z" fill="#101736" stroke="#8a93ad" stroke-width="1"/>
  <path d="M 100 240 L 200 240 L 200 252 L 100 252 Z" fill="#0d1330" stroke="#8a93ad" stroke-width="0.8"/>

  <!-- 水上微光倒影 -->
  <g stroke="#9fb6d9" opacity="0.3" fill="none">
    <path d="M 110 264 C 136 268, 164 268, 190 264" stroke-width="0.8"/>
    <path d="M 126 276 C 144 279, 156 279, 174 276" stroke-width="0.6"/>
  </g>
</svg>
