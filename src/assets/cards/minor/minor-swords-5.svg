<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑五：胜负已过的荒坡">
  <defs>
    <radialGradient id="s5-ground" cx="36%" cy="26%" r="100%">
      <stop offset="0" stop-color="#161d2b"/><stop offset="0.6" stop-color="#111725"/><stop offset="1" stop-color="#0a0e18"/>
    </radialGradient>
    <linearGradient id="s5-pale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7cedd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c7cedd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s5-ground)"/>

  <!-- 统一方向的长风线（自左向右，宝剑族锋线语汇） -->
  <g stroke="#c7cedd" stroke-width="0.9" opacity="0.5" stroke-linecap="round">
    <path d="M 16 66 L 96 62"/><path d="M 40 88 L 132 84"/><path d="M 24 112 L 118 108"/>
    <path d="M 60 134 L 150 130"/><path d="M 150 74 L 226 71"/><path d="M 180 96 L 262 93"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4" stroke-linecap="round">
    <path d="M 100 52 L 170 49"/><path d="M 190 118 L 268 115"/><path d="M 70 158 L 160 154"/>
  </g>

  <!-- 地平冷光（叙事光源：左缘天际一线冷白） -->
  <path d="M 0 158 L 74 158" stroke="url(#s5-pale)" stroke-width="2.4"/>

  <!-- 远处退场剪影：携剑走向左侧远方 -->
  <g transform="translate(44 128)">
    <path d="M 0 30 C 1 20, 5 13, 12 11 L 13 4 A 5.6 5.6 0 0 1 23 6 L 21 14 C 27 18, 30 24, 30 30 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 12 11 L 8 -6" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 8 -6 L 2 -9 M 8 -6 L 5 -12" stroke="#c7cedd" stroke-width="1.1"/>
  </g>

  <!-- 前景右下：三剑败落斜插（失方） -->
  <g>
    <g transform="translate(196 258) rotate(16)">
      <path d="M 0 -74 L 5 -20 L 3 30 L 0 42 L -3 30 L -5 -20 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="1.3"/>
      <rect x="-10" y="-84" width="20" height="6.6" rx="2.4" fill="#0b0f20" stroke="#8a93ad" stroke-width="1"/>
      <circle cx="0" cy="-89" r="3.6" fill="#0b0f20" stroke="#8a93ad" stroke-width="1"/>
    </g>
    <g transform="translate(238 276) rotate(-22)">
      <path d="M 0 -66 L 4.6 -18 L 2.8 26 L 0 38 L -2.8 26 L -4.6 -18 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
      <rect x="-9" y="-75" width="18" height="6" rx="2.2" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9"/>
      <circle cx="0" cy="-80" r="3.2" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(158 286) rotate(-7)">
      <path d="M 0 -58 L 4 -16 L 2.4 22 L 0 33 L -2.4 22 L -4 -16 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="1.1"/>
      <rect x="-8.4" y="-66" width="16.8" height="5.6" rx="2" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9"/>
      <circle cx="0" cy="-70" r="3" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <!-- 剑旁遗落的一枚断穗饰带 -->
    <path d="M 96 300 C 104 296, 116 296, 122 300 C 114 304, 102 304, 96 300 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.8"/>
  </g>

  <!-- 荒坡地面 -->
  <path d="M 0 254 C 60 246, 130 244, 200 250 C 240 254, 272 254, 300 250 L 300 340 L 0 340 Z"
        fill="#0c1120" stroke="#8a93ad" stroke-width="1"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 30 288 L 110 284 M 150 300 L 240 296 M 60 318 L 150 314"/>
  </g>
</svg>
