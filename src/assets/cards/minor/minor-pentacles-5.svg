<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币五：雪夜关门外的一线暖窗">
  <defs>
    <radialGradient id="p5-ground" cx="60%" cy="26%" r="100%">
      <stop offset="0" stop-color="#12181f"/><stop offset="0.6" stop-color="#0e141b"/><stop offset="1" stop-color="#080d13"/>
    </radialGradient>
    <radialGradient id="p5-window" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c687" stop-opacity="0.4"/><stop offset="1" stop-color="#e6c687" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p5-ground)"/>

  <!-- 关闭的工坊大门（右，砖石墙 + 横闩） -->
  <g>
    <path d="M 172 340 L 172 96 C 172 70, 190 54, 216 54 C 242 54, 260 70, 260 96 L 260 340 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 184 340 L 184 100 C 184 80, 198 68, 216 68 C 234 68, 248 80, 248 100 L 248 340"
          fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <!-- 横闩（紧闭） -->
    <rect x="160" y="150" width="112" height="12" fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    <circle cx="172" cy="156" r="2.6" fill="#8a93ad"/>
    <circle cx="260" cy="156" r="2.6" fill="#8a93ad"/>
    <!-- 高窗：窗内环璧灯暖光（全牌唯一亮部） -->
    <g transform="translate(216 118)">
      <circle r="24" fill="url(#p5-window)"/>
      <path d="M -13 -13 L 13 -13 L 13 13 L -13 13 Z" fill="#1a2338" stroke="#e6c687" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="6.4" fill="none" stroke="#e6c687" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="2.2" fill="#e6c687"/>
    </g>
  </g>

  <!-- 冷雨（斜线，自左向右落） -->
  <g stroke="#8a93ad" stroke-width="0.8" opacity="0.55" stroke-linecap="round">
    <line x1="30" y1="56" x2="42" y2="82"/><line x1="76" y1="40" x2="88" y2="66"/>
    <line x1="120" y1="70" x2="132" y2="96"/><line x1="58" y1="110" x2="70" y2="136"/>
    <line x1="100" y1="130" x2="112" y2="156"/><line x1="36" y1="170" x2="48" y2="196"/>
    <line x1="84" y1="196" x2="96" y2="222"/><line x1="60" y1="248" x2="72" y2="274"/>
    <line x1="110" y1="238" x2="122" y2="264"/><line x1="140" y1="286" x2="152" y2="312"/>
  </g>

  <!-- 两道同行剪影（左，共披一巾） -->
  <g>
    <!-- 高者搀扶矮者 -->
    <path d="M 74 300
             C 74 274, 80 252, 92 240
             C 100 232, 110 230, 118 234
             L 120 224 A 7.4 7.4 0 0 1 133 227
             L 129 240
             C 139 248, 144 262, 144 278
             L 146 300 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <!-- 矮者（倚靠） -->
    <path d="M 108 300
             C 108 280, 112 264, 122 254
             C 130 246, 140 244, 148 248
             C 154 252, 156 260, 152 266
             C 148 272, 140 274, 134 272
             C 128 278, 124 288, 124 300 Z"
          fill="#0b0f20" stroke="#8a93ad" stroke-width="1.4"/>
    <!-- 共披的长巾（连接两人） -->
    <path d="M 106 240 C 116 232, 130 230, 142 236 C 138 252, 126 262, 112 264 C 104 258, 102 248, 106 240 Z"
          fill="#0b0f20" stroke="#8a93ad" stroke-width="1.1"/>
    <!-- 搀扶的手 -->
    <path d="M 122 268 C 128 264, 134 262, 140 262" fill="none" stroke="#c7cedd" stroke-width="1.3" opacity="0.9"/>
  </g>

  <!-- 积雪地面 -->
  <path d="M 0 300 C 60 292, 140 290, 220 296 C 254 299, 280 299, 300 296 L 300 340 L 0 340 Z"
        fill="#10162a" stroke="#c7cedd" stroke-width="1.2"/>
  <g fill="#e9edf5" opacity="0.35">
    <ellipse cx="70" cy="312" rx="60" ry="7"/><ellipse cx="230" cy="322" rx="70" ry="8"/>
  </g>
  <g fill="#e9edf5" opacity="0.6">
    <circle cx="40" cy="290" r="1.1"/><circle cx="130" cy="284" r="1.2"/><circle cx="160" cy="300" r="1"/>
    <circle cx="90" cy="304" r="0.9"/><circle cx="250" cy="292" r="1.1"/>
  </g>
</svg>
