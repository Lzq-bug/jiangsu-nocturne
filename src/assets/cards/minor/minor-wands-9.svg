<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖九：缠着绷带的旧杖防线，第九根作支柱撑住最弱的一段，远处一点守望火">
  <defs>
    <radialGradient id="w9-ground" cx="80%" cy="26%" r="115%">
      <stop offset="0" stop-color="#1e150e"/><stop offset="0.6" stop-color="#150f09"/><stop offset="1" stop-color="#0c0805"/>
    </radialGradient>
    <radialGradient id="w9-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="w9-band" width="7" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M 0 2.5 L 7 2.5" stroke="#a89b85" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#w9-ground)"/>

  <!-- 远处守望火（唯一叙事光源：仍有人在守的证据） -->
  <g transform="translate(262 96)">
    <circle r="26" fill="url(#w9-fire)"/>
    <path d="M -2.6 6 L -2.6 -4 L 0 -7 L 2.6 -4 L 2.6 6 Z" fill="#0d0906" stroke="#8a5a3a" stroke-width="0.8"/>
    <path d="M 0 -7 C 2.2 -10, 1.4 -13, 0 -15 C -1.4 -13, -2.2 -10, 0 -7 Z" fill="#d9814e"/>
  </g>
  <path d="M 0 118 C 90 114, 200 112, 300 114" stroke="#8a93ad" stroke-width="0.6" opacity="0.35"/>

  <!-- 八根旧杖的防线（横贯中带的修补栅障） -->
  <g stroke-linecap="round">
    <path d="M 14 172 L 12 246" stroke="#241509" stroke-width="7"/>
    <path d="M 52 168 L 50 250" stroke="#2e1b10" stroke-width="7"/>
    <path d="M 90 166 L 88 252" stroke="#241509" stroke-width="7"/>
    <path d="M 128 164 L 126 254" stroke="#33200f" stroke-width="7"/>
    <path d="M 166 166 L 164 252" stroke="#241509" stroke-width="7"/>
    <path d="M 204 168 L 202 250" stroke="#2e1b10" stroke-width="7"/>
    <path d="M 240 172 L 238 246" stroke="#241509" stroke-width="7"/>
    <path d="M 274 176 L 272 242" stroke="#33200f" stroke-width="7"/>
  </g>
  <!-- 旧杖的受光棱与木纹 -->
  <g stroke="#c98a54" stroke-width="1.1" opacity="0.8">
    <path d="M 16 176 L 14 242 M 54 172 L 52 246 M 92 170 L 90 248 M 130 168 L 128 250"/>
    <path d="M 168 170 L 166 248 M 206 172 L 204 246 M 242 176 L 240 242 M 276 180 L 274 238"/>
  </g>
  <g stroke="#1a0e07" stroke-width="0.7" opacity="0.7" fill="none">
    <path d="M 48 200 C 50 198, 54 198, 56 200 M 124 210 C 126 208, 130 208, 132 210 M 200 196 C 202 194, 206 194, 208 196"/>
  </g>

  <!-- 修补痕迹：绑扎绳结与绷带缠绕（防线本身在带伤值守） -->
  <g fill="url(#w9-band)" stroke="#a89b85" stroke-width="0.8">
    <path d="M 86 178 C 92 174, 96 174, 102 178 L 102 206 C 96 210, 92 210, 86 206 Z"/>
    <path d="M 86 206 C 92 210, 96 210, 102 206" fill="none"/>
  </g>
  <g fill="url(#w9-band)" stroke="#a89b85" stroke-width="0.8">
    <path d="M 162 196 C 168 192, 172 192, 178 196 L 178 226 C 172 230, 168 230, 162 226 Z"/>
  </g>
  <!-- 裂而未断的杖（中段绑木条夹板） -->
  <path d="M 124 190 L 118 218" stroke="#1a0e07" stroke-width="1.2" opacity="0.9"/>
  <path d="M 116 196 L 136 192 M 117 212 L 137 208" stroke="#a89278" stroke-width="1.2"/>
  <!-- 绑扎的绳结 -->
  <g stroke="#a89278" stroke-width="1.1" fill="none">
    <path d="M 46 184 C 50 181, 56 181, 60 184 M 46 190 C 50 187, 56 187, 60 190"/>
    <path d="M 236 206 C 240 203, 246 203, 250 206 M 236 212 C 240 209, 246 209, 250 212"/>
  </g>

  <!-- 第九根杖：斜撑最弱的一段（临时支柱，主动线：对角） -->
  <g>
    <path d="M 30 320 L 106 182" stroke="#3a2214" stroke-width="8" stroke-linecap="round"/>
    <path d="M 33 316 L 104 188" stroke="#c98a54" stroke-width="1.3" opacity="0.85"/>
    <!-- 支柱顶端的绑带（一端系在防线上，微微飘动） -->
    <path d="M 100 190 C 108 184, 116 184, 122 189" fill="none" stroke="#c9bda5" stroke-width="1.6"/>
    <path d="M 122 189 C 130 186, 136 188, 140 194 C 133 193, 127 192, 122 189 Z" fill="#c9bda5" opacity="0.9"/>
  </g>

  <!-- 防线下的杂石与旧火烬 -->
  <g fill="#0d0906" stroke="#8a93ad" stroke-width="0.7">
    <path d="M 60 260 C 66 254, 76 254, 80 260 C 74 266, 66 266, 60 260 Z"/>
    <path d="M 190 264 C 196 259, 205 259, 209 264 C 204 269, 195 269, 190 264 Z"/>
  </g>
  <g fill="#d9814e" opacity="0.7">
    <circle cx="150" cy="270" r="1.2"/><circle cx="90" cy="276" r="1"/><circle cx="222" cy="272" r="0.9"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 262 C 80 258, 200 258, 300 262" fill="none" stroke="#c7cedd" stroke-width="0.9" opacity="0.45"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 40 292 L 116 292 M 180 306 L 256 306"/>
  </g>
</svg>
