<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖八：八根活木杖同向斜掠夜空，带头的一杖先燃">
  <defs>
    <radialGradient id="w8-ground" cx="50%" cy="30%" r="110%">
      <stop offset="0" stop-color="#1c1610"/><stop offset="0.6" stop-color="#141009"/><stop offset="1" stop-color="#0c0805"/>
    </radialGradient>
    <radialGradient id="w8-lead" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w8-ground)"/>

  <!-- 夜风的方向线（同向，微弱） -->
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.35" stroke-linecap="round">
    <line x1="40" y1="52" x2="86" y2="40"/><line x1="180" y1="36" x2="226" y2="24"/>
    <line x1="24" y1="258" x2="66" y2="247"/><line x1="216" y1="286" x2="258" y2="275"/>
  </g>

  <!-- 八根活木杖：同向斜贯（主动线：自左下向右上疾行） -->
  <g stroke-linecap="round">
    <path d="M 12 306 L 96 176" stroke="#2e1b10" stroke-width="7.6"/>
    <path d="M 44 314 L 130 186" stroke="#241509" stroke-width="8"/>
    <path d="M 82 318 L 164 192" stroke="#33200f" stroke-width="7.6"/>
    <path d="M 120 322 L 200 200" stroke="#241509" stroke-width="8.2"/>
    <path d="M 158 326 L 234 208" stroke="#2e1b10" stroke-width="7.6"/>
    <path d="M 196 330 L 266 218" stroke="#241509" stroke-width="8"/>
    <path d="M 234 334 L 292 230" stroke="#33200f" stroke-width="7.6"/>
    <path d="M -8 290 L 62 182" stroke="#241509" stroke-width="7"/>
  </g>
  <!-- 受光棱线（同向，上侧受光） -->
  <g stroke="#c98a54" stroke-width="1.3" opacity="0.85">
    <path d="M 14 302 L 94 178 M 46 310 L 126 188 M 84 314 L 160 194 M 122 318 L 196 202"/>
    <path d="M 160 322 L 230 210 M 198 326 L 262 220 M 236 330 L 288 232 M -6 286 L 58 184"/>
  </g>
  <!-- 活木的证据：木纹、枝节、新芽 -->
  <g stroke="#1a0e07" stroke-width="0.8" opacity="0.75" fill="none">
    <path d="M 52 258 C 56 254, 60 254, 64 258 M 138 262 C 142 258, 146 258, 150 262 M 226 270 C 230 266, 234 266, 238 270"/>
  </g>
  <g stroke="#6d5137" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M 84 236 C 90 232, 94 226, 94 220 M 92 240 C 98 238, 102 234, 104 228"/>
    <path d="M 172 248 C 178 244, 180 238, 180 232"/>
    <path d="M 246 276 C 252 272, 254 266, 254 262"/>
    <path d="M 30 250 C 36 246, 38 240, 38 236"/>
  </g>
  <!-- 枝头小叶（活木非箭矢） -->
  <g fill="#7d8f63" stroke="none" opacity="0.9">
    <path d="M 94 218 C 98 214, 104 213, 107 216 C 103 220, 97 221, 94 218 Z"/>
    <path d="M 180 230 C 184 226, 190 225, 193 228 C 189 232, 183 233, 180 230 Z"/>
    <path d="M 38 234 C 42 230, 48 229, 51 232 C 47 236, 41 237, 38 234 Z"/>
  </g>

  <!-- 带头之杖的杖尖先燃（唯一叙事光源：疾行中最先触到光的一端） -->
  <g transform="translate(100 170)">
    <circle r="15" fill="url(#w8-lead)"/>
    <path d="M 0 -6 C 2.6 -9, 1.6 -13, 0 -15 C -1.6 -13, -2.6 -9, 0 -6 Z" fill="#f0c078" transform="rotate(34)"/>
    <circle cx="3" cy="-7" r="1.6" fill="#f0c078"/>
  </g>

  <!-- 余烬尾迹（同向拉出，短） -->
  <g fill="#d9814e" opacity="0.8">
    <circle cx="112" cy="186" r="1.2"/><circle cx="124" cy="204" r="1"/><circle cx="86" cy="192" r="0.9"/>
    <circle cx="196" cy="226" r="1.1"/><circle cx="240" cy="248" r="0.9"/>
  </g>

  <!-- 地面：被疾行压出的风痕 -->
  <path d="M 0 322 C 80 318, 180 318, 300 324" fill="none" stroke="#c7cedd" stroke-width="0.9" opacity="0.4"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4" stroke-linecap="round">
    <line x1="60" y1="330" x2="112" y2="330"/><line x1="180" y1="334" x2="236" y2="334"/>
  </g>
</svg>
