<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑王后：背侧立在山脊风口，剑插在身旁，她正在切断一条系绳——清醒就是边界">
  <defs>
    <linearGradient id="s13-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2338"/><stop offset="0.7" stop-color="#121a2c"/><stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="s13-gap" x1="1" y1="0" x2="0" y2="0.5">
      <stop offset="0" stop-color="#dfe8f6" stop-opacity="0.55"/><stop offset="1" stop-color="#dfe8f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s13-sky)"/>

  <!-- 云隙冷光（右上：窄三角缝隙，被两团暗云夹住） -->
  <path d="M 240 44 C 258 38, 278 38, 296 44 L 296 64 C 276 56, 258 54, 242 58 Z" fill="url(#s13-gap)"/>
  <path d="M 238 44 C 256 37, 276 37, 296 43" stroke="#dfe8f6" stroke-width="0.9" fill="none" opacity="0.5"/>
  <path d="M 240 60 C 258 54, 276 54, 296 62" stroke="#aebdd6" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- 夹缝的暗云（让光成为"缝"而不是"面"） -->
  <path d="M 196 52 C 216 46, 236 46, 252 52 C 236 58, 214 58, 196 56 Z" fill="#18213a" stroke="#4d5878" stroke-width="0.7"/>
  <g fill="#c7cedd" opacity="0.4">
    <circle cx="56" cy="34" r="0.8"/><circle cx="122" cy="24" r="0.7"/><circle cx="168" cy="44" r="0.7"/>
  </g>

  <!-- 强风线（横掠，穿全画） -->
  <g stroke="#6d7898" fill="none" opacity="0.55">
    <path d="M 0 110 C 70 102, 150 104, 226 96"/>
    <path d="M 0 146 C 80 140, 170 142, 250 134"/>
    <path d="M 0 190 C 70 186, 150 188, 220 182"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" fill="none" opacity="0.35">
    <path d="M 0 128 C 90 122, 190 124, 280 116"/>
    <path d="M 0 168 C 80 164, 170 166, 250 160"/>
  </g>

  <!-- 山脊（主体所立：右高左低的脊线） -->
  <path d="M 0 254 C 60 250, 120 240, 176 226 C 226 213, 268 206, 300 204 L 300 340 L 0 340 Z" fill="#0c111c"/>
  <path d="M 0 254 C 60 250, 120 240, 176 226 C 226 213, 268 206, 300 204" stroke="#39425c" stroke-width="1.1" fill="none" opacity="0.9"/>
  <g stroke="#232c44" stroke-width="0.7" opacity="0.6" fill="none">
    <path d="M 36 288 C 100 280, 180 270, 248 258"/>
    <path d="M 80 314 C 150 304, 220 294, 276 284"/>
  </g>
  <!-- 脊上碎石 -->
  <g fill="#161d30">
    <ellipse cx="120" cy="240" rx="4" ry="1.8"/><ellipse cx="228" cy="216" rx="3.4" ry="1.6"/><ellipse cx="66" cy="262" rx="3.6" ry="1.8"/>
  </g>

  <!-- 王后（主体：背侧影直立，头微抬迎风；剑插在身旁左侧，不持于手） -->
  <g>
    <!-- 斗篷与身形（背侧，衣摆向后掀） -->
    <path d="M 156 288
             C 152 268, 152 246, 158 226
             C 163 210, 171 198, 181 192
             C 189 187, 197 187, 203 192
             C 209 197, 212 206, 211 216
             C 210 232, 206 252, 202 272
             C 199 284, 196 292, 192 296
             C 180 296, 166 293, 156 288 Z"
          fill="#111828"/>
    <!-- 衣摆掀角（风） -->
    <path d="M 156 288 C 146 282, 138 274, 134 264 C 144 268, 154 274, 160 280 Z" fill="#111828" opacity="0.95"/>
    <path d="M 158 272 C 150 268, 144 262, 140 254" stroke="#111828" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- 头（背侧，束发，微微抬起） -->
    <path d="M 182 190 C 179 180, 185 171, 194 171 C 202 171, 208 178, 207 186 C 206 193, 199 197, 192 196 Z" fill="#111828"/>
    <!-- 王后冠饰：水平连续冠线（背视可见的细银弧） -->
    <path d="M 181 182 C 187 176, 197 175, 204 180" stroke="#aebdd6" stroke-width="1.2" fill="none"/>
    <path d="M 188 178.4 L 188 174.4 M 194 177.6 L 194 173.6 M 200 178.6 L 200 175" stroke="#aebdd6" stroke-width="0.9"/>
    <!-- 手臂（右臂上举：刚切断绳；绳头飘走） -->
    <path d="M 202 200 C 212 194, 222 188, 232 182" stroke="#111828" stroke-width="5.6" fill="none" stroke-linecap="round"/>
    <!-- 断绳（两段：手中一截短，另一截被风带走） -->
    <path d="M 232 180 C 236 176, 238 172, 238 168" stroke="#8a7a5a" stroke-width="1.2" fill="none"/>
    <circle cx="238" cy="166" r="1.6" fill="#c9bda5"/>
    <path d="M 246 148 C 254 144, 260 138, 264 130" stroke="#8a7a5a" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M 264 130 C 268 126, 270 122, 269 118" stroke="#8a7a5a" stroke-width="0.9" fill="none" opacity="0.5"/>
    <circle cx="269" cy="116" r="1.3" fill="#c9bda5" opacity="0.8"/>
    <!-- 左手自然垂在剑旁（不扶剑：剑自插于地） -->
    <path d="M 168 218 C 164 230, 162 244, 162 258" stroke="#111828" stroke-width="5.2" fill="none" stroke-linecap="round"/>
    <!-- 剑（插在身旁左侧：竖直，静，柄在腰高） -->
    <g>
      <path d="M 148 258 L 148 178" stroke="#1c2438" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M 149.6 254 L 149.6 182" stroke="#dfe8f6" stroke-width="0.9" opacity="0.75"/>
      <g transform="translate(148 182)">
        <rect x="-10" y="-2.2" width="20" height="4.4" fill="#1c2438" stroke="#8a93ad" stroke-width="0.9"/>
        <path d="M 0 2.2 L 0 10" stroke="#1c2438" stroke-width="3.4"/>
        <circle cx="0" cy="11.6" r="2.8" fill="#1c2438" stroke="#8a93ad" stroke-width="0.9"/>
      </g>
      <path d="M 144 262 C 146 266, 150 266, 152 262" stroke="#232c44" stroke-width="1" fill="none" opacity="0.9"/>
    </g>
    <!-- 云隙轮廓光（右上缘，加强缩略可读性） -->
    <g stroke="#dfe8f6" fill="none" opacity="0.85">
      <path d="M 194 194 C 200 190, 205 185, 208 179" stroke-width="1.2"/>
      <path d="M 204 198 C 212 192, 222 186, 230 181" stroke-width="1"/>
      <path d="M 208 214 C 210 224, 210 236, 208 248 C 207 262, 205 278, 203 292" stroke-width="1"/>
      <path d="M 182 192 C 180 198, 179 204, 179 210" stroke-width="0.9" opacity="0.6"/>
    </g>
  </g>

  <!-- 被风撕走的一页旧约（次级象征：断得干净） -->
  <g transform="translate(252 96) rotate(18)">
    <path d="M 0 0 L 12 -3 L 14 5 L 2 8 Z" fill="#c7cedd" opacity="0.35"/>
  </g>
</svg>
