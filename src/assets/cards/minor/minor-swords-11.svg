<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑侍从：立在风口，一手扶着未出鞘的剑，一手放飞纸带试风——先听风，再落剑">
  <defs>
    <linearGradient id="s11-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2338"/><stop offset="0.7" stop-color="#131a2c"/><stop offset="1" stop-color="#0e1422"/>
    </linearGradient>
    <linearGradient id="s11-gap" x1="1" y1="0" x2="0" y2="0.6">
      <stop offset="0" stop-color="#dfe8f6" stop-opacity="0.55"/><stop offset="1" stop-color="#dfe8f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s11-sky)"/>

  <!-- 冷光云隙（唯一叙事光源：右上高空一道窄缝，不再是大楔形） -->
  <path d="M 234 40 C 254 34, 276 34, 294 40 L 294 58 C 274 50, 254 48, 236 52 Z" fill="url(#s11-gap)"/>
  <path d="M 232 40 C 252 33, 274 33, 296 39" stroke="#dfe8f6" stroke-width="0.9" fill="none" opacity="0.5"/>
  <path d="M 234 56 C 254 50, 274 50, 294 58" stroke="#aebdd6" stroke-width="0.6" fill="none" opacity="0.3"/>
  <g fill="#c7cedd" opacity="0.45">
    <circle cx="60" cy="38" r="0.8"/><circle cx="120" cy="26" r="0.7"/><circle cx="176" cy="46" r="0.7"/>
  </g>

  <!-- 风线（横向掠过的流线，穿过全画） -->
  <g stroke="#6d7898" fill="none" opacity="0.6">
    <path d="M 0 108 C 60 100, 130 102, 196 96"/>
    <path d="M 0 136 C 70 130, 150 132, 226 124"/>
    <path d="M 0 176 C 60 172, 120 174, 176 168"/>
    <path d="M 20 216 C 90 210, 160 212, 224 206"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" fill="none" opacity="0.35">
    <path d="M 0 122 C 80 116, 170 118, 254 110"/>
    <path d="M 0 194 C 70 190, 150 192, 230 186"/>
  </g>

  <!-- 远山脊线（高地，主体所立之处） -->
  <path d="M 0 262 C 70 250, 140 248, 210 254 C 250 257, 280 260, 300 262" stroke="#39425c" stroke-width="1" opacity="0.8" fill="none"/>
  <path d="M 0 262 C 70 250, 140 248, 210 254 C 250 257, 280 260, 300 262 L 300 340 L 0 340 Z" fill="#0c111c"/>
  <g stroke="#232c44" stroke-width="0.7" opacity="0.6" fill="none">
    <path d="M 30 292 C 100 284, 190 284, 262 292"/>
  </g>
  <!-- 山石碎石 -->
  <g fill="#161d30">
    <ellipse cx="70" cy="300" rx="4" ry="2"/><ellipse cx="226" cy="292" rx="3.4" ry="1.8"/><ellipse cx="160" cy="318" rx="4" ry="2.2"/>
  </g>

  <!-- 侍从（主体：侧身直立微前倾，右手扶剑柄【未出鞘】，左手上举放飞纸带；视线画外右） -->
  <g>
    <!-- 剑（仍在鞘，斜挂；鞘贴腿，柄微露） -->
    <path d="M 148 226 L 140 296" stroke="#1a2236" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M 149.4 226.4 L 141.6 293" stroke="#39425c" stroke-width="0.8" opacity="0.8"/>
    <!-- 身体剪影（侧身，重心前倾） -->
    <path d="M 136 318
             C 136 300, 138 282, 142 266
             C 146 250, 152 238, 160 230
             C 166 224, 172 220, 178 218
             C 176 206, 178 194, 184 186
             C 190 178, 198 174, 206 176
             C 208 170, 212 166, 218 164
             C 214 158, 214 150, 220 146
             C 226 143, 232 146, 234 152
             C 235 158, 232 163, 227 165
             L 226 172
             C 226 184, 222 194, 214 200
             C 218 214, 218 232, 214 250
             C 210 272, 206 296, 204 318 Z"
          fill="#141a2c"/>
    <!-- 腿与靴 -->
    <path d="M 148 318 L 150 302 M 194 318 L 194 300" stroke="#141a2c" stroke-width="10" stroke-linecap="round"/>
    <!-- 头（侧影朝右） -->
    <path d="M 186 178 C 184 168, 190 158, 200 158 C 208 158, 214 164, 213 172 C 212 180, 205 184, 197 183 Z" fill="#141a2c"/>
    <!-- 侍从冠饰：细带+一枝风向羽饰（方向性） -->
    <path d="M 188 168 C 194 164, 202 163, 209 166" stroke="#8a93ad" stroke-width="1" fill="none"/>
    <path d="M 208 164 C 216 158, 224 158, 230 162 C 224 164, 218 166, 213 168 Z" fill="#aebdd6" opacity="0.85"/>
    <!-- 右手扶柄 -->
    <path d="M 166 232 C 160 234, 154 234, 150 232" stroke="#141a2c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="148" cy="228" r="3.2" fill="#1a2236" stroke="#8a93ad" stroke-width="0.9"/>
    <!-- 左臂上举，捏着纸带根部 -->
    <path d="M 222 168 C 228 160, 234 152, 240 144" stroke="#141a2c" stroke-width="6.4" fill="none" stroke-linecap="round"/>
    <!-- 风中纸带（>剑的存在感：受风的三段飘带） -->
    <g fill="none" stroke="#e8eefb">
      <path d="M 240 142 C 250 138, 258 140, 264 134 C 270 128, 278 128, 286 132" stroke-width="1.6" opacity="0.9"/>
      <path d="M 240 142 C 248 142, 254 146, 262 144 C 272 141, 280 144, 288 148" stroke-width="1" opacity="0.6"/>
      <path d="M 240 142 C 246 148, 250 154, 258 158 C 264 160, 268 164, 270 170" stroke-width="0.8" opacity="0.4"/>
    </g>
    <!-- 云隙轮廓光（右缘，加强以保证 96px 剪影可读） -->
    <g stroke="#dfe8f6" fill="none" opacity="0.85">
      <path d="M 200 178 C 206 172, 212 168, 218 166" stroke-width="1.2"/>
      <path d="M 212 202 C 216 216, 216 232, 213 248 C 211 262, 208 280, 206 296" stroke-width="1.1"/>
      <path d="M 184 186 C 182 194, 181 202, 181 210" stroke-width="0.9" opacity="0.6"/>
    </g>
    <!-- 腰带 -->
    <path d="M 146 240 C 158 244, 178 244, 196 240" stroke="#8a93ad" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>

  <!-- 风吹起的草茎（山的语言） -->
  <g stroke="#39425c" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 60 296 C 66 288, 66 280, 60 274"/>
    <path d="M 244 286 C 250 280, 252 272, 248 266"/>
  </g>
</svg>
