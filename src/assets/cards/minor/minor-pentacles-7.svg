<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币七：培育架上七枚环璧处于七个生长阶段，烛旁放着记录册">
  <defs>
    <radialGradient id="p7-ground" cx="70%" cy="40%" r="110%">
      <stop offset="0" stop-color="#151b10"/><stop offset="0.6" stop-color="#10150c"/><stop offset="1" stop-color="#090c06"/>
    </radialGradient>
    <radialGradient id="p7-candle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c687" stop-opacity="0.4"/><stop offset="1" stop-color="#e6c687" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p7-ground)"/>

  <!-- 培育架（棚架横杆，水平结构） -->
  <g>
    <path d="M 18 96 L 282 96" stroke="#8a93ad" stroke-width="1.6" opacity="0.85"/>
    <path d="M 18 92 L 282 92" stroke="#c7cedd" stroke-width="0.7" opacity="0.5"/>
    <g stroke="#8a93ad" stroke-width="1.1" opacity="0.6">
      <line x1="30" y1="96" x2="30" y2="238"/><line x1="282" y1="96" x2="282" y2="232"/>
      <line x1="96" y1="96" x2="92" y2="176"/><line x1="176" y1="96" x2="180" y2="186"/><line x1="242" y1="96" x2="238" y2="222"/>
    </g>
    <path d="M 18 238 L 282 234" stroke="#8a93ad" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- 七枚环璧：自左（新嵌的素环）到右（结果的熟环）挂在棚架藤上（生长阶段各异） -->
  <g>
    <!-- 1 素环：刚挂上，无藤 -->
    <g transform="translate(44 128)">
      <path d="M 0 -12 L 2 0" stroke="#6d5137" stroke-width="1.2" fill="none"/>
      <circle r="12" fill="none" stroke="#8f9c6e" stroke-width="2"/>
    </g>
    <!-- 2 环缘冒一颗芽点 -->
    <g transform="translate(78 122)">
      <path d="M 0 -12 L 0 6" stroke="#6d5137" stroke-width="1.2" fill="none"/>
      <circle r="12" fill="none" stroke="#93a171" stroke-width="2"/>
      <circle cx="4" cy="-9" r="1.6" fill="#9aa886"/>
    </g>
    <!-- 3 一片初叶 -->
    <g transform="translate(114 116)">
      <path d="M 0 -12 C 2 0, 2 6, 0 12" stroke="#6d5137" stroke-width="1.2" fill="none"/>
      <circle r="12.6" fill="none" stroke="#97a476" stroke-width="2"/>
      <path d="M 6 -7 C 10 -11, 15 -11, 17 -8 C 13 -5, 8 -5, 6 -7 Z" fill="#7d8f63"/>
    </g>
    <!-- 4 半缠藤 -->
    <g transform="translate(152 118)">
      <path d="M 0 -13 L -2 10" stroke="#6d5137" stroke-width="1.2" fill="none"/>
      <circle r="13" fill="none" stroke="#9aa878" stroke-width="2.1"/>
      <path d="M -11 -6 C -4 -10, 6 -10, 11 -4" stroke="#7d8f63" stroke-width="1.3" fill="none"/>
      <path d="M -8 2 C -2 -1, 6 -1, 10 3" stroke="#7d8f63" stroke-width="1.1" fill="none" opacity="0.85"/>
    </g>
    <!-- 5 缠满 + 一枚小果 -->
    <g transform="translate(190 116)">
      <path d="M 2 -13 L -2 12" stroke="#6d5137" stroke-width="1.2" fill="none"/>
      <circle r="13.4" fill="none" stroke="#9fae7c" stroke-width="2.2"/>
      <path d="M -12 -5 C -5 -11, 7 -11, 12 -3" stroke="#7d8f63" stroke-width="1.4" fill="none"/>
      <path d="M -11 4 C -4 0, 6 1, 11 6" stroke="#7d8f63" stroke-width="1.3" fill="none"/>
      <circle cx="8" cy="-8" r="2.4" fill="#a8b87a"/>
    </g>
    <!-- 6 熟环：苔色更深，双果 -->
    <g transform="translate(230 122)">
      <path d="M -2 -13 L 2 12" stroke="#6d5137" stroke-width="1.2" fill="none"/>
      <circle r="13.6" fill="none" stroke="#a8b87a" stroke-width="2.4"/>
      <path d="M -12 -4 C -5 -10, 7 -10, 12 -2" stroke="#7d8f63" stroke-width="1.5" fill="none"/>
      <path d="M -11 5 C -4 1, 6 2, 11 7" stroke="#7d8f63" stroke-width="1.4" fill="none"/>
      <circle cx="-7" cy="-7" r="2.6" fill="#a8b87a"/><circle cx="8" cy="-4" r="2.2" fill="#a8b87a"/>
    </g>
    <!-- 7 熟透：垂向架下，三果坠枝（评估与收成的对象） -->
    <g transform="translate(262 138)">
      <path d="M -6 -40 C -8 -28, -8 -14, -4 -2" stroke="#6d5137" stroke-width="1.4" fill="none"/>
      <circle r="14" fill="none" stroke="#b1c184" stroke-width="2.5"/>
      <path d="M -13 -3 C -6 -9, 6 -9, 13 -1" stroke="#7d8f63" stroke-width="1.5" fill="none"/>
      <path d="M -12 6 C -5 2, 6 3, 12 8" stroke="#7d8f63" stroke-width="1.4" fill="none"/>
      <circle cx="-8" cy="-8" r="2.8" fill="#b1c184"/><circle cx="7" cy="-5" r="2.6" fill="#b1c184"/>
      <circle cx="-2" cy="10" r="2.2" fill="#b1c184"/>
    </g>
  </g>

  <!-- 棚下的工作台沿：记录册与黄铜尺 -->
  <g>
    <path d="M 12 244 L 288 240 L 292 254 L 8 258 Z" fill="#1a2012" stroke="#c7cedd" stroke-width="1.4"/>
    <!-- 记录册（摊开，写着七个阶段） -->
    <g transform="translate(96 276) rotate(-2)">
      <path d="M -34 -9 C -20 -13, -4 -13, 0 -9 C 4 -13, 20 -13, 34 -9 L 34 9 C 20 5, 4 5, 0 9 C -4 5, -20 5, -34 9 Z"
            fill="#141b10" stroke="#a9b1c7" stroke-width="1.2"/>
      <path d="M 0 -9 L 0 9" stroke="#8a93ad" stroke-width="0.7"/>
      <g stroke="#a9b1c7" stroke-width="0.6" opacity="0.8">
        <path d="M -28 -3 L -8 -4 M -28 2 L -12 1 M 8 -4 L 28 -5 M 8 1 L 24 0"/>
      </g>
      <g fill="#a8b87a" opacity="0.9">
        <circle cx="-24" cy="-6.4" r="0.9"/><circle cx="14" cy="-7" r="0.9"/>
      </g>
    </g>
    <!-- 黄铜尺 -->
    <g transform="translate(196 284) rotate(-3)">
      <rect x="-30" y="-3.4" width="60" height="7" fill="#1f2413" stroke="#b28c4f" stroke-width="1.1"/>
      <g stroke="#b28c4f" stroke-width="0.7" opacity="0.9">
        <line x1="-22" y1="-3.4" x2="-22" y2="0"/><line x1="-14" y1="-3.4" x2="-14" y2="0.6"/>
        <line x1="-6" y1="-3.4" x2="-6" y2="0"/><line x1="2" y1="-3.4" x2="2" y2="0.6"/>
        <line x1="10" y1="-3.4" x2="10" y2="0"/><line x1="18" y1="-3.4" x2="18" y2="0.6"/>
      </g>
    </g>
  </g>

  <!-- 台端矮烛（唯一叙事光源：照看收成的一点暖） -->
  <g transform="translate(258 268)">
    <circle r="22" fill="url(#p7-candle)"/>
    <rect x="-4" y="-8" width="8" height="14" fill="#12180e" stroke="#8a93ad" stroke-width="1"/>
    <path d="M 0 -8 C 2.6 -12, 1.6 -17, 0 -20 C -1.6 -17, -2.6 -12, 0 -8 Z" fill="#e6c687"/>
    <ellipse cx="0" cy="6" rx="9" ry="2.4" fill="#0f130a" stroke="#8a93ad" stroke-width="0.9"/>
  </g>

  <!-- 落在熟环上的暖光斑（光源与最熟一环的呼应） -->
  <circle cx="262" cy="140" r="10" fill="url(#p7-candle)" opacity="0.7"/>

  <!-- 地面 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 40 306 L 116 306 M 170 316 L 250 316"/>
  </g>
</svg>
