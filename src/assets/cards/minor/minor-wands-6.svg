<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖六：归营营地，一杖高举先得火光，杖端桂环">
  <defs>
    <radialGradient id="w6-ground" cx="30%" cy="24%" r="105%">
      <stop offset="0" stop-color="#201812"/><stop offset="0.55" stop-color="#171009"/><stop offset="1" stop-color="#0e0a06"/>
    </radialGradient>
    <radialGradient id="w6-beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w6-staff" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#24150d"/><stop offset="0.55" stop-color="#3a2214"/><stop offset="1" stop-color="#8a4d2c"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w6-ground)"/>

  <!-- 远处归营烽火（唯一叙事光源：地平线上的暖光） -->
  <g transform="translate(238 178)">
    <circle r="34" fill="url(#w6-beacon)"/>
    <path d="M -3 8 L -3 -6 L 0 -10 L 3 -6 L 3 8 Z" fill="#0d0906" stroke="#8a5a3a" stroke-width="0.9"/>
    <path d="M 0 -10 C 3 -14, 2 -18, 0 -21 C -1 -17, -3 -15, 0 -10 Z" fill="#d9814e"/>
  </g>
  <!-- 营地栅栏与旗影（归营标记，横贯右带） -->
  <g>
    <path d="M 128 214 L 300 214" stroke="#8a93ad" stroke-width="1.1" opacity="0.65"/>
    <g stroke="#8a93ad" stroke-width="1.2" opacity="0.6">
      <line x1="140" y1="214" x2="140" y2="246"/><line x1="168" y1="214" x2="168" y2="248"/>
      <line x1="196" y1="214" x2="196" y2="246"/><line x1="224" y1="214" x2="224" y2="248"/>
      <line x1="252" y1="214" x2="252" y2="246"/><line x1="280" y1="214" x2="280" y2="248"/>
    </g>
    <!-- 旗影（收拢垂挂，非飘带） -->
    <path d="M 196 176 L 196 214" stroke="#8a93ad" stroke-width="1.4"/>
    <path d="M 196 178 L 222 182 L 216 194 L 196 192 Z" fill="#181008" stroke="#8a5a3a" stroke-width="0.9"/>
  </g>

  <!-- 归营的杖束：五杖交叠架上（竞争已过，收械入营） -->
  <g>
    <path d="M 52 268 L 148 268" stroke="#8a93ad" stroke-width="2" opacity="0.8"/>
    <path d="M 62 268 L 62 280 M 138 268 L 138 280" stroke="#8a93ad" stroke-width="1.6" opacity="0.7"/>
    <g stroke-linecap="round">
      <path d="M 66 266 L 120 226" stroke="#2e1b10" stroke-width="5"/>
      <path d="M 70 266 L 128 234" stroke="#241509" stroke-width="5"/>
      <path d="M 76 266 L 118 240" stroke="#33200f" stroke-width="5"/>
      <path d="M 82 266 L 132 246" stroke="#241509" stroke-width="5"/>
      <path d="M 60 262 L 112 246" stroke="#2e1b10" stroke-width="5"/>
    </g>
    <g stroke="#8a5a3a" stroke-width="0.7" opacity="0.8">
      <path d="M 70 258 L 116 230 M 78 260 L 126 240"/>
    </g>
    <!-- 束绳 -->
    <path d="M 92 252 C 96 248, 102 248, 106 252 M 94 256 C 98 252, 102 252, 104 255" fill="none" stroke="#a89278" stroke-width="1.1"/>
    <!-- 架下余烬 -->
    <g fill="#d9814e" opacity="0.8">
      <circle cx="84" cy="276" r="1.2"/><circle cx="104" cy="280" r="1"/><circle cx="120" cy="274" r="0.9"/>
    </g>
  </g>

  <!-- 高举的第六杖：自束中独立升起，先得远处火光（主视觉，强垂直动线） -->
  <g>
    <path d="M 96 268 L 96 84" stroke="url(#w6-staff)" stroke-width="6.4" stroke-linecap="round"/>
    <path d="M 94 262 L 94 96" stroke="#c98a54" stroke-width="1" opacity="0.85"/>
    <path d="M 99 250 L 99 120" stroke="#1a0e07" stroke-width="0.9" opacity="0.8"/>
    <!-- 木纹节 -->
    <g stroke="#1a0e07" stroke-width="0.7" opacity="0.7">
      <path d="M 93.4 190 C 95 188, 97 188, 98.6 190 M 93.6 150 C 95 148, 97 148, 98.4 150"/>
    </g>
    <!-- 杖端桂叶环（胜利标记，受光） -->
    <g transform="translate(96 74)">
      <ellipse rx="13" ry="8" fill="none" stroke="#c9a25c" stroke-width="1.6"/>
      <g fill="#9aa886" stroke="#c9a25c" stroke-width="0.6">
        <path d="M -13 0 C -16 -4, -15 -8, -11 -9 C -9 -5, -10 -2, -13 0 Z"/>
        <path d="M -8 -6 C -9 -11, -6 -14, -2 -13 C -2 -9, -5 -6, -8 -6 Z"/>
        <path d="M 0 -8 C 1 -13, 5 -14, 8 -12 C 6 -8, 3 -7, 0 -8 Z" transform="rotate(6)"/>
        <path d="M 13 0 C 16 -4, 15 -8, 11 -9 C 9 -5, 10 -2, 13 0 Z"/>
        <path d="M 8 -6 C 9 -11, 6 -14, 2 -13 C 2 -9, 5 -6, 8 -6 Z"/>
      </g>
      <!-- 环上受光的暖点（光源落点） -->
      <circle cx="9" cy="-8" r="1.6" fill="#f0c078"/>
    </g>
  </g>

  <!-- 上升的余烬星点（权杖家族语汇） -->
  <g fill="#d9814e" opacity="0.7">
    <circle cx="120" cy="150" r="1"/><circle cx="88" cy="120" r="0.9"/><circle cx="112" cy="92" r="0.8"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 268 C 60 264, 140 266, 220 268 C 250 269, 280 269, 300 268" fill="none" stroke="#c7cedd" stroke-width="1" opacity="0.5"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 40 292 L 120 292 M 180 302 L 260 302 M 70 314 L 150 314"/>
  </g>
</svg>
