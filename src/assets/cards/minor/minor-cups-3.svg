<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯三：三爵共酌的静物">
  <defs>
    <radialGradient id="c3-ground" cx="50%" cy="30%" r="92%">
      <stop offset="0" stop-color="#132029"/><stop offset="0.62" stop-color="#0f1a22"/><stop offset="1" stop-color="#091119"/>
    </radialGradient>
    <radialGradient id="c3-node" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fc2c9" stop-opacity="0.4"/><stop offset="1" stop-color="#6fc2c9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="c3-water" width="12" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 2.5 Q 3 0 6 2.5 T 12 2.5" fill="none" stroke="#6fc2c9" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#c3-ground)"/>

  <!-- 上方浅月与飘瓣 -->
  <g transform="translate(150 56)">
    <path d="M 5 -13 A 14 14 0 1 0 5 13 A 10.5 14 0 1 1 5 -13 Z" fill="#e9edf5" opacity="0.8"/>
  </g>
  <g fill="none" stroke="#c7cedd" opacity="0.6">
    <path d="M 92 96 C 95 92, 100 92, 102 96 C 99 99, 94 99, 92 96 Z" stroke-width="0.8"/>
    <path d="M 204 108 C 207 104, 212 104, 214 108 C 211 111, 206 111, 204 108 Z" stroke-width="0.8"/>
    <path d="M 150 84 C 152 81, 156 81, 158 84 C 156 87, 152 87, 150 84 Z" stroke-width="0.7"/>
  </g>
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="66" cy="70" r="1"/><circle cx="238" cy="66" r="1"/>
  </g>

  <!-- 石桌 -->
  <g>
    <path d="M 24 240 L 276 240 L 286 258 L 14 258 Z" fill="#101736" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 40 258 L 260 258 L 260 300 L 40 300 Z" fill="#0d1330" stroke="#8a93ad" stroke-width="0.9"/>
    <path d="M 14 258 L 286 258" stroke="#c7cedd" stroke-width="0.8" opacity="0.6"/>
    <path d="M 60 300 L 56 316 L 264 316 L 260 300" fill="none" stroke="#8a93ad" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 三爵：品字阵 -->
  <!-- 上爵（后） -->
  <g transform="translate(150 168)">
    <path d="M -26 -24 L 26 -24 C 26 -6, 17 3, 6 6 L 6 20 L 16 26 L -16 26 L -6 20 L -6 6 C -17 3, -26 -6, -26 -24 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M -21 -18 L 21 -18 C 19 -6, 11 0, 0 2 C -11 0, -19 -6, -21 -18 Z" fill="#101733"/>
    <path d="M -21 -17 C -13 -12, -6 -10, 0 -10 C 6 -10, 13 -12, 21 -17 L 20 -12 C 13 -8, 7 -6, 0 -6 C -7 -6, -13 -8, -20 -12 Z"
          fill="#6fc2c9" opacity="0.5"/>
    <ellipse cx="0" cy="-24" rx="26" ry="4" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
  </g>
  <!-- 左前爵 -->
  <g transform="translate(102 212)">
    <path d="M -26 -24 L 26 -24 C 26 -6, 17 3, 6 6 L 6 20 L 16 26 L -16 26 L -6 20 L -6 6 C -17 3, -26 -6, -26 -24 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M -21 -18 L 21 -18 C 19 -6, 11 0, 0 2 C -11 0, -19 -6, -21 -18 Z" fill="#101733"/>
    <path d="M -21 -17 C -13 -12, -6 -10, 0 -10 C 6 -10, 13 -12, 21 -17 L 20 -12 C 13 -8, 7 -6, 0 -6 C -7 -6, -13 -8, -20 -12 Z"
          fill="#6fc2c9" opacity="0.5"/>
    <ellipse cx="0" cy="-24" rx="26" ry="4" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
  </g>
  <!-- 右前爵 -->
  <g transform="translate(198 212)">
    <path d="M -26 -24 L 26 -24 C 26 -6, 17 3, 6 6 L 6 20 L 16 26 L -16 26 L -6 20 L -6 6 C -17 3, -26 -6, -26 -24 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M -21 -18 L 21 -18 C 19 -6, 11 0, 0 2 C -11 0, -19 -6, -21 -18 Z" fill="#101733"/>
    <path d="M -21 -17 C -13 -12, -6 -10, 0 -10 C 6 -10, 13 -12, 21 -17 L 20 -12 C 13 -8, 7 -6, 0 -6 C -7 -6, -13 -8, -20 -12 Z"
          fill="#6fc2c9" opacity="0.5"/>
    <ellipse cx="0" cy="-24" rx="26" ry="4" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
  </g>

  <!-- 杯间水线：连成三角（叙事光源在交点） -->
  <g fill="none" stroke="#6fc2c9" stroke-width="1.1" opacity="0.8">
    <path d="M 138 178 C 128 190, 116 194, 106 196"/>
    <path d="M 162 178 C 172 190, 184 194, 194 196"/>
    <path d="M 124 202 C 142 210, 158 210, 176 202"/>
  </g>
  <circle cx="150" cy="196" r="16" fill="url(#c3-node)"/>
  <circle cx="150" cy="196" r="1.8" fill="#6fc2c9"/>

  <!-- 桌沿落影与水痕 -->
  <path d="M 60 250 L 240 250 L 240 255 L 60 255 Z" fill="url(#c3-water)" opacity="0.4"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45">
    <line x1="70" y1="290" x2="120" y2="290"/><line x1="180" y1="290" x2="230" y2="290"/>
  </g>
</svg>
