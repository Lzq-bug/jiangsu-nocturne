<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖二：堡楼平台上的远眺者">
  <defs>
    <radialGradient id="w2-ground" cx="40%" cy="26%" r="95%">
      <stop offset="0" stop-color="#20170f"/><stop offset="0.6" stop-color="#181209"/><stop offset="1" stop-color="#0f0a07"/>
    </radialGradient>
    <radialGradient id="w2-dawn" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.4"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="w2-stone" width="16" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 16 5 M 8 0 L 8 5 M 0 5 L 0 10 M 16 5 L 16 10" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#w2-ground)"/>

  <!-- 夜海与天际（叙事光源：远处海平线的暖橙低光） -->
  <g>
    <ellipse cx="206" cy="150" rx="90" ry="20" fill="url(#w2-dawn)"/>
    <path d="M 0 152 L 300 152" stroke="#8a93ad" stroke-width="0.8" opacity="0.6"/>
    <path d="M 186 151 L 226 151" stroke="#d9814e" stroke-width="1.4" opacity="0.9"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.45" fill="none">
      <path d="M 140 162 L 176 162 M 196 168 L 244 168 M 150 176 L 200 176 M 210 182 L 252 182"/>
    </g>
    <g fill="#c7cedd" opacity="0.5">
      <circle cx="60" cy="60" r="1"/><circle cx="118" cy="42" r="0.9"/><circle cx="256" cy="70" r="1"/>
    </g>
  </g>

  <!-- 远方灯塔微光 -->
  <g transform="translate(238 138)">
    <path d="M -3 14 L -1.4 -8 L 1.4 -8 L 3 14 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.8"/>
    <path d="M -1.8 -8 L 1.8 -8 L 0.9 -12 L -0.9 -12 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.7"/>
    <circle cx="0" cy="-9.6" r="1.3" fill="#d9814e"/>
  </g>

  <!-- 堡楼平台（下带）：城垛 + 石纹 -->
  <g>
    <path d="M 0 216 L 300 216 L 300 340 L 0 340 Z" fill="#0d1226" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 0 216 L 300 216 L 300 232 L 0 232 Z" fill="url(#w2-stone)" opacity="0.9"/>
    <path d="M 0 216 L 300 216" stroke="#c7cedd" stroke-width="1.6"/>
    <g fill="#0d1226" stroke="#c7cedd" stroke-width="1.1">
      <path d="M 20 216 L 20 202 L 40 202 L 40 216 Z M 64 216 L 64 202 L 84 202 L 84 216 Z M 108 216 L 108 202 L 128 202 L 128 216 Z"/>
    </g>
    <path d="M 0 260 L 300 260" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    <path d="M 0 300 L 300 300" stroke="#8a93ad" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- 远眺者：背身剪影倚垛 -->
  <g>
    <path d="M 106 216
             C 110 196, 112 176, 118 162
             C 122 150, 132 142, 144 142
             L 150 132 A 7 7 0 0 1 162 134
             L 158 146
             C 170 152, 176 164, 178 178
             L 182 216 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <!-- 扶在垛上的手 -->
    <path d="M 150 176 C 144 184, 138 190, 130 194" fill="none" stroke="#c7cedd" stroke-width="1.3" opacity="0.8"/>
    <!-- 刻纹小球（世界在掌中缩小） -->
    <g transform="translate(96 200)">
      <circle r="10" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <ellipse rx="10" ry="4" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.7"/>
      <ellipse rx="4" ry="10" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.7"/>
    </g>
  </g>

  <!-- 另一根杖：斜倚墙边 -->
  <g>
    <path d="M 52 300 L 88 172 L 96 174 L 62 302 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 88 172 C 84 168, 84 162, 88 158 C 93 162, 94 168, 92 172 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
    <path d="M 62 302 L 54 316 M 62 302 L 72 314" stroke="#c7cedd" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- 平台上的落影 -->
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4">
    <line x1="118" y1="228" x2="176" y2="228"/><line x1="70" y1="252" x2="104" y2="252"/>
  </g>
</svg>
