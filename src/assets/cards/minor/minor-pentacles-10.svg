<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币十：旧工坊一角的木柜，三代环璧与两代工具，交接册摊开——资源跨过岁月的手">
  <defs>
    <radialGradient id="p10-room" cx="62%" cy="34%" r="125%">
      <stop offset="0" stop-color="#191610"/><stop offset="0.55" stop-color="#12100b"/><stop offset="1" stop-color="#0a0906"/>
    </radialGradient>
    <radialGradient id="p10-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c687" stop-opacity="0.42"/><stop offset="1" stop-color="#e6c687" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p10-room)"/>

  <!-- 工坊墙（木梁与暗墙板） -->
  <path d="M 0 74 H 300" stroke="#33291a" stroke-width="1.2" opacity="0.8"/>
  <path d="M 0 76 H 300" stroke="#c7cedd" stroke-width="0.5" opacity="0.14"/>
  <g stroke="#231c10" stroke-width="0.8" opacity="0.8" fill="none">
    <path d="M 0 128 H 300 M 0 186 H 300 M 0 246 H 300"/>
    <path d="M 58 74 V 128 M 130 74 V 128 M 205 74 V 128 M 262 74 V 128"/>
  </g>
  <g fill="#c7cedd" opacity="0.22">
    <circle cx="40" cy="44" r="0.8"/><circle cx="110" cy="34" r="0.7"/><circle cx="180" cy="50" r="0.7"/>
  </g>

  <!-- 墙面挂具：两代工具（旧锛新凿，挂痕方向一致——工坊的语言没换过） -->
  <g stroke="#5d6a52" stroke-width="0.8" fill="none" opacity="0.9">
    <!-- 旧锛（木柄磨亮） -->
    <path d="M 40 84 L 40 118" stroke="#6d5137" stroke-width="3.4"/>
    <path d="M 34 118 L 48 118 L 46 126 L 36 126 Z" fill="#39412f" stroke="#8a93ad" stroke-width="0.7"/>
    <!-- 新凿 -->
    <path d="M 74 88 L 74 112" stroke="#8a93ad" stroke-width="2.2"/>
    <path d="M 71 88 L 77 88 L 76 82 L 72 82 Z" fill="#5d6a52" stroke="#8a93ad" stroke-width="0.6"/>
    <!-- 老锤 -->
    <path d="M 96 86 L 96 116" stroke="#6d5137" stroke-width="3"/>
    <rect x="88" y="80" width="17" height="8" fill="#39412f" stroke="#8a93ad" stroke-width="0.7"/>
    <!-- 挂钩 -->
    <g stroke="#8a93ad" stroke-width="0.8">
      <path d="M 40 80 V 84 M 74 84 V 88 M 96 82 V 86"/>
    </g>
  </g>

  <!-- 立式木柜（主体：多屉，闭柜，脚枨落地；正面偏右） -->
  <g>
    <rect x="168" y="128" width="112" height="182" fill="#1c1710" stroke="#6d5137" stroke-width="1.4"/>
    <!-- 屉面（四屉，铜拉手，屉缝吃光不同） -->
    <g stroke="#4a3a22" stroke-width="1" fill="#171208">
      <rect x="176" y="138" width="96" height="34"/>
      <rect x="176" y="180" width="96" height="34"/>
      <rect x="176" y="222" width="96" height="34"/>
      <rect x="176" y="264" width="96" height="36"/>
    </g>
    <g stroke="#c7cedd" stroke-width="0.5" opacity="0.16" fill="none">
      <path d="M 178 140 H 270 M 178 182 H 270 M 178 224 H 270 M 178 266 H 270"/>
    </g>
    <g fill="#b28c4f">
      <circle cx="224" cy="155" r="2.2"/><circle cx="224" cy="197" r="2.2"/><circle cx="224" cy="239" r="2.2"/><circle cx="224" cy="282" r="2.2"/>
    </g>
    <!-- 刻年份铭牌（第二屉上沿：跨代的时间证据） -->
    <rect x="196" y="172" width="56" height="6" fill="#241c10" stroke="#b28c4f" stroke-width="0.6"/>
    <g stroke="#b28c4f" stroke-width="0.8" opacity="0.9">
      <path d="M 202 175 H 208 M 212 173.4 V 176.6 M 216 175 H 222 M 226 173.4 V 176.6 M 230 175 H 236 M 240 173.4 V 176.6 M 244 175 H 248"/>
    </g>
    <!-- 柜脚枨 -->
    <path d="M 172 310 H 276" stroke="#4a3a22" stroke-width="2.4"/>
    <path d="M 178 310 V 318 M 270 310 V 318" stroke="#4a3a22" stroke-width="2.4"/>
    <!-- 柜侧木纹 -->
    <g stroke="#33291a" stroke-width="0.7" opacity="0.8" fill="none">
      <path d="M 172 152 H 168 M 172 200 H 168 M 276 170 H 280 M 276 246 H 280"/>
    </g>
  </g>

  <!-- 唯一叙事光源：柜顶油灯（暖，照亮交接的一角） -->
  <g>
    <circle cx="252" cy="106" r="20" fill="url(#p10-lamp)"/>
    <path d="M 246 116 C 245 106, 248 100, 252 100 C 256 100, 259 106, 258 116 Z" fill="#1a150c" stroke="#b28c4f" stroke-width="1"/>
    <path d="M 248 116 H 256" stroke="#b28c4f" stroke-width="1"/>
    <path d="M 250 102 C 250 98, 254 98, 254 102" stroke="#e6c687" stroke-width="1.2" fill="none"/>
    <path d="M 252 106 C 251 103, 253 101, 252 99" stroke="#e6c687" stroke-width="0.9" fill="none" opacity="0.8"/>
    <circle cx="252" cy="104" r="1.4" fill="#e6c687"/>
  </g>

  <!-- 柜顶三代环璧（传承的实物序列：旧裂→常用→新成） -->
  <g>
    <!-- 祖辈的旧环（缺了一角，被灯照出裂痕） -->
    <circle cx="192" cy="116" r="11" fill="#26221a" stroke="#8a7a5a" stroke-width="1.4"/>
    <circle cx="192" cy="116" r="5.6" fill="#12100b"/>
    <path d="M 183.5 122 A 11 11 0 0 0 191 127" stroke="#12100b" stroke-width="2.4" fill="none"/>
    <path d="M 186 110 A 11 11 0 0 1 194 105.4" stroke="#e6c687" stroke-width="0.9" fill="none" opacity="0.75"/>
    <path d="M 197 122 L 200 126" stroke="#12100b" stroke-width="0.9" opacity="0.9"/>
    <!-- 父辈的常用环（绳孔磨圆，中段有包浆亮线） -->
    <circle cx="218" cy="118" r="9.6" fill="#2b261c" stroke="#9a8a64" stroke-width="1.3"/>
    <circle cx="218" cy="118" r="4.6" fill="#12100b"/>
    <path d="M 210.5 114 A 9.6 9.6 0 0 1 224 110.4" stroke="#e6c687" stroke-width="0.8" fill="none" opacity="0.65"/>
    <!-- 新成的环（最近完工，受灯最多，刃口干净） -->
    <circle cx="238" cy="120" r="8.2" fill="#332c1e" stroke="#b28c4f" stroke-width="1.2"/>
    <circle cx="238" cy="120" r="3.8" fill="#12100b"/>
    <path d="M 231.6 116.4 A 8.2 8.2 0 0 1 243 112.6" stroke="#e6c687" stroke-width="1" fill="none" opacity="0.9"/>
    <!-- 交接绳（三环以旧麻绳串系，搭在柜沿） -->
    <path d="M 192 127 C 200 132, 210 131, 218 127.6 C 226 130, 232 129, 238 128.2" stroke="#8a7a5a" stroke-width="1" fill="none" opacity="0.85"/>
    <path d="M 200 131 C 202 134, 206 135, 209 133" stroke="#8a7a5a" stroke-width="0.8" fill="none" opacity="0.7"/>
  </g>

  <!-- 案凳与交接册（左下：手艺与账目一起交下去） -->
  <g>
    <rect x="34" y="238" width="86" height="10" fill="#1c1710" stroke="#6d5137" stroke-width="1.1"/>
    <path d="M 42 248 V 292 M 112 248 V 292 M 42 270 H 112" stroke="#4a3a22" stroke-width="2"/>
    <!-- 摊开的册页 -->
    <g>
      <path d="M 44 232 C 58 228, 70 228, 77 232 L 77 238 L 44 238 Z" fill="#c7cedd" opacity="0.14"/>
      <path d="M 44 232 L 77 232" stroke="#c7cedd" stroke-width="0.7" opacity="0.35"/>
      <g stroke="#8a93ad" stroke-width="0.55" opacity="0.5">
        <path d="M 49 234.4 H 72 M 49 236.2 H 66"/>
      </g>
    </g>
    <!-- 一枚准备交出去的新坯环（在册边） -->
    <circle cx="90" cy="232" r="5.4" fill="#2b261c" stroke="#8a93ad" stroke-width="0.9"/>
    <circle cx="90" cy="232" r="2.4" fill="#12100b"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 292 C 90 288, 210 288, 300 292 L 300 340 L 0 340 Z" fill="#0d0b07"/>
  <g stroke="#231c10" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 30 314 C 110 308, 200 308, 274 314"/>
  </g>
  <!-- 灯光在地面的暖痕（弱） -->
  <path d="M 226 316 C 238 314, 252 314, 262 316" stroke="#e6c687" stroke-width="0.7" fill="none" opacity="0.25"/>
</svg>
