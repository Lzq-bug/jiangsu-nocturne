<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币侍从：单膝跪地抱起大于自己半身的环璧，抬头看前方的路——物比人重，路比物长">
  <defs>
    <radialGradient id="p11-dusk" cx="26%" cy="30%" r="130%">
      <stop offset="0" stop-color="#1c1a12"/><stop offset="0.55" stop-color="#14120c"/><stop offset="1" stop-color="#0b0a06"/>
    </radialGradient>
    <radialGradient id="p11-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9b478" stop-opacity="0.42"/><stop offset="1" stop-color="#d9b478" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p11-dusk)"/>

  <!-- 唯一叙事光源：左侧低天黄昏残照（暖） -->
  <circle cx="54" cy="96" r="34" fill="url(#p11-sun)"/>
  <circle cx="54" cy="96" r="8" fill="#d9b478" opacity="0.8"/>
  <path d="M 0 118 C 40 114, 80 114, 120 118" stroke="#8a7a52" stroke-width="0.7" opacity="0.4" fill="none"/>

  <!-- 远处堡楼与园墙剪影（星币环境语汇） -->
  <g fill="#12110b">
    <path d="M 218 150 L 218 122 L 224 122 L 224 112 L 228 106 L 232 112 L 232 122 L 238 122 L 238 150 Z"/>
    <rect x="244" y="132" width="56" height="18"/>
  </g>
  <path d="M 0 150 C 90 146, 200 147, 300 150" stroke="#39412f" stroke-width="0.8" opacity="0.5" fill="none"/>

  <!-- 田垄线（自远及近） -->
  <g stroke="#23241622" fill="none">
    <path d="M 0 180 C 80 176, 200 176, 300 180" stroke="#2a2d1c" stroke-width="0.8" opacity="0.6"/>
    <path d="M 0 214 C 70 208, 210 208, 300 213" stroke="#2f3220" stroke-width="0.8" opacity="0.7"/>
  </g>
  <!-- 垄上小苗 -->
  <g stroke="#39412f" stroke-width="0.9" fill="none" opacity="0.8">
    <path d="M 46 178 C 46 172, 44 168, 40 166 M 46 178 C 46 172, 48 168, 52 166"/>
    <path d="M 254 182 C 254 176, 252 172, 248 170 M 254 182 C 254 176, 256 172, 260 170"/>
  </g>

  <!-- 侍从（主体：单膝跪地，双臂抱环璧于胸前，环大于其上半身；视线前方偏上） -->
  <g>
    <!-- 环璧（先画环，人臂再抱上去：环大——直径≈人上半身宽） -->
    <g>
      <circle cx="150" cy="238" r="40" fill="#2e3324" stroke="#556042" stroke-width="2"/>
      <circle cx="150" cy="238" r="40" fill="none" stroke="#c7cedd" stroke-width="1.1" opacity="0.8"/>
      <circle cx="150" cy="238" r="29" fill="#14120c"/>
      <!-- 工艺刻纹与刮痕 -->
      <g stroke="#8f9a7d" stroke-width="0.7" fill="none" opacity="0.7">
        <path d="M 150 199 A 39 39 0 0 1 182 214"/>
        <path d="M 186 262 A 39 39 0 0 1 158 276.6"/>
      </g>
      <path d="M 118 226 L 126 232" stroke="#3c442c" stroke-width="0.8" opacity="0.9"/>
      <ellipse cx="124" cy="258" rx="4" ry="2.4" fill="#4a5636" opacity="0.9"/>
      <!-- 黄昏残照在环上缘的银暖棱 -->
      <path d="M 118 218 A 40 40 0 0 1 172 208" stroke="#d9b478" stroke-width="1" opacity="0.6" fill="none"/>
    </g>
    <!-- 身体剪影（跪姿：一膝着地，一膝立起） -->
    <path d="M 120 318
             C 118 300, 118 284, 122 270
             C 126 256, 134 246, 146 240
             L 150 214
             C 148 202, 150 192, 158 186
             C 166 180, 176 182, 180 190
             C 183 196, 182 204, 178 210
             L 174 232
             C 180 240, 184 252, 186 266
             C 188 284, 188 302, 188 318 Z"
          fill="#191712"/>
    <!-- 立起的膝（前） -->
    <path d="M 176 318 L 176 300 C 182 296, 190 298, 192 304 L 192 318 Z" fill="#191712"/>
    <!-- 着地的腿（后，跪） -->
    <path d="M 122 318 L 122 306 C 130 302, 140 304, 144 310 L 144 318 Z" fill="#191712"/>
    <!-- 头（侧影，微抬望向前路） -->
    <path d="M 156 184 C 154 174, 160 166, 169 166 C 177 166, 182 172, 181 180 C 180 187, 174 191, 167 190 Z" fill="#191712"/>
    <!-- 侍从冠饰：细苔环（轻小、不完整） -->
    <path d="M 158 176 C 163 171, 171 170, 178 173" stroke="#5d6a52" stroke-width="1.2" fill="none"/>
    <circle cx="163" cy="171.4" r="1.3" fill="#6d7a52" opacity="0.9"/>
    <!-- 抱环的双臂（环上交叉） -->
    <path d="M 136 232 C 128 240, 126 252, 130 262 C 136 272, 148 278, 162 278" stroke="#191712" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 182 214 C 188 224, 190 238, 188 252" stroke="#191712" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 黄昏轮廓光（左缘+臂上缘） -->
    <g stroke="#d9b478" fill="none" opacity="0.6">
      <path d="M 122 292 C 119 276, 119 260, 123 246" stroke-width="1"/>
      <path d="M 137 231 C 131 239, 128 249, 130 259" stroke-width="0.8"/>
      <path d="M 158 186 C 162 181, 168 178, 173 178" stroke-width="0.8"/>
    </g>
    <!-- 旅装腰带 -->
    <path d="M 126 272 C 142 276, 168 276, 184 272" stroke="#8a7a52" stroke-width="1.4" fill="none" opacity="0.7"/>
  </g>

  <!-- 前方的路（视线去处：垄道向远处收窄） -->
  <g stroke="#3a3d26" stroke-width="0.8" fill="none" opacity="0.7">
    <path d="M 190 322 C 216 306, 240 284, 252 258"/>
    <path d="M 212 326 C 234 312, 254 292, 264 268"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 300 C 80 296, 200 296, 300 300 L 300 340 L 0 340 Z" fill="#0e0d08"/>
  <g stroke="#242616" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 30 322 C 110 316, 210 316, 280 322"/>
  </g>
  <!-- 环璧落放前的垫草（准备放下的位置） -->
  <g stroke="#4a4f30" stroke-width="0.8" fill="none" opacity="0.7">
    <path d="M 96 322 C 104 318, 112 318, 120 322 M 118 326 C 126 322, 134 322, 142 326"/>
  </g>
</svg>
