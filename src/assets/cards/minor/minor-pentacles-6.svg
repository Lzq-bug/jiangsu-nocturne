<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币六：柜台上被楔子架起的陶瓮，环币倾注分配，多寡有记账">
  <defs>
    <radialGradient id="p6-ground" cx="62%" cy="34%" r="110%">
      <stop offset="0" stop-color="#161c10"/><stop offset="0.6" stop-color="#10150c"/><stop offset="1" stop-color="#090c06"/>
    </radialGradient>
    <radialGradient id="p6-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c687" stop-opacity="0.4"/><stop offset="1" stop-color="#e6c687" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p6-ground)"/>

  <!-- 背墙：分配的墨线账（正字计数，工艺坊的记账习惯） -->
  <g>
    <rect x="196" y="58" width="76" height="94" fill="#10150c" stroke="#8a93ad" stroke-width="1.1"/>
    <g stroke="#a9b1c7" stroke-width="1" opacity="0.75">
      <path d="M 206 74 L 228 72 M 206 82 L 228 80 M 206 90 L 228 88 M 206 98 L 228 96 M 214 70 L 220 100"/>
      <path d="M 238 74 L 260 72 M 238 82 L 260 80 M 238 90 L 260 88 M 238 98 L 260 96 M 246 70 L 252 100"/>
    </g>
    <path d="M 206 116 L 262 113" stroke="#a8b87a" stroke-width="0.9" opacity="0.8"/>
    <path d="M 206 128 L 244 126" stroke="#a9b1c7" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 柜台油灯（唯一叙事光源：分配时刻的一点暖光） -->
  <g transform="translate(262 148)">
    <circle r="20" fill="url(#p6-lamp)"/>
    <path d="M -6 12 C -6 8, 6 8, 6 12 L 5 17 L -5 17 Z" fill="#12180e" stroke="#8a93ad" stroke-width="1"/>
    <path d="M 0 7 C 2.6 4, 1.6 0, 0 -2.6 C -1.6 0, -2.6 4, 0 7 Z" fill="#e6c687"/>
    <path d="M -10 17 L 10 17" stroke="#8a93ad" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- 柜台（水平横贯，星币水平结构语汇） -->
  <g>
    <path d="M 10 178 L 290 172 L 296 196 L 4 202 Z" fill="#1a2012" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 10 184 L 290 178" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4">
      <path d="M 40 192 L 110 191 M 150 190 L 220 189"/>
    </g>
    <!-- 柜身 -->
    <path d="M 4 202 L 296 196 L 296 210 L 4 216 Z" fill="#12180e" stroke="#8a93ad" stroke-width="0.9" opacity="0.95"/>
  </g>

  <!-- 被楔子架起的陶瓮（给予被安排成装置，无手持物） -->
  <g transform="translate(96 118) rotate(-24)">
    <path d="M -30 -34 C -34 -12, -34 12, -28 34 L 28 34 C 34 12, 34 -12, 30 -34 C 20 -42, -20 -42, -30 -34 Z"
          fill="#141b10" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M -16 -42 L 16 -42 L 14 -34 L -14 -34 Z" fill="#141b10" stroke="#c7cedd" stroke-width="1.2"/>
    <!-- 瓮口满出的环币 -->
    <g fill="none" stroke="#a8b87a" stroke-width="1.1">
      <circle cx="-8" cy="-40" r="4.4"/><circle cx="2" cy="-43" r="4.4"/><circle cx="11" cy="-39" r="4.4"/>
    </g>
    <circle cx="2" cy="-43" r="1.4" fill="#a8b87a"/>
    <!-- 瓮身环璧刻纹 -->
    <path d="M -22 6 C -10 2, 10 2, 22 6" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
  </g>
  <!-- 楔木 -->
  <path d="M 52 172 L 76 150 L 82 158 L 60 178 Z" fill="#12180e" stroke="#8a93ad" stroke-width="1"/>

  <!-- 倾注的环币流（主动线：对角下落） -->
  <g fill="none" stroke="#a8b87a" stroke-width="1.2">
    <circle cx="128" cy="152" r="4.6"/><circle cx="138" cy="166" r="4.6"/><circle cx="146" cy="182" r="4.6"/>
  </g>
  <g fill="#a8b87a" opacity="0.9">
    <circle cx="133" cy="159" r="1.3"/><circle cx="142" cy="174" r="1.3"/><circle cx="150" cy="190" r="1.3"/>
  </g>

  <!-- 下方的受盆：已积一层环币（多得的一侧） -->
  <g>
    <path d="M 112 232 C 108 214, 116 200, 136 198 C 156 200, 164 214, 160 232 Z"
          fill="#141b10" stroke="#c7cedd" stroke-width="1.4" transform="translate(28 0)"/>
    <g fill="none" stroke="#a8b87a" stroke-width="1.1" transform="translate(28 0)">
      <circle cx="124" cy="228" r="5"/><circle cx="136" cy="226" r="5"/><circle cx="148" cy="228" r="5"/>
      <circle cx="130" cy="219" r="5"/><circle cx="142" cy="219" r="5"/>
    </g>
    <circle cx="136" cy="219" r="1.6" fill="#a8b87a" transform="translate(28 0)"/>
  </g>

  <!-- 左侧的小碟：只有一枚（寡得的一侧；不对称关系） -->
  <g transform="translate(48 224)">
    <path d="M -16 6 C -14 -2, 14 -2, 16 6 C 8 10, -8 10, -16 6 Z" fill="#141b10" stroke="#8a93ad" stroke-width="1.1"/>
    <circle cx="0" cy="1" r="5.4" fill="none" stroke="#a8b87a" stroke-width="1.3"/>
    <circle cx="0" cy="1" r="1.5" fill="#a8b87a"/>
  </g>

  <!-- 地面与影 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 40 288 L 120 288 M 170 300 L 254 300 M 80 316 L 160 316"/>
  </g>
  <path d="M 112 244 L 176 244 L 170 254 L 118 254 Z" fill="#e6c687" opacity="0.07"/>
</svg>
