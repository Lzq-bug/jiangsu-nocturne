<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯七：遮布下的诸器与唯一亮起的一盏">
  <defs>
    <radialGradient id="c7-ground" cx="72%" cy="60%" r="105%">
      <stop offset="0" stop-color="#101c26"/><stop offset="0.6" stop-color="#0c141d"/><stop offset="1" stop-color="#070d14"/>
    </radialGradient>
    <radialGradient id="c7-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fc2c9" stop-opacity="0.5"/><stop offset="1" stop-color="#6fc2c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c7-ground)"/>

  <!-- 后墙暗层 -->
  <path d="M 0 0 L 300 0 L 300 208 L 0 208 Z" fill="#0a1018" opacity="0.6"/>
  <path d="M 0 208 L 300 208" stroke="#8a93ad" stroke-width="0.7" opacity="0.4"/>

  <!-- 桌：横向长案，波褶桌布（圣杯横向波弧语汇） -->
  <g>
    <path d="M 12 236 C 60 230, 120 232, 170 236 C 220 240, 268 240, 296 236 L 300 252 C 240 258, 160 258, 90 254 C 60 252, 30 250, 8 250 Z"
          fill="#141c2c" stroke="#c7cedd" stroke-width="1.4"/>
    <g stroke="#8a93ad" stroke-width="0.7" opacity="0.55" fill="none">
      <path d="M 24 246 C 44 242, 64 242, 82 245 M 110 250 C 132 247, 154 247, 176 249 M 208 250 C 230 248, 252 248, 274 246"/>
    </g>
    <!-- 桌布垂褶（波弧） -->
    <g stroke="#8a93ad" stroke-width="0.8" opacity="0.5" fill="none">
      <path d="M 40 252 C 44 268, 42 282, 36 296 M 96 256 C 100 272, 98 288, 92 302 M 160 256 C 164 272, 162 286, 158 300 M 232 252 C 236 268, 234 282, 228 296"/>
    </g>
    <path d="M 8 250 C 60 256, 160 258, 300 252 L 300 262 C 200 268, 80 266, 8 260 Z" fill="#0d1320" stroke="#8a93ad" stroke-width="0.8" opacity="0.9"/>
  </g>

  <!-- 七器：布下六器形态各异，仅一器亮起（自左至右：高、矮阔、双峰、锥、半露、垂足） -->
  <g>
    <!-- 1 高壼罩布 -->
    <g>
      <path d="M 52 236 C 48 210, 52 184, 64 172 C 72 164, 82 164, 88 172 C 96 184, 98 212, 94 236 Z"
            fill="#0b0f18" stroke="#6d7590" stroke-width="1.1"/>
      <path d="M 58 216 C 62 210, 66 210, 70 216 M 60 196 C 64 190, 70 190, 74 196" fill="none" stroke="#5d6780" stroke-width="0.6" opacity="0.8"/>
    </g>
    <!-- 2 矮阔缽罩布 -->
    <g>
      <path d="M 104 236 C 100 224, 106 210, 120 208 C 134 210, 140 224, 136 236 Z"
            fill="#0b0f18" stroke="#6d7590" stroke-width="1"/>
      <path d="M 112 224 C 118 220, 124 220, 128 224" fill="none" stroke="#5d6780" stroke-width="0.6" opacity="0.8"/>
    </g>
    <!-- 3 双峰罩布（两件叠藏） -->
    <g>
      <path d="M 148 236 C 146 226, 150 216, 158 214 C 164 213, 168 216, 170 220 C 172 214, 178 210, 184 212 C 192 215, 194 226, 192 236 Z"
            fill="#0b0f18" stroke="#6d7590" stroke-width="1"/>
    </g>
    <!-- 4 锥形罩布 + 系签 -->
    <g>
      <path d="M 200 236 L 206 186 C 207 182, 211 182, 212 186 L 218 236 Z"
            fill="#0b0f18" stroke="#6d7590" stroke-width="1"/>
      <rect x="213" y="200" width="10" height="7" fill="#141c2c" stroke="#6d7590" stroke-width="0.6" transform="rotate(8 218 203)"/>
      <path d="M 212 196 L 217 201" stroke="#6d7590" stroke-width="0.6"/>
    </g>
    <!-- 5 布半滑落，露出一足（诱惑之相） -->
    <g>
      <path d="M 236 236 C 232 222, 238 206, 252 202 C 258 200, 264 202, 268 206 L 262 236 Z"
            fill="#0b0f18" stroke="#6d7590" stroke-width="1"/>
      <path d="M 244 236 L 246 224 M 243 224 C 246 222, 250 222, 252 224" fill="none" stroke="#a9b1c7" stroke-width="0.9"/>
    </g>
    <!-- 6 垂足杯罩布 -->
    <g>
      <path d="M 262 236 C 260 224, 264 214, 272 212 C 280 214, 284 224, 282 236 Z"
            fill="#0b0f18" stroke="#6d7590" stroke-width="1" opacity="0.9"/>
      <path d="M 272 236 L 272 244 M 267 246 L 277 246" stroke="#6d7590" stroke-width="1" opacity="0.9"/>
    </g>
  </g>

  <!-- 唯一亮起的一盏：未罩的爵 + 旁边的一粒灯（唯一叙事光源，右端） -->
  <g transform="translate(300 0)">
    <g transform="translate(-16 0)">
      <circle cx="0" cy="222" r="26" fill="url(#c7-lamp)"/>
      <!-- 爵 -->
      <path d="M -11 212 L 11 212 C 11 219, 7 223, 3 225 L 3 231 L 8 235 L -8 235 L -3 231 L -3 225 C -7 223, -11 219, -11 212 Z"
            fill="#0e1620" stroke="#dfe4ef" stroke-width="1.5"/>
      <ellipse cx="0" cy="212" rx="11" ry="2.4" fill="none" stroke="#dfe4ef" stroke-width="1.1"/>
      <path d="M -9 214 C -4 217, 4 217, 9 214 L 8 217 C 3 219, -3 219, -8 217 Z" fill="#6fc2c9" opacity="0.8"/>
      <path d="M 0 235 L 0 241 M -5 243 L 5 243" stroke="#dfe4ef" stroke-width="1.1"/>
      <!-- 爵口水面反着灯色 -->
      <ellipse cx="0" cy="212" rx="6" ry="1.2" fill="#8ed8de" opacity="0.95"/>
      <!-- 桌布上的光池 -->
      <path d="M -22 244 C -8 240, 8 240, 22 244 L 18 250 L -18 250 Z" fill="#6fc2c9" opacity="0.14"/>
    </g>
    <!-- 灯盏（豆） -->
    <g transform="translate(8 0)">
      <path d="M -5 238 C -5 234, 5 234, 5 238 L 4 243 L -4 243 Z" fill="#0e1620" stroke="#8a93ad" stroke-width="1"/>
      <path d="M 0 233 C 2.4 230, 1.4 226, 0 223.6 C -1.4 226, -2.4 230, 0 233 Z" fill="#8ed8de"/>
      <circle cx="0" cy="227" r="8" fill="url(#c7-lamp)"/>
    </g>
  </g>

  <!-- 桌面签纸散点（档案语境，极小） -->
  <g fill="#141c2c" stroke="#8a93ad" stroke-width="0.5" opacity="0.8">
    <rect x="120" y="228" width="9" height="6" transform="rotate(-6 124 231)"/>
    <rect x="186" y="230" width="9" height="6" transform="rotate(5 190 233)"/>
  </g>

  <!-- 地面 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 30 316 L 110 316 M 190 322 L 268 322"/>
  </g>
</svg>
