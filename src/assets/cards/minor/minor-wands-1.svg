<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖王牌：初燃的活木之杖">
  <defs>
    <radialGradient id="wnd-ground" cx="46%" cy="34%" r="90%">
      <stop offset="0" stop-color="#241812"/><stop offset="0.6" stop-color="#1a1410"/><stop offset="1" stop-color="#100b09"/>
    </radialGradient>
    <radialGradient id="wnd-flame" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wnd-bark" width="8" height="16" patternUnits="userSpaceOnUse">
      <path d="M 2 0 C 1 6, 3 10, 2 16 M 6 0 C 5 6, 7 10, 6 16" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#wnd-ground)"/>

  <!-- 火星（余烬上升） -->
  <g fill="#d9814e">
    <circle cx="234" cy="64" r="1.6" opacity="0.9"/>
    <circle cx="210" cy="44" r="1.1" opacity="0.7"/>
    <circle cx="252" cy="96" r="1.3" opacity="0.8"/>
    <circle cx="188" cy="78" r="0.9" opacity="0.6"/>
    <circle cx="262" cy="130" r="1" opacity="0.6"/>
  </g>

  <!-- 焰（叙事光源）：三层火舌 + 细芒刻线 -->
  <g transform="translate(216 106)">
    <circle cx="0" cy="6" r="42" fill="url(#wnd-flame)"/>
    <path d="M 0 -46 C 12 -30, 20 -18, 20 -4 C 20 12, 10 22, 0 24 C -10 22, -20 12, -20 -4 C -20 -18, -12 -30, 0 -46 Z"
          fill="#d9814e" opacity="0.28"/>
    <path d="M 0 -32 C 8 -20, 13 -12, 13 -2 C 13 9, 7 16, 0 18 C -7 16, -13 9, -13 -2 C -13 -12, -8 -20, 0 -32 Z"
          fill="#e8a06a" opacity="0.4"/>
    <path d="M 0 -18 C 4 -11, 6 -6, 6 0 C 6 6, 3 10, 0 11 C -3 10, -6 6, -6 0 C -6 -6, -4 -11, 0 -18 Z"
          fill="#e9edf5" opacity="0.85"/>
    <g stroke="#d9814e" stroke-width="0.8" opacity="0.6">
      <line x1="0" y1="-54" x2="0" y2="-60"/><line x1="18" y1="-44" x2="23" y2="-49"/><line x1="-18" y1="-44" x2="-23" y2="-49"/>
      <line x1="26" y1="-22" x2="32" y2="-24"/><line x1="-26" y1="-22" x2="-32" y2="-24"/>
    </g>
  </g>

  <!-- 活木之杖：自左下伸向焰心 -->
  <g>
    <path d="M 52 316 C 96 268, 148 212, 200 148 C 208 138, 214 128, 218 120 L 202 112 C 198 122, 192 132, 184 142 C 136 202, 88 256, 46 302 Z"
          fill="#14100c" stroke="#c7cedd" stroke-width="1.7"/>
    <path d="M 52 316 C 96 268, 148 212, 200 148 C 208 138, 214 128, 218 120 L 210 116 C 205 126, 199 135, 192 144 C 144 204, 96 258, 52 304 Z"
          fill="url(#wnd-bark)" opacity="0.8"/>
    <!-- 杖身木节 -->
    <g fill="none" stroke="#c7cedd" stroke-width="0.9" opacity="0.75">
      <ellipse cx="150" cy="212" rx="6" ry="4" transform="rotate(-40 150 212)"/>
      <ellipse cx="100" cy="268" rx="5" ry="3.4" transform="rotate(-40 100 268)"/>
    </g>
    <!-- 束布 -->
    <g transform="translate(206 122) rotate(36)">
      <path d="M -14 -7 C -5 -11, 5 -11, 14 -7 C 5 -3, -5 -3, -14 -7 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -8 -5 C -14 4, -16 12, -12 20 C -7 13, -5 4, -8 -5 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
      <path d="M 8 -5 C 13 3, 15 10, 12 17 C 7 11, 5 3, 8 -5 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
    </g>
    <!-- 新叶三枚：杖是活的 -->
    <g fill="#14100c" stroke="#c7cedd" stroke-width="1.2">
      <path d="M 168 176 C 152 168, 144 154, 146 140 C 162 144, 170 158, 168 176 Z"/>
      <path d="M 120 246 C 104 240, 95 227, 96 213 C 112 216, 121 230, 120 246 Z"/>
      <path d="M 182 168 C 192 156, 206 150, 218 152 C 214 166, 200 174, 182 168 Z"/>
    </g>
    <g stroke="#8a93ad" stroke-width="0.6" fill="none" opacity="0.6">
      <path d="M 166 172 L 150 146"/><path d="M 118 242 L 100 219"/><path d="M 186 166 L 212 156"/>
    </g>
  </g>

  <!-- 坡地与石 -->
  <g stroke="#8a93ad" fill="none" opacity="0.65">
    <path d="M 0 322 C 44 310, 92 306, 138 314" stroke-width="1"/>
    <path d="M 20 334 C 60 326, 104 324, 146 330" stroke-width="0.7" opacity="0.6"/>
  </g>
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
    <path d="M 38 316 C 42 308, 54 306, 60 312 C 62 318, 56 324, 46 324 C 41 323, 37 320, 38 316 Z"/>
    <path d="M 72 326 C 75 320, 84 319, 88 324 C 89 329, 84 333, 77 332 C 73 331, 71 329, 72 326 Z"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.5">
    <line x1="96" y1="320" x2="112" y2="318"/><line x1="130" y1="326" x2="150" y2="324"/>
  </g>
</svg>
