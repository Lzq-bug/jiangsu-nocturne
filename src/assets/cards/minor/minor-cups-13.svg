<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯王后：跪在潮线的礁石上，松手把杯放回水里——接住自己，然后放手">
  <defs>
    <radialGradient id="c13-night" cx="40%" cy="22%" r="135%">
      <stop offset="0" stop-color="#0f1d28"/><stop offset="0.55" stop-color="#0b141e"/><stop offset="1" stop-color="#060c13"/>
    </radialGradient>
    <radialGradient id="c13-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7d8e8" stop-opacity="0.45"/><stop offset="1" stop-color="#c7d8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c13-night)"/>

  <!-- 低月（左上：光位与其他王后相异） -->
  <g transform="translate(66 58)">
    <circle r="16" fill="url(#c13-moon)"/>
    <path d="M 5 -8.4 A 9 9 0 1 0 5 8.4 A 7 7 0 1 1 5 -8.4 Z" fill="#c7d8e8" opacity="0.9"/>
  </g>
  <g fill="#c7cedd" opacity="0.4">
    <circle cx="180" cy="34" r="0.9"/><circle cx="238" cy="52" r="0.8"/><circle cx="128" cy="42" r="0.7"/>
  </g>

  <!-- 远海平线 -->
  <path d="M 0 150 C 90 146, 200 146, 300 150" stroke="#8a93ad" stroke-width="0.7" opacity="0.35"/>
  <!-- 月光水路（自月向右下） -->
  <g stroke="#c7d8e8" fill="none">
    <path d="M 76 96 L 86 120" stroke-width="1.4" opacity="0.5"/>
    <path d="M 92 132 L 104 162" stroke-width="1.2" opacity="0.42"/>
    <path d="M 110 176 L 122 210" stroke-width="1.1" opacity="0.34"/>
  </g>

  <!-- 礁石群（潮线：右前景，低平有棱角的礁板，她跪于其上） -->
  <g>
    <path d="M 158 242 L 178 220 L 206 212 L 238 216 L 262 230 L 270 248 L 258 262 L 230 268 L 196 266 L 168 258 L 156 250 Z"
          fill="#101824" stroke="#c7cedd" stroke-width="1.1"/>
    <!-- 礁面棱线（碎面感，避免读作圆球） -->
    <g stroke="#8a93ad" stroke-width="0.7" fill="none" opacity="0.5">
      <path d="M 178 220 L 196 244 L 230 250 M 206 212 L 214 240 M 238 216 L 232 246"/>
    </g>
    <path d="M 186 224 C 200 218, 218 216, 234 220" stroke="#6fc2c9" stroke-width="0.9" fill="none" opacity="0.6"/>
    <path d="M 196 252 C 212 248, 232 248, 246 254" stroke="#8a93ad" stroke-width="0.7" fill="none" opacity="0.5"/>
    <!-- 小块伴礁（有棱角） -->
    <path d="M 116 264 L 134 252 L 152 256 L 160 268 L 150 278 L 128 278 L 114 272 Z" fill="#0d141e" stroke="#8a93ad" stroke-width="0.8"/>
  </g>

  <!-- 王后（主体：跪坐礁上，侧影朝右下，双臂低伸——杯已离手，正落向水） -->
  <g>
    <!-- 身形（跪坐，裙裾铺在礁面） -->
    <path d="M 186 246
             C 180 238, 178 228, 182 218
             C 186 208, 194 202, 202 200
             C 210 198, 217 202, 220 210
             C 223 217, 222 226, 219 234
             C 216 244, 214 254, 214 262
             C 208 266, 200 266, 194 262
             C 190 258, 187 252, 186 246 Z"
          fill="#0d1520"/>
    <!-- 头（低垂，看着自己的手） -->
    <path d="M 202 198 C 201 189, 207 182, 215 183 C 222 184, 226 190, 225 197 C 224 203, 218 206, 212 205 Z" fill="#0d1520"/>
    <!-- 王后冠饰：连续潮弧冠 -->
    <path d="M 204 191 C 210 185, 219 184, 225 189 C 219 187, 210 187, 205 192" stroke="#8ed8de" stroke-width="1.1" fill="none"/>
    <circle cx="214" cy="184.6" r="1.3" fill="#8ed8de" opacity="0.9"/>
    <!-- 双臂前下伸（松手的动作） -->
    <path d="M 190 226 C 182 232, 174 240, 168 248" stroke="#0d1520" stroke-width="5.6" fill="none" stroke-linecap="round"/>
    <path d="M 216 224 C 208 234, 198 244, 188 252" stroke="#0d1520" stroke-width="5.2" fill="none" stroke-linecap="round"/>
    <!-- 杯（已离手：悬在礁与水之间的半空，正落） -->
    <g transform="translate(160 262) rotate(14)">
      <path d="M -9 8 L 9 6 C 10 -2, 7 -7, 0 -9 L 0 -15 L 5 -19 L -13 -19 L -8 -15 L -8 -9 C -14 -7, -16 -2, -14 6 Z"
            fill="#0a141e" stroke="#c7cedd" stroke-width="1.2"/>
      <path d="M -5 -5 C -3 -6.6, 3 -6.6, 5 -5" stroke="#8ed8de" stroke-width="0.8" fill="none" opacity="0.85"/>
    </g>
    <!-- 指尖与杯口之间的一线水光（刚松开） -->
    <path d="M 172 252 C 170 256, 168 259, 166 261" stroke="#8ed8de" stroke-width="0.8" fill="none" opacity="0.6"/>
    <!-- 月光轮廓（背缘） -->
    <g stroke="#aebdd6" fill="none" opacity="0.55">
      <path d="M 184 220 C 180 228, 179 238, 182 248" stroke-width="0.9"/>
      <path d="M 202 200 C 196 202, 191 206, 188 212" stroke-width="0.8"/>
    </g>
  </g>

  <!-- 杯将落处的水面涟漪（预告：水已经准备好了） -->
  <g stroke="#6fc2c9" fill="none">
    <ellipse cx="152" cy="296" rx="14" ry="2.8" stroke-width="1" opacity="0.6"/>
    <ellipse cx="152" cy="300" rx="26" ry="4.6" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- 海面（下带：水平波弧） -->
  <path d="M 0 280 C 90 274, 200 274, 300 280 L 300 340 L 0 340 Z" fill="#08111a"/>
  <g stroke="#6fc2c9" fill="none">
    <path d="M 0 296 C 60 292, 140 292, 220 296" stroke-width="0.8" opacity="0.5"/>
    <path d="M 40 314 C 120 309, 210 309, 286 314" stroke-width="1" opacity="0.55"/>
    <path d="M 0 328 C 80 322, 190 322, 280 328" stroke-width="1.1" opacity="0.5"/>
  </g>
  <!-- 潮线泡沫在礁脚 -->
  <g stroke="#c7d8e8" stroke-width="0.7" fill="none" opacity="0.4">
    <path d="M 176 276 C 190 280, 210 281, 228 278"/>
    <path d="M 128 280 C 138 284, 152 285, 164 283"/>
  </g>
</svg>
