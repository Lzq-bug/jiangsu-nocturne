<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯八：石阶杯位缺一，湿痕与留下的披巾，月光照空位">
  <defs>
    <radialGradient id="c8-ground" cx="68%" cy="18%" r="115%">
      <stop offset="0" stop-color="#0f1a24"/><stop offset="0.55" stop-color="#0b141d"/><stop offset="1" stop-color="#060c13"/>
    </radialGradient>
    <radialGradient id="c8-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5e1e8" stop-opacity="0.4"/><stop offset="1" stop-color="#a5e1e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c8-ground)"/>

  <!-- 夜空：一弯小蛾眉月（非大满月）与薄云 -->
  <g transform="translate(252 52)">
    <circle r="18" fill="url(#c8-moon)"/>
    <path d="M 6 -9 A 10.4 10.4 0 1 0 6 9 A 8.2 8.2 0 1 1 6 -9 Z" fill="#c7d8e8" opacity="0.95"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4" fill="none">
    <path d="M 30 44 C 60 40, 90 42, 118 46 M 150 34 C 176 31, 200 32, 222 35"/>
  </g>
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="70" cy="66" r="0.9"/><circle cx="140" cy="58" r="0.9"/><circle cx="196" cy="78" r="0.8"/>
  </g>

  <!-- 月光自右上斜落向空位（唯一叙事光源，主动线：对角） -->
  <path d="M 236 66 L 262 60 L 130 232 L 112 226 Z" fill="#a5e1e8" opacity="0.06"/>

  <!-- 石阶长台：八个杯位（横向横贯中带，圣杯横向语汇） -->
  <g>
    <path d="M 6 210 L 294 202 L 300 226 L 0 234 Z" fill="#141c2c" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 6 216 L 294 208" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    <!-- 台沿下的石缝阴影 -->
    <path d="M 0 234 L 300 226 L 300 238 L 0 246 Z" fill="#0a1018" stroke="#8a93ad" stroke-width="0.7" opacity="0.9"/>
  </g>

  <!-- 七只在位的杯（聚散不齐：离别后无人再排整齐） -->
  <g fill="#0e1620" stroke="#c7cedd" stroke-width="1.3">
    <g transform="translate(64 197) rotate(-3)">
      <path d="M -11 -12 L 11 -12 C 11 -5, 7 -1, 3 1 L 3 8 L 8 12 L -8 12 L -3 8 L -3 1 C -7 -1, -11 -5, -11 -12 Z"/>
      <ellipse cx="0" cy="-12" rx="11" ry="2.2" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(94 194) rotate(2)">
      <path d="M -10 -11 L 10 -11 C 10 -5, 6 -1, 3 1 L 3 8 L 7 11 L -7 11 L -3 8 L -3 1 C -6 -1, -10 -5, -10 -11 Z"/>
      <ellipse cx="0" cy="-11" rx="10" ry="2" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(126 192)">
      <path d="M -12 -13 L 12 -13 C 12 -5, 8 -1, 4 1 L 4 9 L 9 13 L -9 13 L -4 9 L -4 1 C -8 -1, -12 -5, -12 -13 Z"/>
      <ellipse cx="0" cy="-13" rx="12" ry="2.4" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(152 196) rotate(-2)">
      <path d="M -10 -11 L 10 -11 C 10 -5, 6 -1, 3 1 L 3 8 L 7 11 L -7 11 L -3 8 L -3 1 C -6 -1, -10 -5, -10 -11 Z"/>
      <ellipse cx="0" cy="-11" rx="10" ry="2" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(192 191)">
      <path d="M -11 -12 L 11 -12 C 11 -5, 7 -1, 3 1 L 3 8 L 8 12 L -8 12 L -3 8 L -3 1 C -7 -1, -11 -5, -11 -12 Z"/>
      <ellipse cx="0" cy="-12" rx="11" ry="2.2" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(219 195) rotate(3)">
      <path d="M -10 -11 L 10 -11 C 10 -5, 6 -1, 3 1 L 3 8 L 7 11 L -7 11 L -3 8 L -3 1 C -6 -1, -10 -5, -10 -11 Z"/>
      <ellipse cx="0" cy="-11" rx="10" ry="2" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <g transform="translate(256 189)">
      <path d="M -11 -12 L 11 -12 C 11 -5, 7 -1, 3 1 L 3 8 L 8 12 L -8 12 L -3 8 L -3 1 C -7 -1, -11 -5, -11 -12 Z"/>
      <ellipse cx="0" cy="-12" rx="11" ry="2.2" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
  </g>

  <!-- 第八位：空位 + 湿痕（离开的痕迹，月光正落在这里） -->
  <g transform="translate(20 198)">
    <circle r="16" fill="url(#c8-moon)" opacity="0.9"/>
    <ellipse cx="0" cy="8" rx="13" ry="3.4" fill="none" stroke="#a5e1e8" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="0" cy="8" rx="7" ry="1.8" fill="none" stroke="#a5e1e8" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="0" cy="8" rx="13" ry="3.4" fill="#a5e1e8" opacity="0.1"/>
  </g>

  <!-- 留下的披巾：搭在台沿垂下（被舍弃的随身物，唯一的"人迹"） -->
  <g>
    <path d="M 30 212 C 40 208, 52 208, 60 212 C 58 234, 54 258, 46 280 C 40 296, 32 306, 24 310 C 22 296, 22 278, 24 258 C 26 240, 28 224, 30 212 Z"
          fill="#101a2c" stroke="#8a93ad" stroke-width="1.2"/>
    <path d="M 36 216 C 36 240, 34 266, 30 292" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <path d="M 48 214 C 48 232, 45 252, 41 272" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- 台下静水：极简波弧（无倒影，只有潮线） -->
  <g stroke="#6fc2c9" stroke-width="0.8" opacity="0.5" fill="none">
    <path d="M 60 292 C 90 288, 120 288, 150 291 M 180 296 C 210 293, 240 293, 268 295"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 100 310 C 126 307, 152 307, 178 309 M 210 318 C 236 316, 262 316, 286 317"/>
  </g>

  <!-- 潮水抹平的湿沙面 -->
  <path d="M 0 322 C 80 318, 200 318, 300 322" fill="none" stroke="#c7cedd" stroke-width="0.8" opacity="0.35"/>
</svg>
