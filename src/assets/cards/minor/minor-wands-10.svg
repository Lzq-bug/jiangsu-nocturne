<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖十：十杖成捆悬在压弯的杠架下，束绳吃紧，重量看得见">
  <defs>
    <radialGradient id="w10-ground" cx="38%" cy="40%" r="115%">
      <stop offset="0" stop-color="#1d150e"/><stop offset="0.6" stop-color="#140f09"/><stop offset="1" stop-color="#0c0805"/>
    </radialGradient>
    <radialGradient id="w10-ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.4"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w10-ground)"/>

  <!-- 拖架的双足（吃重外撇） -->
  <g stroke="#2e1b10" stroke-linecap="round">
    <path d="M 92 322 L 116 216" stroke-width="8"/>
    <path d="M 212 320 L 190 214" stroke-width="8"/>
  </g>
  <g stroke="#c98a54" stroke-width="1.1" opacity="0.8">
    <path d="M 94 316 L 117 218 M 210 314 L 191 216"/>
  </g>
  <!-- 足垫 -->
  <path d="M 78 324 L 106 324 M 198 322 L 226 322" stroke="#8a93ad" stroke-width="2" opacity="0.7"/>

  <!-- 被压弯的杠木（主视觉：重量把结构压出弧度） -->
  <path d="M 58 216 C 100 236, 200 236, 246 214" fill="none" stroke="#3a2214" stroke-width="9" stroke-linecap="round"/>
  <path d="M 60 212 C 102 231, 198 231, 244 210" fill="none" stroke="#c98a54" stroke-width="1.3" opacity="0.85"/>
  <path d="M 62 221 C 104 241, 196 241, 242 219" fill="none" stroke="#1a0e07" stroke-width="1" opacity="0.7"/>
  <!-- 杠木中段的受力裂纹 -->
  <path d="M 148 232 L 152 244 M 152 232 L 149 240" stroke="#1a0e07" stroke-width="0.9" opacity="0.85"/>
  <!-- 端部防滑刻纹 -->
  <g stroke="#1a0e07" stroke-width="0.7" opacity="0.7">
    <path d="M 62 210 L 66 220 M 68 209 L 72 219 M 238 208 L 242 218"/>
  </g>

  <!-- 悬吊的十杖捆：束绳吃紧，杖端可见十处截面（数量藏在重量里） -->
  <g>
    <!-- 吊绳（自杠木到捆） -->
    <path d="M 120 228 L 132 258 M 186 228 L 174 258" stroke="#a89278" stroke-width="1.6"/>
    <path d="M 126 244 L 180 244" stroke="#a89278" stroke-width="1.4"/>
    <!-- 捆体：厚重的斜置杖群剪影 -->
    <g stroke-linecap="round">
      <path d="M 108 262 L 204 282" stroke="#241509" stroke-width="9"/>
      <path d="M 106 272 L 202 290" stroke="#2e1b10" stroke-width="9"/>
      <path d="M 110 282 L 200 297" stroke="#33200f" stroke-width="8.6"/>
      <path d="M 116 291 L 194 303" stroke="#241509" stroke-width="8.2"/>
      <path d="M 124 299 L 186 308" stroke="#2e1b10" stroke-width="7.8"/>
    </g>
    <!-- 右端十处杖截面（环纹+心材点） -->
    <g stroke="#8a5a3a" stroke-width="0.9" fill="#4a3520">
      <circle cx="206" cy="281" r="4.2"/><circle cx="204" cy="289" r="4.2"/><circle cx="202" cy="296" r="4"/>
      <circle cx="196" cy="302" r="3.9"/><circle cx="188" cy="307" r="3.7"/>
    </g>
    <g fill="#1a0e07">
      <circle cx="206" cy="281" r="1.2"/><circle cx="204" cy="289" r="1.2"/><circle cx="202" cy="296" r="1.1"/>
      <circle cx="196" cy="302" r="1.1"/><circle cx="188" cy="307" r="1"/>
    </g>
    <!-- 左端截面（微露） -->
    <g stroke="#8a5a3a" stroke-width="0.9" fill="#4a3520">
      <circle cx="106" cy="262" r="4.4"/><circle cx="104" cy="271" r="4.4"/><circle cx="108" cy="281" r="4.2"/>
      <circle cx="114" cy="290" r="4"/><circle cx="122" cy="298" r="3.8"/>
    </g>
    <!-- 束绳三道（吃紧绷直） -->
    <g stroke="#a89278" stroke-width="1.8" fill="none">
      <path d="M 130 258 C 132 268, 132 280, 129 292"/>
      <path d="M 136 259 C 138 269, 138 281, 135 293"/>
      <path d="M 170 260 C 172 272, 172 286, 170 298"/>
    </g>
    <!-- 绳结 -->
    <circle cx="132" cy="276" r="2.6" fill="#c9bda5"/>
    <circle cx="171" cy="280" r="2.4" fill="#c9bda5"/>
  </g>

  <!-- 地面余烬（唯一叙事光源：换肩歇脚时的火塘余温，自下映亮捆底） -->
  <g transform="translate(64 300)">
    <circle r="26" fill="url(#w10-ember)"/>
    <g fill="#d9814e" opacity="0.85">
      <circle cx="-6" cy="4" r="2"/><circle cx="4" cy="6" r="1.6"/><circle cx="12" cy="2" r="1.3"/><circle cx="-14" cy="1" r="1.4"/>
    </g>
    <g stroke="#8a5a3a" stroke-width="0.8" opacity="0.8" fill="none">
      <path d="M -18 8 C -8 12, 8 12, 18 8"/>
    </g>
  </g>
  <!-- 捆底被余烬映暖的一线 -->
  <path d="M 116 306 L 186 312" stroke="#c98a54" stroke-width="1.4" opacity="0.5"/>

  <!-- 地面压痕（重负拖行痕迹） -->
  <g stroke="#8a93ad" stroke-width="0.7" opacity="0.45" fill="none">
    <path d="M 96 326 C 140 322, 180 322, 220 325"/>
    <path d="M 110 332 C 150 330, 190 330, 226 332"/>
  </g>
  <path d="M 0 316 C 80 312, 200 312, 300 316" stroke="#c7cedd" stroke-width="0.8" opacity="0.4"/>
</svg>
