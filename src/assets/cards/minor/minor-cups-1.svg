<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯王牌：旷野泉石上的独爵，水自杯中涌起又回落，涟漪自足">
  <defs>
    <radialGradient id="c1-ground" cx="50%" cy="36%" r="115%">
      <stop offset="0" stop-color="#0f1c26"/><stop offset="0.6" stop-color="#0b141d"/><stop offset="1" stop-color="#060c13"/>
    </radialGradient>
    <radialGradient id="c1-arc" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8ed8de" stop-opacity="0.5"/><stop offset="1" stop-color="#8ed8de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c1-ground)"/>

  <!-- 夜空：小蛾眉月与疏星（环境安静，衬托唯一的涌泉） -->
  <g transform="translate(244 54)">
    <circle r="14" fill="url(#c1-arc)" opacity="0.7"/>
    <path d="M 4.6 -7 A 8 8 0 1 0 4.6 7 A 6.4 6.4 0 1 1 4.6 -7 Z" fill="#c7d8e8" opacity="0.85"/>
  </g>
  <g fill="#c7cedd" opacity="0.45">
    <circle cx="60" cy="48" r="0.9"/><circle cx="130" cy="38" r="0.9"/><circle cx="186" cy="66" r="0.8"/><circle cx="96" cy="80" r="0.8"/>
  </g>

  <!-- 远岸（极低平，开阔感的来源） -->
  <path d="M 0 210 C 70 206, 160 206, 300 210" stroke="#8a93ad" stroke-width="0.7" opacity="0.4"/>

  <!-- 泉石（独爵的基座：湿石，有水线） -->
  <g>
    <path d="M 108 258 C 104 236, 116 220, 138 216 C 162 212, 184 222, 190 240 C 194 252, 188 262, 176 266 C 152 274, 122 272, 108 258 Z"
          fill="#101724" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 118 244 C 130 238, 150 236, 168 240" fill="none" stroke="#6fc2c9" stroke-width="0.9" opacity="0.7"/>
    <path d="M 124 256 C 138 252, 158 252, 172 256" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- 独爵（唯一主体：向上涌水的一杯） -->
  <g>
    <path d="M 126 218 L 166 214 C 168 200, 164 190, 154 184 L 154 172 L 164 164 L 128 164 L 138 172 L 138 184 C 130 190, 126 200, 126 218 Z"
          fill="#0e1620" stroke="#c7cedd" stroke-width="0"/>
    <path d="M 128 216 C 130 200, 134 192, 142 187 L 142 174 L 134 166 L 158 166 L 150 174 L 150 187 C 158 192, 162 202, 164 215"
          fill="#0e1620" stroke="#c7cedd" stroke-width="1.5"/>
    <!-- 杯口涌起的水弧（唯一叙事光源：自杯而出的活水） -->
    <path d="M 138 176 C 132 150, 140 124, 160 106 C 172 96, 184 96, 190 104" fill="none" stroke="#8ed8de" stroke-width="2.2"/>
    <path d="M 141 178 C 136 154, 144 130, 162 113" fill="none" stroke="#c9eef2" stroke-width="1"/>
    <path d="M 190 104 C 196 116, 190 132, 172 142 C 164 146, 156 148, 148 148" fill="none" stroke="#8ed8de" stroke-width="1.6" opacity="0.85"/>
    <circle cx="166" cy="103" r="8" fill="url(#c1-arc)"/>
    <g fill="#c9eef2" opacity="0.9">
      <circle cx="148" cy="128" r="1.3"/><circle cx="154" cy="112" r="1.1"/><circle cx="182" cy="122" r="1.2"/>
    </g>
  </g>

  <!-- 石下涟漪（水落回池面，一圈圈推开） -->
  <g stroke="#6fc2c9" fill="none">
    <ellipse cx="150" cy="276" rx="34" ry="6" stroke-width="1.1" opacity="0.8"/>
    <ellipse cx="150" cy="282" rx="52" ry="9" stroke-width="0.9" opacity="0.55"/>
    <ellipse cx="150" cy="290" rx="74" ry="12" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="150" cy="300" rx="100" ry="16" stroke-width="0.7" opacity="0.28"/>
    <ellipse cx="150" cy="312" rx="128" ry="20" stroke-width="0.6" opacity="0.18"/>
  </g>

  <!-- 岸边香蒲两株（次级，极简） -->
  <g stroke="#7d8f63" stroke-width="1.1" fill="none" opacity="0.9">
    <path d="M 48 252 C 46 234, 48 220, 52 208 M 44 254 C 42 240, 42 228, 44 218"/>
    <path d="M 252 248 C 254 232, 252 218, 248 206"/>
  </g>
  <g fill="#6d5137">
    <ellipse cx="52" cy="204" rx="2.2" ry="6"/><ellipse cx="44" cy="214" rx="1.9" ry="5"/>
    <ellipse cx="248" cy="202" rx="2.2" ry="6"/>
  </g>

  <!-- 地面水光 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.3" fill="none">
    <path d="M 60 322 L 130 322 M 190 328 L 254 328"/>
  </g>
</svg>
