<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑国王：背侧立在风口山脊，剑收在鞘里，双手拢在身后——判断已经完成，不需要举剑">
  <defs>
    <linearGradient id="s14-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2338"/><stop offset="0.68" stop-color="#121a2c"/><stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="s14-gap" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#dfe8f6" stop-opacity="0.5"/><stop offset="1" stop-color="#dfe8f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s14-sky)"/>

  <!-- 天光裂口（左上：一道窄月牙缝，不再是大面亮块） -->
  <path d="M 10 48 C 32 38, 56 36, 78 44 C 56 44, 32 50, 12 62 Z" fill="url(#s14-gap)"/>
  <path d="M 10 46 C 32 36, 56 34, 80 42" stroke="#dfe8f6" stroke-width="0.9" fill="none" opacity="0.5"/>
  <path d="M 12 64 C 34 52, 58 46, 80 46" stroke="#aebdd6" stroke-width="0.6" fill="none" opacity="0.3"/>
  <g fill="#c7cedd" opacity="0.4">
    <circle cx="150" cy="30" r="0.8"/><circle cx="210" cy="44" r="0.7"/><circle cx="258" cy="30" r="0.8"/>
  </g>

  <!-- 气象边界：左亮右暗的分界云（判断已成的天空语言） -->
  <g fill="#18213a" stroke="#4d5878" stroke-width="0.7">
    <path d="M 120 66 C 160 58, 210 58, 250 68 C 232 80, 186 84, 146 80 C 130 78, 116 72, 120 66 Z"/>
  </g>
  <g stroke="#6d7898" fill="none" opacity="0.5">
    <path d="M 0 130 C 70 122, 150 124, 226 116"/>
    <path d="M 0 172 C 80 166, 170 168, 250 160"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" fill="none" opacity="0.35">
    <path d="M 0 150 C 90 144, 190 146, 280 138"/>
  </g>

  <!-- 山脊（右高左低，主体立在高处） -->
  <path d="M 0 268 C 70 262, 140 250, 196 236 C 240 225, 276 218, 300 216 L 300 340 L 0 340 Z" fill="#0c111c"/>
  <path d="M 0 268 C 70 262, 140 250, 196 236 C 240 225, 276 218, 300 216" stroke="#39425c" stroke-width="1.1" fill="none" opacity="0.9"/>
  <g stroke="#232c44" stroke-width="0.7" opacity="0.6" fill="none">
    <path d="M 40 296 C 110 286, 190 274, 254 262"/>
    <path d="M 90 318 C 160 306, 230 294, 280 284"/>
  </g>
  <g fill="#161d30">
    <ellipse cx="120" cy="254" rx="4" ry="1.8"/><ellipse cx="216" cy="228" rx="3.4" ry="1.6"/>
  </g>

  <!-- 谷中远处的风雪线（他俯瞰的边界） -->
  <g stroke="#39425c" stroke-width="0.7" opacity="0.5" fill="none">
    <path d="M 30 286 C 60 280, 92 274, 120 270"/>
    <path d="M 44 300 C 72 294, 100 288, 126 282"/>
  </g>

  <!-- 国王（主体：背侧影，双手拢在身后；剑收鞘贴腰，看不见出鞘的理由） -->
  <g>
    <!-- 斗篷身形（上宽下收，背姿） -->
    <path d="M 168 300
             C 164 278, 164 254, 170 232
             C 175 214, 184 200, 196 194
             C 205 189, 214 190, 220 196
             C 226 202, 229 212, 228 224
             C 226 244, 222 268, 218 290
             C 216 296, 214 300, 212 302
             C 198 302, 182 302, 168 300 Z"
          fill="#101828"/>
    <!-- 背后拢起的双手（袖口相叠） -->
    <path d="M 190 240 C 196 244, 206 244, 212 240" stroke="#101828" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 192 244 C 198 247, 206 247, 211 244" stroke="#1c2438" stroke-width="4.4" fill="none" opacity="0.9"/>
    <!-- 头（背侧，束发银灰一丝） -->
    <path d="M 194 192 C 191 182, 197 173, 206 173 C 214 173, 220 180, 219 188 C 218 195, 211 199, 204 198 Z" fill="#101828"/>
    <path d="M 204 174 C 206 170, 210 169, 212 171" stroke="#8a93ad" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- 国王冠饰：三点稳定冠（锋线细节） -->
    <path d="M 193 184 C 199 178, 209 177, 216 183" stroke="#aebdd6" stroke-width="1.3" fill="none"/>
    <path d="M 197 181 L 197 177 L 201 177 L 201 180 M 206 177 L 206 173 L 210 173 L 210 177 M 214 180 L 214 176 L 217 177" stroke="#aebdd6" stroke-width="1.1" fill="none"/>
    <!-- 剑（收在鞘里：只有鞘与柄沿腰线露出） -->
    <g>
      <path d="M 178 236 C 182 236, 188 235, 192 233" stroke="#1c2438" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 178 238 C 182 238, 187 237.4, 191 235.6" stroke="#8a93ad" stroke-width="0.8" opacity="0.6"/>
      <circle cx="175" cy="236" r="2.6" fill="#1c2438" stroke="#8a93ad" stroke-width="0.9"/>
    </g>
    <!-- 天光轮廓（左上缘，加强缩略可读性） -->
    <g stroke="#dfe8f6" fill="none" opacity="0.85">
      <path d="M 170 232 C 172 214, 178 198, 188 190" stroke-width="1.2"/>
      <path d="M 196 190 C 202 186, 208 184, 213 185" stroke-width="1"/>
      <path d="M 218 200 C 221 208, 222 218, 221 228 C 220 244, 218 264, 215 284" stroke-width="1"/>
      <path d="M 182 196 C 180 202, 178 210, 178 218" stroke-width="0.9" opacity="0.6"/>
    </g>
  </g>

  <!-- 脊上一茎被风压低的草（此地风与他的静） -->
  <g stroke="#39425c" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 248 224 C 242 216, 240 208, 244 200"/>
    <path d="M 256 226 C 252 220, 251 214, 254 208"/>
  </g>
</svg>
