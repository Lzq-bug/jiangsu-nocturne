<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯二：相互斟满的双爵与双月">
  <defs>
    <radialGradient id="cup-ground" cx="50%" cy="32%" r="90%">
      <stop offset="0" stop-color="#14222e"/><stop offset="0.62" stop-color="#101b26"/><stop offset="1" stop-color="#0a121a"/>
    </radialGradient>
    <radialGradient id="cup-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fc2c9" stop-opacity="0.42"/><stop offset="1" stop-color="#6fc2c9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cup-water" width="12" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 2.5 Q 3 0 6 2.5 T 12 2.5" fill="none" stroke="#6fc2c9" stroke-width="0.5" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#cup-ground)"/>

  <!-- 双月相合（叙事光源）：两弯新月的角几乎围成一轮满月，缺口透光 -->
  <g transform="translate(150 74)">
    <circle r="30" fill="url(#cup-glow)"/>
    <path d="M -4 -26 A 26 26 0 0 0 -4 26 A 19 26 0 0 1 -4 -26 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3" transform="translate(-7 0)"/>
    <path d="M 4 -26 A 26 26 0 0 1 4 26 A 19 26 0 0 0 4 -26 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3" transform="translate(7 0)"/>
    <ellipse cx="0" cy="0" rx="7" ry="17" fill="#6fc2c9" opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#e9edf5" opacity="0.95"/>
  </g>
  <g fill="#c7cedd" opacity="0.55">
    <circle cx="70" cy="52" r="1.1"/><circle cx="234" cy="58" r="1.1"/><circle cx="108" cy="106" r="0.9"/><circle cx="196" cy="110" r="0.9"/>
  </g>

  <!-- 相互斟满的双爵 -->
  <g>
    <!-- 左爵（微右倾） -->
    <g transform="translate(104 196) rotate(-7)">
      <path d="M -34 -34 L 34 -34 C 34 -10, 22 2, 8 6 L 8 26 L 22 34 L -22 34 L -8 26 L -8 6 C -22 2, -34 -10, -34 -34 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.7"/>
      <path d="M -28 -26 L 28 -26 C 26 -10, 16 -2, 0 0 C -16 -2, -26 -10, -28 -26 Z" fill="#101733"/>
      <path d="M -28 -24 C -18 -18, -8 -15, 0 -15 C 8 -15, 18 -18, 28 -24 L 27 -19 C 18 -13, 9 -11, 0 -11 C -9 -11, -18 -13, -27 -19 Z"
            fill="#6fc2c9" opacity="0.55"/>
      <ellipse cx="0" cy="-34" rx="34" ry="5" fill="none" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M -30 -40 C -18 -46, 18 -46, 30 -40" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    </g>
    <!-- 右爵（微左倾） -->
    <g transform="translate(196 196) rotate(7)">
      <path d="M -34 -34 L 34 -34 C 34 -10, 22 2, 8 6 L 8 26 L 22 34 L -22 34 L -8 26 L -8 6 C -22 2, -34 -10, -34 -34 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.7"/>
      <path d="M -28 -26 L 28 -26 C 26 -10, 16 -2, 0 0 C -16 -2, -26 -10, -28 -26 Z" fill="#101733"/>
      <path d="M -28 -24 C -18 -18, -8 -15, 0 -15 C 8 -15, 18 -18, 28 -24 L 27 -19 C 18 -13, 9 -11, 0 -11 C -9 -11, -18 -13, -27 -19 Z"
            fill="#6fc2c9" opacity="0.55"/>
      <ellipse cx="0" cy="-34" rx="34" ry="5" fill="none" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M -30 -40 C -18 -46, 18 -46, 30 -40" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    </g>
    <!-- 两道交互的水弧（彼此斟满） -->
    <g fill="none" stroke="#6fc2c9" stroke-width="1.6" opacity="0.9">
      <path d="M 122 168 C 138 152, 162 152, 178 168" />
      <path d="M 178 168 C 162 184, 138 184, 122 168" opacity="0.65"/>
    </g>
    <circle cx="150" cy="168" r="2.2" fill="#6fc2c9" opacity="0.95"/>
    <circle cx="150" cy="176" r="1.4" fill="#6fc2c9" opacity="0.7"/>
  </g>

  <!-- 爵下静水与倒影 -->
  <path d="M 30 268 L 270 268" stroke="#8a93ad" stroke-width="0.9" opacity="0.55"/>
  <g stroke="#6fc2c9" fill="none" opacity="0.35">
    <path d="M 84 280 C 96 284, 112 286, 126 284" stroke-width="1"/>
    <path d="M 174 284 C 188 286, 204 284, 216 280" stroke-width="1"/>
    <path d="M 118 292 L 182 292" stroke-width="0.7"/>
  </g>
  <g stroke="#8a93ad" fill="none" opacity="0.4">
    <path d="M 96 306 C 108 310, 124 312, 138 310" stroke-width="0.7"/>
    <path d="M 162 310 C 176 312, 192 310, 204 306" stroke-width="0.7"/>
  </g>
  <!-- 水面花纹 -->
  <path d="M 60 260 L 240 260 L 240 266 L 60 266 Z" fill="url(#cup-water)" opacity="0.5"/>

  <!-- 两岸香蒲（水岸语境，非纯酒杯） -->
  <g stroke="#c7cedd" fill="none" stroke-width="1.1" opacity="0.8">
    <path d="M 44 268 C 44 250, 42 236, 38 226 M 50 268 C 52 252, 54 242, 58 234"/>
    <path d="M 256 268 C 256 250, 258 236, 262 226 M 250 268 C 248 252, 246 242, 242 234"/>
  </g>
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1">
    <ellipse cx="38" cy="219" rx="3.4" ry="8"/>
    <ellipse cx="58" cy="228" rx="2.8" ry="6.5"/>
    <ellipse cx="262" cy="219" rx="3.4" ry="8"/>
    <ellipse cx="242" cy="228" rx="2.8" ry="6.5"/>
  </g>
</svg>
