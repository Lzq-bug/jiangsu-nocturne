<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币王牌：一枚环璧半埋土中，环心顶出一枚新芽，光从土隙里来——资源从土地本身开始">
  <defs>
    <radialGradient id="p1-soil" cx="50%" cy="30%" r="120%">
      <stop offset="0" stop-color="#171812"/><stop offset="0.6" stop-color="#101109"/><stop offset="1" stop-color="#0a0b06"/>
    </radialGradient>
    <radialGradient id="p1-bud" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b5cf8a" stop-opacity="0.55"/><stop offset="1" stop-color="#b5cf8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p1-soil)"/>

  <!-- 低地平与远处堡楼剪影（星币环境语汇，极简次级） -->
  <path d="M 0 148 C 90 144, 200 145, 300 148" stroke="#39412f" stroke-width="0.8" opacity="0.55"/>
  <g fill="#12150e">
    <path d="M 226 132 L 226 118 L 231 118 L 231 111 L 235 106 L 239 111 L 239 118 L 244 118 L 244 132 Z"/>
  </g>
  <g fill="#c7cedd" opacity="0.3">
    <circle cx="70" cy="52" r="0.8"/><circle cx="150" cy="38" r="0.7"/><circle cx="248" cy="60" r="0.8"/>
  </g>

  <!-- 田垄土纹（自地平向前景渐宽） -->
  <g stroke="#20231622" stroke-width="0.7" fill="none">
    <path d="M 0 176 C 80 172, 200 172, 300 176"/>
    <path d="M 0 204 C 70 198, 210 198, 300 203" stroke="#2a2d1c" opacity="0.6"/>
    <path d="M 0 238 C 60 230, 220 230, 300 237" stroke="#2f3220" opacity="0.7"/>
  </g>

  <!-- 环璧（主体：半埋土中，哑光旧石/旧玉，有重量、刮痕、工艺纹） -->
  <g>
    <!-- 埋入部分被土切住：环体下半被前景土层覆盖 -->
    <circle cx="150" cy="248" r="52" fill="#2e3324" stroke="#8a93ad" stroke-width="0"/>
    <circle cx="150" cy="248" r="52" fill="none" stroke="#556042" stroke-width="2.4"/>
    <circle cx="150" cy="248" r="52" fill="none" stroke="#c7cedd" stroke-width="1.3" opacity="0.85"/>
    <circle cx="150" cy="248" r="40" fill="#0c0d08"/>
    <!-- 环面工艺纹：回纹刻线（断续，旧物感） -->
    <g stroke="#8f9a7d" stroke-width="0.8" fill="none" opacity="0.75">
      <path d="M 150 200.5 A 47.5 47.5 0 0 1 190 218"/>
      <path d="M 150 203.5 A 44.5 44.5 0 0 1 186.5 219.5"/>
      <path d="M 197 230 A 47.5 47.5 0 0 1 190.5 284"/>
      <path d="M 193 232 A 44 44 0 0 1 187 280"/>
    </g>
    <!-- 刮痕与缺口（重量与年岁的证据） -->
    <g stroke="#3c442c" stroke-width="0.8" opacity="0.9" fill="none">
      <path d="M 116 220 L 124 228 M 122 216 L 128 222"/>
      <path d="M 186 274 L 194 280"/>
    </g>
    <path d="M 108 262 A 52 52 0 0 0 122 282" stroke="#14160e" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- 土痕：环体入土处 -->
    <path d="M 92 268 C 110 282, 190 282, 208 268 C 196 286, 112 288, 92 268 Z" fill="#181a10"/>
    <path d="M 96 262 C 80 260, 72 264, 66 270 M 204 262 C 220 260, 228 264, 234 270" stroke="#262a1a" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- 附着的苔与土粒 -->
    <g fill="#4a5636" opacity="0.85">
      <ellipse cx="118" cy="222" rx="5" ry="3"/><ellipse cx="184" cy="216" rx="4" ry="2.6"/><ellipse cx="196" cy="270" rx="4.4" ry="2.8"/>
    </g>
    <g fill="#202316">
      <circle cx="132" cy="204" r="1.4"/><circle cx="176" cy="292" r="1.6"/><circle cx="112" cy="284" r="1.3"/>
    </g>
  </g>

  <!-- 环心新芽（唯一叙事光源：土隙里的苔绿微光） -->
  <g>
    <circle cx="150" cy="244" r="17" fill="url(#p1-bud)"/>
    <path d="M 150 252 C 150 244, 150 238, 150 233" stroke="#9db87a" stroke-width="1.6" fill="none"/>
    <path d="M 150 240 C 144 238, 141 233, 141 228 C 146 229, 149 233, 150 238 Z" fill="#8fae6f"/>
    <path d="M 150 236 C 155 233, 157 229, 157 225 C 152 226, 150 230, 150 234 Z" fill="#a9c483"/>
    <!-- 土隙亮线（光从芽附近的土缝渗出） -->
    <path d="M 136 262 C 144 266, 158 266, 166 262" stroke="#b5cf8a" stroke-width="1" fill="none" opacity="0.8"/>
    <path d="M 130 266 C 142 271, 160 271, 172 266" stroke="#8fae6f" stroke-width="0.7" fill="none" opacity="0.5"/>
  </g>

  <!-- 前景垄土细节 -->
  <g stroke="#3a3d26" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 40 306 C 90 298, 210 298, 262 305"/>
    <path d="M 24 326 C 100 316, 200 316, 278 325"/>
  </g>
  <g fill="#242818" opacity="0.9">
    <ellipse cx="70" cy="300" rx="3.4" ry="2"/><ellipse cx="232" cy="306" rx="3" ry="1.8"/><ellipse cx="164" cy="320" rx="3.6" ry="2"/>
  </g>

  <!-- 环缘上部被远处天光照出的一线银棱（非自发光） -->
  <path d="M 108 216 A 52 52 0 0 1 186 202" stroke="#c7cedd" stroke-width="0.9" opacity="0.4" fill="none"/>
</svg>
