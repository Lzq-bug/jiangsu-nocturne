<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖国王：立在营地高台边，杖斜倚在手边，他看着平原上各处的火——统御是照看，不是咆哮">
  <defs>
    <radialGradient id="w14-night" cx="36%" cy="76%" r="135%">
      <stop offset="0" stop-color="#221410"/><stop offset="0.55" stop-color="#150e0a"/><stop offset="1" stop-color="#0c0806"/>
    </radialGradient>
    <radialGradient id="w14-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w14-night)"/>

  <!-- 夜空疏星 -->
  <g fill="#c7cedd" opacity="0.35">
    <circle cx="60" cy="36" r="0.9"/><circle cx="150" cy="26" r="0.8"/><circle cx="240" cy="44" r="0.8"/>
  </g>

  <!-- 平原上远处的营火群（次级光点：他的疆域） -->
  <g>
    <circle cx="36" cy="240" r="10" fill="url(#w14-fire)" opacity="0.8"/><circle cx="36" cy="240" r="1.8" fill="#d9814e"/>
    <circle cx="86" cy="256" r="8" fill="url(#w14-fire)" opacity="0.6"/><circle cx="86" cy="256" r="1.4" fill="#d9814e"/>
    <circle cx="150" cy="262" r="7" fill="url(#w14-fire)" opacity="0.5"/><circle cx="150" cy="262" r="1.2" fill="#d9814e"/>
  </g>
  <!-- 营地栅栏远影 -->
  <g stroke="#241610" stroke-width="2.2" opacity="0.9">
    <path d="M 8 244 L 8 232 M 22 246 L 22 234 M 36 244 L 36 233 M 50 246 L 50 235"/>
    <path d="M 4 238 L 54 240" stroke-width="1.4"/>
  </g>

  <!-- 唯一叙事光源：近处大营火（右下，在台沿下） -->
  <g transform="translate(232 282)">
    <circle r="30" fill="url(#w14-fire)"/>
    <path d="M -16 10 C -18 -4, -10 -16, 0 -19 C 3 -12, 8 -10, 10 -3 C 15 -8, 17 -3, 15 4 C 10 12, -8 15, -16 10 Z" fill="#d9814e" opacity="0.85"/>
    <path d="M -9 5 C -9 -5, -2 -12, 2 -12 C 5 -5, 7 0, 5 5 C 0 10, -6 10, -9 5 Z" fill="#f0b070" opacity="0.9"/>
    <path d="M -22 12 C -8 17, 10 17, 22 11" stroke="#8a5a3a" stroke-width="1.3" fill="none" opacity="0.8"/>
  </g>

  <!-- 高台石沿（主体所立：横贯的稳定大构图基线） -->
  <path d="M 0 262 C 70 258, 160 258, 232 264 L 232 282 L 0 282 Z" fill="#1a120c" stroke="#3a2214" stroke-width="1"/>
  <path d="M 0 262 C 70 258, 160 258, 232 264" stroke="#c98a54" stroke-width="0.8" opacity="0.5" fill="none"/>
  <g stroke="#241610" stroke-width="0.8" opacity="0.8">
    <path d="M 60 262 L 60 282 M 130 260 L 130 282 M 196 262 L 196 282"/>
  </g>

  <!-- 国王（主体：侧影站立，身形沉稳；手扶斜倚的杖，杖不垂直不居中） -->
  <g>
    <!-- 披风与身形 -->
    <path d="M 84 262
             C 82 240, 84 216, 92 196
             C 98 180, 108 168, 120 162
             C 130 157, 140 158, 146 166
             C 151 173, 152 183, 149 194
             C 145 210, 138 230, 133 250
             C 130 258, 128 262, 126 262
             C 112 264, 98 264, 84 262 Z"
          fill="#1c110a"/>
    <!-- 头（半侧影，望向平原） -->
    <path d="M 126 160 C 124 150, 130 142, 139 142 C 147 142, 152 149, 151 157 C 150 164, 143 168, 136 167 Z" fill="#1c110a"/>
    <!-- 国王冠饰：稳定顶部结构（城垛三点冠，木与焰的细节） -->
    <path d="M 127 152 C 133 146, 143 145, 150 151" stroke="#c98a54" stroke-width="1.4" fill="none"/>
    <path d="M 130 149 L 130 144 L 134 144 L 134 147 M 139 146 L 139 141 L 143 141 L 143 146 M 148 148 L 148 144 L 151 145" stroke="#c98a54" stroke-width="1.2" fill="none"/>
    <circle cx="141" cy="139" r="1.3" fill="#d9814e" opacity="0.9"/>
    <!-- 扶杖的手臂（杖斜倚身侧台沿） -->
    <path d="M 108 210 C 118 212, 130 214, 142 216" stroke="#1c110a" stroke-width="6.6" fill="none" stroke-linecap="round"/>
    <!-- 斜倚的杖（对角斜置，非垂直正中） -->
    <path d="M 138 222 L 168 128" stroke="#2e1b10" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M 139.6 220 L 169 130" stroke="#c98a54" stroke-width="0.8" fill="none" opacity="0.6"/>
    <!-- 杖端旧年新芽 -->
    <g fill="#6d5a40">
      <ellipse cx="169" cy="121" rx="3.4" ry="5"/>
      <ellipse cx="166" cy="124" rx="2.2" ry="3.4" transform="rotate(-22 166 124)"/>
    </g>
    <!-- 背手（另一只手拢在背后：看，不指挥） -->
    <path d="M 100 216 C 96 224, 94 234, 94 244" stroke="#1c110a" stroke-width="5.6" fill="none" stroke-linecap="round"/>
    <!-- 火光轮廓（右缘） -->
    <g stroke="#d9814e" fill="none" opacity="0.55">
      <path d="M 146 168 C 150 174, 151 182, 149 190" stroke-width="0.9"/>
      <path d="M 136 168 C 140 174, 142 180, 141 188" stroke-width="0.7"/>
      <path d="M 133 250 C 130 256, 128 260, 126 262" stroke-width="0.8"/>
    </g>
    <!-- 腰封 -->
    <path d="M 92 216 C 104 220, 120 220, 132 216" stroke="#8a5a3a" stroke-width="1.6" fill="none" opacity="0.8"/>
  </g>

  <!-- 台下的地面与火光暖痕 -->
  <path d="M 0 282 C 80 278, 200 278, 300 282 L 300 340 L 0 340 Z" fill="#0e0906"/>
  <g stroke="#241610" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 40 316 C 120 310, 220 310, 280 316"/>
  </g>
  <path d="M 200 310 C 216 306, 238 306, 252 310" stroke="#c98a54" stroke-width="0.9" fill="none" opacity="0.4"/>
</svg>
