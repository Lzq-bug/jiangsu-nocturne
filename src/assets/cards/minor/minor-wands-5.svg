<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖五：五杖交错的演武">
  <defs>
    <radialGradient id="w5-ground" cx="50%" cy="30%" r="95%">
      <stop offset="0" stop-color="#211810"/><stop offset="0.6" stop-color="#181209"/><stop offset="1" stop-color="#0f0a06"/>
    </radialGradient>
    <radialGradient id="w5-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w5-ground)"/>

  <!-- 五杖空间交错（不同方向活木，非排开） -->
  <g>
    <!-- 杖1：左下入右上出 -->
    <path d="M 36 300 L 216 96 L 224 104 L 48 306 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.6"/>
    <!-- 杖2：右下入左上出 -->
    <path d="M 262 296 L 92 108 L 84 116 L 252 302 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.6"/>
    <!-- 杖3：近水平 -->
    <path d="M 40 190 L 258 168 L 259 177 L 42 199 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.6"/>
    <!-- 杖4：左侧陡立 -->
    <path d="M 92 302 L 128 120 L 137 122 L 104 304 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.6"/>
    <!-- 杖5：右侧陡立 -->
    <path d="M 204 302 L 172 124 L 181 122 L 216 300 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.6"/>
  </g>

  <!-- 交错点的迸火星（三处主交点，弹开方向各异） -->
  <g>
    <g transform="translate(148 178)">
      <circle r="24" fill="url(#w5-spark)"/>
      <circle r="2.4" fill="#e9edf5"/>
      <g fill="#d9814e">
        <circle cx="14" cy="-10" r="1.8"/><circle cx="-15" cy="8" r="1.6"/><circle cx="6" cy="16" r="1.4"/>
      </g>
      <g stroke="#d9814e" stroke-width="0.8" opacity="0.8">
        <line x1="18" y1="-14" x2="24" y2="-19"/><line x1="-18" y1="11" x2="-24" y2="15"/><line x1="9" y1="20" x2="12" y2="26"/>
      </g>
    </g>
    <g transform="translate(104 240)">
      <circle r="16" fill="url(#w5-spark)" opacity="0.8"/>
      <circle r="2" fill="#e9edf5" opacity="0.95"/>
      <circle cx="10" cy="8" r="1.4" fill="#d9814e"/>
      <circle cx="-9" cy="-7" r="1.3" fill="#d9814e"/>
    </g>
    <g transform="translate(212 214)">
      <circle r="16" fill="url(#w5-spark)" opacity="0.8"/>
      <circle r="2" fill="#e9edf5" opacity="0.95"/>
      <circle cx="11" cy="-6" r="1.4" fill="#d9814e"/>
      <circle cx="-8" cy="9" r="1.3" fill="#d9814e"/>
    </g>
  </g>

  <!-- 两名兜帽演武者剪影（左右边缘，无脸，只介入不主导） -->
  <g>
    <path d="M 24 300 C 24 276, 32 260, 48 254 C 44 246, 46 236, 54 232 C 62 228, 72 232, 74 242 C 80 246, 82 254, 78 260 C 88 268, 92 282, 90 300 Z"
          fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    <path d="M 276 300 C 276 278, 270 264, 258 258 C 262 250, 260 240, 252 236 C 244 232, 234 236, 232 246 C 226 250, 224 258, 228 264 C 218 272, 214 286, 216 300 Z"
          fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
  </g>

  <!-- 地面尘土 -->
  <path d="M 0 316 L 300 316" stroke="#8a93ad" stroke-width="0.8" opacity="0.55"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.5" fill="none">
    <path d="M 40 330 C 90 324, 150 324, 210 330 M 100 296 C 130 290, 170 290, 200 296"/>
  </g>
  <g stroke="#d9814e" stroke-width="0.7" opacity="0.5" fill="none">
    <path d="M 120 306 C 140 300, 160 300, 180 306"/>
  </g>
</svg>
