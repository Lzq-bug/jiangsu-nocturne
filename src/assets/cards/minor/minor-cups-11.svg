<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯侍从：蹲在水边石阶上，看杯中一圈不该出现的涟漪——第一次听懂水说话">
  <defs>
    <radialGradient id="c11-night" cx="50%" cy="24%" r="130%">
      <stop offset="0" stop-color="#0f1c26"/><stop offset="0.55" stop-color="#0b141d"/><stop offset="1" stop-color="#060c13"/>
    </radialGradient>
    <radialGradient id="c11-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7d8e8" stop-opacity="0.4"/><stop offset="1" stop-color="#c7d8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c11-night)"/>

  <!-- 蛾眉月与疏星（唯一叙事光源：低月斜照水面） -->
  <g transform="translate(238 52)">
    <circle r="16" fill="url(#c11-moon)"/>
    <path d="M 5 -8 A 9 9 0 1 0 5 8 A 7 7 0 1 1 5 -8 Z" fill="#c7d8e8" opacity="0.9"/>
  </g>
  <g fill="#c7cedd" opacity="0.4">
    <circle cx="60" cy="44" r="0.9"/><circle cx="140" cy="30" r="0.8"/><circle cx="196" cy="64" r="0.7"/>
  </g>

  <!-- 远岸线 -->
  <path d="M 0 148 C 90 144, 200 144, 300 148" stroke="#8a93ad" stroke-width="0.7" opacity="0.35"/>
  <!-- 岸边香蒲（次级，极简） -->
  <g stroke="#4a5840" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 40 176 C 38 160, 40 148, 44 138"/>
    <path d="M 52 178 C 52 164, 52 154, 52 146"/>
  </g>
  <g fill="#3a4530">
    <ellipse cx="44" cy="134" rx="2" ry="5.4"/><ellipse cx="52" cy="142" rx="1.8" ry="4.6"/>
  </g>

  <!-- 水边石阶（三级，向水而降；湿面受月光） -->
  <g>
    <path d="M 0 200 H 300 V 216 H 0 Z" fill="#0d1420" stroke="#8a93ad" stroke-width="0.5" opacity="0.9"/>
    <path d="M 0 216 H 300 V 236 H 0 Z" fill="#0c1119"/>
    <path d="M 0 236 H 300 V 260 H 0 Z" fill="#0b0f16"/>
    <g stroke="#8a93ad" stroke-width="0.6" opacity="0.3">
      <path d="M 0 200 H 300 M 0 216 H 300 M 0 236 H 300"/>
    </g>
    <!-- 石缝 -->
    <g stroke="#1c2432" stroke-width="0.8" opacity="0.9">
      <path d="M 84 200 V 216 M 188 200 V 216 M 120 216 V 236 M 232 216 V 236 M 64 236 V 260 M 170 236 V 260"/>
    </g>
    <!-- 湿痕（月光斜照的石面亮带） -->
    <g stroke="#aebdd6" opacity="0.28" fill="none">
      <path d="M 30 208 C 60 206, 100 206, 134 208"/>
      <path d="M 190 226 C 220 224, 258 224, 288 226"/>
    </g>
  </g>

  <!-- 水面（下带）与异常涟漪（主体之一） -->
  <path d="M 0 260 H 300 V 340 H 0 Z" fill="#08111a"/>
  <g stroke="#6fc2c9" fill="none">
    <!-- 异常的同心涟漪：自杯口下方荡开，一圈比一圈大 -->
    <ellipse cx="150" cy="290" rx="18" ry="3.4" stroke-width="1.4" opacity="0.9"/>
    <ellipse cx="150" cy="292" rx="34" ry="6" stroke-width="1" opacity="0.65"/>
    <ellipse cx="150" cy="295" rx="54" ry="9" stroke-width="0.8" opacity="0.45"/>
    <ellipse cx="150" cy="299" rx="78" ry="12.6" stroke-width="0.7" opacity="0.3"/>
    <ellipse cx="150" cy="304" rx="104" ry="16.4" stroke-width="0.6" opacity="0.2"/>
  </g>
  <!-- 月光水路（自远岸到近前的碎光） -->
  <g stroke="#c7d8e8" fill="none">
    <path d="M 236 168 L 232 182" stroke-width="1.2" opacity="0.5"/>
    <path d="M 230 192 L 226 208" stroke-width="1" opacity="0.4"/>
    <path d="M 222 266 L 220 280" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- 侍从（全宫廷唯一蹲姿：蹲于第二级石阶，双手捧低杯，视线向下） -->
  <g>
    <!-- 蹲姿剪影（紧凑） -->
    <path d="M 118 262
             C 114 244, 118 226, 132 218
             C 144 211, 158 214, 166 224
             C 170 230, 172 238, 172 246
             C 178 248, 182 254, 182 260
             C 182 268, 176 274, 168 276
             L 168 286
             C 168 292, 164 296, 158 296
             L 128 296
             C 122 296, 118 292, 118 286 Z"
          fill="#101824"/>
    <!-- 头（低垂侧影） -->
    <path d="M 138 216 C 136 206, 142 198, 150 198 C 158 198, 163 204, 162 212 C 161 218, 156 222, 150 222 Z" fill="#101824"/>
    <!-- 侍从冠饰：细索带+一枚小贝珠 -->
    <path d="M 140 206 C 146 202, 154 202, 160 206" stroke="#6fc2c9" stroke-width="1" fill="none" opacity="0.85"/>
    <circle cx="150" cy="201.4" r="1.6" fill="#8ed8de" opacity="0.9"/>
    <!-- 手臂自膝上探向杯 -->
    <path d="M 130 248 C 136 254, 144 258, 152 260" stroke="#101824" stroke-width="6.4" fill="none" stroke-linecap="round"/>
    <!-- 杯（小，身份物：月光在杯口点了一线） -->
    <g>
      <path d="M 154 258 L 172 256 C 173 248, 170 243, 163 241 L 163 235 L 168 231 L 146 231 L 151 235 L 151 241 C 145 243, 143 248, 145 256 Z"
            fill="#0c141e" stroke="#c7cedd" stroke-width="1.3" transform="translate(6 0)"/>
      <path d="M 156 245 C 158 243.4, 166 243.4, 168 245" stroke="#c7d8e8" stroke-width="0.9" fill="none" opacity="0.85"/>
    </g>
    <!-- 月光轮廓（右缘与肩线，加强保证 96px 剪影可读） -->
    <g stroke="#aebdd6" fill="none" opacity="0.9">
      <path d="M 165 226 C 169 232, 171 238, 172 244 C 173 252, 172 260, 169 268" stroke-width="1.2"/>
      <path d="M 150 199 C 157 199.4, 162 204, 162 211 C 162 216, 160 220, 157 222" stroke-width="1"/>
      <path d="M 168 278 C 168 284, 165 289, 159 293" stroke-width="1"/>
      <path d="M 132 218 C 128 226, 126 236, 127 246" stroke-width="0.9" opacity="0.6"/>
    </g>
  </g>

  <!-- 蹲处的影与湿痕 -->
  <path d="M 120 300 C 140 297, 164 297, 182 300" stroke="#1a2432" stroke-width="3" opacity="0.8" fill="none"/>
  <path d="M 110 312 C 136 308, 168 308, 194 312" stroke="#2a3848" stroke-width="0.7" opacity="0.5" fill="none"/>
</svg>
