<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币国王：田垄上的持环之主">
  <defs>
    <radialGradient id="pnt-ground" cx="44%" cy="34%" r="92%">
      <stop offset="0" stop-color="#1a2114"/><stop offset="0.6" stop-color="#151b10"/><stop offset="1" stop-color="#0c100a"/>
    </radialGradient>
    <radialGradient id="pnt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8b87a" stop-opacity="0.4"/><stop offset="1" stop-color="#a8b87a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pnt-furrow" width="14" height="9" patternUnits="userSpaceOnUse">
      <path d="M 0 7 Q 7 3 14 7" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#pnt-ground)"/>

  <!-- 远处堡楼剪影 -->
  <g fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9">
    <path d="M 24 208 L 24 160 L 32 160 L 32 148 L 40 148 L 40 142 L 48 142 L 48 148 L 56 148 L 56 160 L 64 160 L 64 208 Z" opacity="0.85"/>
    <path d="M 66 208 L 66 182 L 84 182 L 84 208" opacity="0.7"/>
  </g>
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="120" cy="60" r="1"/><circle cx="210" cy="48" r="1.1"/><circle cx="258" cy="96" r="0.9"/>
  </g>

  <!-- 王座（石与木） -->
  <g>
    <path d="M 92 300 L 92 148 C 92 128, 104 116, 122 112 L 196 112 C 214 116, 226 128, 226 148 L 226 300 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 104 300 L 104 156 C 104 142, 112 132, 126 128 L 192 128 C 206 132, 214 142, 214 156 L 214 300"
          fill="none" stroke="#8a93ad" stroke-width="0.8" opacity="0.55"/>
    <path d="M 84 300 L 234 300 L 240 316 L 78 316 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
  </g>

  <!-- 王：侧面剪影，面朝左 -->
  <g>
    <!-- 长袍自肩泻下，袍脚化作田垄 -->
    <path d="M 128 156
             C 132 146, 142 140, 154 140
             C 170 140, 180 148, 184 158
             C 192 190, 198 232, 202 276
             L 206 296 L 116 296
             C 118 258, 120 200, 128 156 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.6"/>
    <!-- 袍褶 -->
    <g stroke="#8a93ad" stroke-width="0.8" fill="none" opacity="0.6">
      <path d="M 140 170 C 136 210, 134 250, 134 288"/>
      <path d="M 158 166 C 158 210, 160 250, 162 290"/>
      <path d="M 176 172 C 182 212, 188 252, 192 288"/>
    </g>
    <!-- 头与冠 -->
    <g transform="translate(152 122)">
      <path d="M -11 8 C -13 -2, -8 -12, 2 -13 C 11 -14, 17 -8, 17 1 L 16 10 L -10 12 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
      <path d="M -13 -6 L -10 -13 L -4 -9 L 1 -16 L 6 -9 L 12 -13 L 14 -5" fill="none" stroke="#e9d9a8" stroke-width="1.6"/>
      <circle cx="1" cy="-19" r="1.8" fill="#a8b87a"/>
      <path d="M -9 2 L 14 2" stroke="#8a93ad" stroke-width="0.7" opacity="0.7"/>
    </g>
    <!-- 手臂与持环 -->
    <path d="M 136 176 C 130 190, 128 202, 130 212" fill="none" stroke="#c7cedd" stroke-width="3" opacity="0.9"/>
    <!-- 大环璧（全牌最亮处，叙事光源落在环面） -->
    <g transform="translate(122 238)">
      <circle r="26" fill="url(#pnt-glow)" opacity="0.9"/>
      <circle r="24" fill="#141a10" stroke="#a8b87a" stroke-width="2.4"/>
      <circle r="17" fill="none" stroke="#a8b87a" stroke-width="1" opacity="0.8"/>
      <path d="M 0 -11 L 2.6 -3.4 L 10.4 -1 L 2.6 1.4 L 0 9 L -2.6 1.4 L -10.4 -1 L -2.6 -3.4 Z" fill="#a8b87a" opacity="0.95"/>
      <g stroke="#8a93ad" stroke-width="0.5" opacity="0.6">
        <line x1="0" y1="-24" x2="0" y2="-28"/><line x1="0" y1="24" x2="0" y2="28"/>
        <line x1="-24" y1="0" x2="-28" y2="0"/><line x1="24" y1="0" x2="28" y2="0"/>
      </g>
    </g>
    <!-- 另一手扶coin缘 -->
    <path d="M 176 196 C 170 204, 162 210, 152 214" fill="none" stroke="#c7cedd" stroke-width="2.6" opacity="0.85"/>
  </g>

  <!-- 坐侧藤蔓（丰饶） -->
  <g stroke="#c7cedd" fill="none" stroke-width="1.2" opacity="0.85">
    <path d="M 226 292 C 240 274, 244 252, 238 230 C 234 214, 238 198, 248 188"/>
    <path d="M 238 240 C 230 234, 226 226, 226 218"/>
  </g>
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
    <path d="M 240 206 C 232 200, 230 190, 234 182 C 242 186, 245 196, 240 206 Z"/>
    <path d="M 244 254 C 252 250, 260 252, 264 258 C 258 264, 248 262, 244 254 Z"/>
    <circle cx="250" cy="226" r="3.2"/>
    <circle cx="256" cy="234" r="3.2"/>
    <circle cx="246" cy="236" r="3"/>
  </g>

  <!-- 袍脚化作田垄（王的疆土） -->
  <g>
    <path d="M 60 316 L 258 316 L 300 340 L 0 340 Z" fill="url(#pnt-furrow)" opacity="0.9"/>
    <path d="M 60 316 L 258 316" stroke="#c7cedd" stroke-width="1" opacity="0.7"/>
    <g stroke="#8a93ad" stroke-width="0.6" opacity="0.55">
      <line x1="30" y1="324" x2="272" y2="324"/>
      <line x1="14" y1="331" x2="290" y2="331"/>
    </g>
    <!-- 田里冒出的新苗 -->
    <g stroke="#a8b87a" stroke-width="1" opacity="0.85" fill="none">
      <path d="M 70 330 C 70 324, 72 320, 76 318 M 76 330 C 78 325, 82 322, 86 321"/>
      <path d="M 210 330 C 210 324, 212 320, 216 318 M 216 330 C 218 325, 222 322, 226 321"/>
    </g>
  </g>
</svg>
