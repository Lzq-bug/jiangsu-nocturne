<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑三：三刃穿云，雨落星现">
  <defs>
    <radialGradient id="swd-ground" cx="50%" cy="30%" r="92%">
      <stop offset="0" stop-color="#151d30"/><stop offset="0.62" stop-color="#101728"/><stop offset="1" stop-color="#0a0f1c"/>
    </radialGradient>
    <radialGradient id="swd-star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fb6d9" stop-opacity="0.5"/><stop offset="1" stop-color="#9fb6d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swd-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb6d9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#9fb6d9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#swd-ground)"/>

  <!-- 冷月斜辉（叙事光源：左上的一道薄光楔） -->
  <path d="M 0 0 L 128 0 L 40 210 Z" fill="url(#swd-beam)"/>

  <!-- 云心：以两卷云涡围成心形（非血肉） -->
  <g>
    <path d="M 150 208
             C 122 208, 100 190, 100 164
             C 100 140, 118 128, 136 130
             C 142 118, 158 118, 164 130
             C 182 128, 200 140, 200 164
             C 200 190, 178 208, 150 208 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.7"/>
    <!-- 云涡卷线 -->
    <g fill="none" stroke="#8a93ad" stroke-width="0.9" opacity="0.7">
      <path d="M 118 158 C 122 148, 134 144, 142 150"/>
      <path d="M 128 174 C 132 164, 144 160, 152 166"/>
      <path d="M 182 158 C 178 148, 166 144, 158 150"/>
      <path d="M 172 174 C 168 164, 156 160, 148 166"/>
      <path d="M 140 190 C 146 184, 154 184, 160 190"/>
    </g>
    <g stroke="#8a93ad" stroke-width="0.6" opacity="0.5" fill="none">
      <path d="M 104 150 C 110 144, 118 142, 126 144"/>
      <path d="M 196 150 C 190 144, 182 142, 174 144"/>
    </g>
  </g>

  <!-- 三刃穿云而下（竖直微张） -->
  <g>
    <g transform="translate(122 0)">
      <path d="M 0 118 L 5 168 L 3 236 L 0 252 L -3 236 L -5 168 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M 0 126 L 0 236" stroke="#8a93ad" stroke-width="0.6" opacity="0.7"/>
      <rect x="-11" y="100" width="22" height="7" rx="2.5" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <rect x="-2.4" y="82" width="4.8" height="20" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
      <circle cx="0" cy="78" r="4.4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
    </g>
    <g transform="translate(178 6)">
      <path d="M 0 118 L 5 168 L 3 240 L 0 256 L -3 240 L -5 168 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M 0 126 L 0 240" stroke="#8a93ad" stroke-width="0.6" opacity="0.7"/>
      <rect x="-11" y="100" width="22" height="7" rx="2.5" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <rect x="-2.4" y="82" width="4.8" height="20" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
      <circle cx="0" cy="78" r="4.4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
    </g>
    <g transform="translate(150 30)">
      <path d="M 0 112 L 5 160 L 3 224 L 0 240 L -3 224 L -5 160 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
      <path d="M 0 120 L 0 224" stroke="#8a93ad" stroke-width="0.6" opacity="0.7"/>
      <rect x="-12" y="94" width="24" height="7.5" rx="2.6" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
      <rect x="-2.6" y="76" width="5.2" height="20" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <circle cx="0" cy="71" r="4.8" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
    </g>
  </g>

  <!-- 云后的星（痛过之后仍会出现的坐标） -->
  <g transform="translate(150 92)">
    <circle r="22" fill="url(#swd-star)"/>
    <path d="M 0 -10 L 2.4 -2.4 L 10 0 L 2.4 2.4 L 0 10 L -2.4 2.4 L -10 0 L -2.4 -2.4 Z" fill="#c7cedd" opacity="0.9"/>
  </g>

  <!-- 落雨 -->
  <g stroke="#8a93ad" stroke-width="0.9" opacity="0.6" stroke-linecap="round">
    <line x1="96" y1="240" x2="90" y2="262"/><line x1="120" y1="252" x2="114" y2="274"/>
    <line x1="150" y1="258" x2="144" y2="282"/><line x1="180" y1="252" x2="174" y2="274"/>
    <line x1="206" y1="240" x2="200" y2="262"/><line x1="110" y1="290" x2="105" y2="308"/>
    <line x1="150" y1="300" x2="145" y2="318"/><line x1="190" y1="290" x2="185" y2="308"/>
  </g>

  <!-- 地平与积水 -->
  <path d="M 24 322 L 276 322" stroke="#8a93ad" stroke-width="0.8" opacity="0.5"/>
  <g stroke="#9fb6d9" opacity="0.3" fill="none">
    <path d="M 84 330 C 110 334, 150 334, 176 330" stroke-width="0.8"/>
    <path d="M 120 310 C 140 313, 164 313, 184 310" stroke-width="0.6"/>
  </g>
</svg>
