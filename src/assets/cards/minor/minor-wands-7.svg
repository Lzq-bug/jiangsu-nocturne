<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖七：高台木沿的防守，一杖撑住来犯的六道杖影">
  <defs>
    <radialGradient id="w7-ground" cx="42%" cy="20%" r="110%">
      <stop offset="0" stop-color="#1f1710"/><stop offset="0.55" stop-color="#150f09"/><stop offset="1" stop-color="#0d0906"/>
    </radialGradient>
    <radialGradient id="w7-torch" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.55"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w7-ground)"/>

  <!-- 高台木构平台（位置优势：垂直高差，非斜坡） -->
  <g>
    <!-- 台面（横贯上带，厚木沿） -->
    <path d="M 0 118 L 300 112 L 300 134 L 0 140 Z" fill="#1c1208" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 0 124 L 300 118" stroke="#8a93ad" stroke-width="0.7" opacity="0.55"/>
    <!-- 木纹 -->
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4">
      <path d="M 24 130 L 92 129 M 130 128 L 210 127 M 240 126 L 292 125"/>
    </g>
    <!-- 支柱 -->
    <g stroke="#c7cedd" stroke-width="1.3" opacity="0.9">
      <line x1="26" y1="140" x2="26" y2="230"/><line x1="284" y1="134" x2="284" y2="224"/>
    </g>
    <line x1="26" y1="140" x2="26" y2="230" stroke="#0d0906" stroke-width="0.8" opacity="0.6"/>
    <!-- 台上矮栏 -->
    <path d="M 0 96 L 300 90" stroke="#8a93ad" stroke-width="1" opacity="0.6"/>
    <g stroke="#8a93ad" stroke-width="0.9" opacity="0.5">
      <line x1="44" y1="96" x2="44" y2="114"/><line x1="108" y1="94" x2="108" y2="112"/>
      <line x1="238" y1="91" x2="238" y2="109"/><line x1="284" y1="90" x2="284" y2="108"/>
    </g>
  </g>

  <!-- 台上的火盆（唯一叙事光源：守方阵地的一点火） -->
  <g transform="translate(62 86)">
    <circle r="22" fill="url(#w7-torch)"/>
    <path d="M -8 8 L 8 8 L 6 2 L -6 2 Z" fill="#0d0906" stroke="#8a5a3a" stroke-width="0.9"/>
    <path d="M 0 2 C 3 -3, 2 -8, 0 -12 C -2 -8, -3 -3, 0 2 Z" fill="#d9814e"/>
    <path d="M 0 0 C 1.6 -3, 1 -6, 0 -8 C -1 -6, -1.4 -3, 0 0 Z" fill="#f0c078"/>
  </g>

  <!-- 防守的主杖：自台沿斜撑向下（上端抵栏，下端踏地） -->
  <g>
    <path d="M 92 92 L 186 268" stroke="#2e1b10" stroke-width="6.6" stroke-linecap="round"/>
    <path d="M 94 96 L 184 262" stroke="#c98a54" stroke-width="1.1" opacity="0.8"/>
    <path d="M 97 110 L 184 258" stroke="#1a0e07" stroke-width="0.9" opacity="0.7"/>
    <!-- 木节 -->
    <g stroke="#1a0e07" stroke-width="0.7" opacity="0.7">
      <path d="M 118 150 C 120 148, 122 148, 124 150 M 140 194 C 142 192, 144 192, 146 194"/>
    </g>
    <!-- 顶端固定在矮栏上的绑扎 -->
    <path d="M 88 88 C 92 84, 98 84, 102 88 M 90 96 C 94 92, 98 92, 100 96" fill="none" stroke="#a89278" stroke-width="1.2"/>
  </g>

  <!-- 来犯的六道杖影：自台下暗处向上探（只露杖尖，不露人） -->
  <g stroke-linecap="round">
    <path d="M 128 340 L 158 236" stroke="#241509" stroke-width="5.8"/>
    <path d="M 164 340 L 186 252" stroke="#2e1b10" stroke-width="5.8"/>
    <path d="M 198 340 L 210 262" stroke="#241509" stroke-width="5.4"/>
    <path d="M 232 340 L 236 268" stroke="#33200f" stroke-width="5.8"/>
    <path d="M 96 340 L 130 262" stroke="#2e1b10" stroke-width="5.4"/>
    <path d="M 262 340 L 258 272" stroke="#241509" stroke-width="5"/>
  </g>
  <g stroke="#c98a54" stroke-width="0.8" opacity="0.85">
    <path d="M 131 330 L 155 246 M 167 330 L 183 260 M 200 330 L 207 270 M 233 330 L 234 276 M 99 330 L 126 270 M 261 330 L 257 280"/>
  </g>
  <!-- 杖尖受台沿火光的一点暖 -->
  <g fill="#d9814e" opacity="0.5">
    <circle cx="158" cy="238" r="2.4"/><circle cx="186" cy="254" r="2.2"/><circle cx="210" cy="264" r="2"/>
    <circle cx="236" cy="270" r="2.2"/><circle cx="130" cy="264" r="2"/><circle cx="258" cy="274" r="1.8"/>
  </g>

  <!-- 迸落的火星（冲突已在进行） -->
  <g fill="#d9814e" opacity="0.85">
    <circle cx="150" cy="228" r="1.3"/><circle cx="176" cy="242" r="1.1"/><circle cx="122" cy="252" r="1"/>
    <circle cx="204" cy="256" r="0.9"/><circle cx="98" cy="270" r="0.9"/>
  </g>

  <!-- 台下地面 -->
  <path d="M 0 296 C 70 292, 150 294, 230 296 C 260 297, 284 297, 300 296" fill="none" stroke="#c7cedd" stroke-width="0.9" opacity="0.4"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 30 314 L 104 314 M 210 322 L 280 322"/>
  </g>
</svg>
