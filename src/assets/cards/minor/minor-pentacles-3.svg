<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币三：脚手架上协作的手">
  <defs>
    <radialGradient id="p3-ground" cx="46%" cy="28%" r="95%">
      <stop offset="0" stop-color="#191f10"/><stop offset="0.6" stop-color="#141a0d"/><stop offset="1" stop-color="#0b0f08"/>
    </radialGradient>
    <radialGradient id="p3-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8b87a" stop-opacity="0.4"/><stop offset="1" stop-color="#a8b87a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-brick" width="18" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 18 5 M 9 0 L 9 5 M 4 5 L 4 10 M 14 5 L 14 10" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#p3-ground)"/>

  <!-- 教堂穹顶拱（在建工程，远中景） -->
  <g fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.6">
    <path d="M 60 320 L 60 180 C 60 96, 110 48, 150 48 C 190 48, 240 96, 240 180 L 240 320"/>
    <path d="M 84 320 L 84 188 C 84 116, 122 74, 150 74 C 178 74, 216 116, 216 188 L 216 320" opacity="0.5"/>
    <path d="M 150 48 L 150 74 M 110 62 C 122 54, 138 50, 150 50" opacity="0.6"/>
  </g>
  <path d="M 90 320 L 90 200 C 90 140, 116 100, 150 100 C 184 100, 210 140, 210 200 L 210 320 Z"
        fill="url(#p3-brick)" opacity="0.5"/>

  <!-- 拱图纸上的一枚三环徽（图纸，叙事光源附近） -->
  <g transform="translate(150 214)">
    <circle r="24" fill="url(#p3-lamp)"/>
    <path d="M -46 -30 L 46 -30 L 46 30 L -46 30 Z" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.5"/>
    <g fill="none" stroke="#c7cedd" stroke-width="1.3">
      <circle cx="-13" cy="4" r="9"/>
      <circle cx="13" cy="4" r="9"/>
      <circle cx="0" cy="-11" r="9" stroke="#a8b87a"/>
    </g>
  </g>

  <!-- 脚手架 -->
  <g stroke="#8a93ad" stroke-width="1.2" opacity="0.9">
    <line x1="34" y1="120" x2="34" y2="320"/><line x1="266" y1="120" x2="266" y2="320"/>
    <line x1="34" y1="120" x2="266" y2="120"/><line x1="34" y1="180" x2="266" y2="180"/>
    <line x1="34" y1="240" x2="266" y2="240"/><line x1="34" y1="300" x2="266" y2="300"/>
    <line x1="34" y1="120" x2="120" y2="180"/><line x1="266" y1="120" x2="180" y2="180"/>
  </g>
  <!-- 绑扎点 -->
  <g fill="#8a93ad" opacity="0.7">
    <circle cx="34" cy="120" r="1.8"/><circle cx="266" cy="120" r="1.8"/><circle cx="120" cy="180" r="1.8"/><circle cx="180" cy="180" r="1.8"/>
    <circle cx="34" cy="240" r="1.8"/><circle cx="266" cy="240" r="1.8"/>
  </g>

  <!-- 三双悬空的手（主体）：各执工具 -->
  <g>
    <!-- 左手：抹刀 -->
    <g transform="translate(96 150) rotate(18)">
      <path d="M 0 0 C 10 -4, 22 -4, 30 0 C 24 8, 10 8, 0 0 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M 30 0 L 46 2" stroke="#c7cedd" stroke-width="2"/>
      <path d="M -6 4 C 2 10, 14 12, 24 10" fill="none" stroke="#c7cedd" stroke-width="4" opacity="0.9"/>
      <path d="M 24 10 L 30 6" stroke="#c7cedd" stroke-width="3" opacity="0.9"/>
    </g>
    <!-- 右手：锤 -->
    <g transform="translate(206 148) rotate(-14)">
      <path d="M -14 6 L 0 0 L 8 2 L 8 10 L -2 12 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M 4 -2 L 22 -6 L 24 4 L 8 8 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
      <path d="M -10 12 C -2 16, 8 16, 16 12" fill="none" stroke="#c7cedd" stroke-width="4" opacity="0.9"/>
    </g>
    <!-- 中手：托一枚未嵌的环石 -->
    <g transform="translate(150 258)">
      <circle r="14" fill="#0b0f20" stroke="#a8b87a" stroke-width="2"/>
      <circle r="9" fill="none" stroke="#a8b87a" stroke-width="0.8" opacity="0.8"/>
      <path d="M -26 16 C -14 8, 14 8, 26 16" fill="none" stroke="#c7cedd" stroke-width="4" opacity="0.9"/>
      <path d="M -30 18 L -22 12 M 30 18 L 22 12" stroke="#c7cedd" stroke-width="3" opacity="0.9"/>
    </g>
  </g>

  <!-- 地面木屑 -->
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45">
    <line x1="60" y1="326" x2="86" y2="324"/><line x1="210" y1="328" x2="240" y2="326"/><line x1="130" y1="332" x2="152" y2="331"/>
  </g>
</svg>
