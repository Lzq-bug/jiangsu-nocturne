<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币三：脚手架上协作的手">
  <defs>
    <radialGradient id="p3-ground" cx="46%" cy="28%" r="95%">
      <stop offset="0" stop-color="#191f10"/><stop offset="0.6" stop-color="#141a0d"/><stop offset="1" stop-color="#0b0f08"/>
    </radialGradient>
    <radialGradient id="p3-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8b87a" stop-opacity="0.4"/><stop offset="1" stop-color="#a8b87a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-brick" width="18" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 18 5 M 9 0 L 9 5 M 4 5 L 4 10 M 14 5 L 14 10" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#p3-ground)"/>

  <!-- 教堂穹顶拱（在建工程，简化两道） -->
  <g fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.55">
    <path d="M 60 320 L 60 180 C 60 96, 110 48, 150 48 C 190 48, 240 96, 240 180 L 240 320"/>
    <path d="M 150 48 L 150 74" opacity="0.6"/>
  </g>

  <!-- 拱图纸上一枚三环徽（主构件，叙事光源附近） -->
  <g transform="translate(150 210)">
    <circle r="28" fill="url(#p3-lamp)"/>
    <path d="M -50 -34 L 50 -34 L 50 34 L -50 34 Z" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.5"/>
    <g fill="none" stroke="#e9edf5" stroke-width="1.6">
      <circle cx="-14" cy="5" r="10"/>
      <circle cx="14" cy="5" r="10"/>
      <circle cx="0" cy="-12" r="10" stroke="#a8b87a"/>
    </g>
  </g>

  <!-- 脚手架（减少横杆） -->
  <g stroke="#8a93ad" stroke-width="1.2" opacity="0.85">
    <line x1="30" y1="118" x2="30" y2="320"/><line x1="270" y1="118" x2="270" y2="320"/>
    <line x1="30" y1="118" x2="270" y2="118"/><line x1="30" y1="230" x2="270" y2="230"/>
    <line x1="30" y1="118" x2="118" y2="176"/><line x1="270" y1="118" x2="182" y2="176"/>
  </g>
  <g fill="#8a93ad" opacity="0.7">
    <circle cx="30" cy="118" r="1.8"/><circle cx="270" cy="118" r="1.8"/><circle cx="118" cy="176" r="1.8"/><circle cx="182" cy="176" r="1.8"/>
    <circle cx="30" cy="230" r="1.8"/><circle cx="270" cy="230" r="1.8"/>
  </g>

  <!-- 三双悬空的手：拉开间距成清晰三角 -->
  <g>
    <!-- 左上手：抹刀 -->
    <g transform="translate(84 142) rotate(20)">
      <path d="M 0 0 C 10 -4, 22 -4, 30 0 C 24 8, 10 8, 0 0 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M 30 0 L 48 2" stroke="#c7cedd" stroke-width="2"/>
      <path d="M -6 4 C 2 10, 14 12, 24 10" fill="none" stroke="#e9edf5" stroke-width="4" opacity="0.95"/>
      <path d="M 24 10 L 30 6" stroke="#e9edf5" stroke-width="3" opacity="0.95"/>
    </g>
    <!-- 右上手：锤 -->
    <g transform="translate(220 140) rotate(-16)">
      <path d="M -14 6 L 0 0 L 8 2 L 8 10 L -2 12 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
      <path d="M 4 -2 L 24 -6 L 26 4 L 8 8 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
      <path d="M -10 12 C -2 16, 8 16, 16 12" fill="none" stroke="#e9edf5" stroke-width="4" opacity="0.95"/>
    </g>
    <!-- 下手：托一枚未嵌的环石（主构件） -->
    <g transform="translate(150 262)">
      <circle r="15" fill="#0b0f20" stroke="#a8b87a" stroke-width="2.4"/>
      <circle r="9.5" fill="none" stroke="#a8b87a" stroke-width="0.9" opacity="0.85"/>
      <path d="M -28 16 C -14 8, 14 8, 28 16" fill="none" stroke="#e9edf5" stroke-width="4" opacity="0.95"/>
      <path d="M -32 18 L -23 11 M 32 18 L 23 11" stroke="#e9edf5" stroke-width="3" opacity="0.95"/>
    </g>
  </g>

  <!-- 地面木屑 -->
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45">
    <line x1="60" y1="326" x2="86" y2="324"/><line x1="210" y1="328" x2="240" y2="326"/>
  </g>
</svg>
