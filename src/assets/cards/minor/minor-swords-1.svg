<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑王牌：一剑斜切云层，光从裂开的天空落下来">
  <defs>
    <linearGradient id="s1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182238"/><stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="s1-gap" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#dfe8f6" stop-opacity="0.9"/><stop offset="0.55" stop-color="#aebdd6" stop-opacity="0.35"/><stop offset="1" stop-color="#aebdd6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s1-sky)"/>

  <!-- 未裂的云层（厚重排线云团，上下两带） -->
  <g fill="#1a2438" stroke="#6d7898" stroke-width="1">
    <path d="M -10 96 C 30 78, 84 74, 128 86 C 150 92, 166 100, 172 110 C 130 122, 60 124, 12 116 C -4 112, -12 104, -10 96 Z"/>
    <path d="M 128 262 C 168 246, 232 242, 286 254 C 300 258, 306 266, 300 274 C 252 286, 170 288, 122 280 C 106 276, 112 268, 128 262 Z"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.5" fill="none">
    <path d="M 24 96 C 60 88, 104 86, 142 94 M 20 106 C 66 100, 118 100, 158 106"/>
    <path d="M 148 268 C 192 260, 246 258, 284 264 M 140 276 C 192 272, 250 272, 288 274"/>
  </g>

  <!-- 裂口：云被真正分开，露出高处冷光的天空（唯一叙事光源） -->
  <path d="M 96 148 L 196 118 L 232 138 L 168 216 L 118 210 Z" fill="url(#s1-gap)" opacity="0.85"/>
  <!-- 裂口边缘的云须（切开的力量感） -->
  <g stroke="#dfe8f6" stroke-width="1" opacity="0.6" fill="none">
    <path d="M 96 148 C 88 142, 84 134, 86 126"/>
    <path d="M 118 210 C 112 218, 112 226, 118 232"/>
    <path d="M 196 118 C 202 112, 210 108, 218 108"/>
    <path d="M 168 216 C 174 222, 182 224, 190 222"/>
  </g>
  <!-- 光的尘埃 -->
  <g fill="#e8eefb" opacity="0.8">
    <circle cx="150" cy="160" r="1.3"/><circle cx="168" cy="150" r="1.1"/><circle cx="138" cy="184" r="1.2"/>
    <circle cx="186" cy="140" r="1"/>
  </g>

  <!-- 一柄剑：斜贯裂口（本体是暗剪影，锋刃被裂口天光映亮——光来自天空，不来自剑） -->
  <g>
    <path d="M 258 34 L 106 236" stroke="#232c44" stroke-width="8" stroke-linecap="round"/>
    <!-- 上缘冷光棱（受裂口光） -->
    <path d="M 256 30 L 105 232" stroke="#e8eefb" stroke-width="1.6" opacity="0.95"/>
    <path d="M 261 36 L 109 238" stroke="#0c1220" stroke-width="1.2" opacity="0.8"/>
    <!-- 护手（十字） -->
    <g transform="translate(238 62) rotate(-53.5)">
      <rect x="-16" y="-2.4" width="32" height="4.8" fill="#1a2236" stroke="#c7cedd" stroke-width="1.2"/>
      <circle cx="0" cy="-7" r="1.8" fill="#9FB6D9"/>
    </g>
    <!-- 柄与尾球 -->
    <path d="M 258 34 L 272 16" stroke="#1a2236" stroke-width="5.6" stroke-linecap="round"/>
    <circle cx="274" cy="14" r="4.4" fill="#1a2236" stroke="#c7cedd" stroke-width="1.2"/>
  </g>

  <!-- 裂口之下的远云（被光照亮的一侧） -->
  <path d="M 60 216 C 92 206, 132 204, 164 212 C 150 222, 108 226, 72 222 C 58 220, 52 218, 60 216 Z"
        fill="#222c44" stroke="#aebdd6" stroke-width="0.8" opacity="0.9"/>
  <path d="M 200 240 C 226 234, 258 234, 280 240 C 262 248, 224 250, 202 246 Z"
        fill="#1c2438" stroke="#8a93ad" stroke-width="0.7" opacity="0.9"/>

  <!-- 疏星（裂口上方） -->
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="60" cy="36" r="0.9"/><circle cx="120" cy="24" r="0.8"/><circle cx="180" cy="20" r="0.9"/>
  </g>
</svg>
