<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖王后：半户外工场里，正把火从火盆引到杖尖——她管理火，火不管理她">
  <defs>
    <radialGradient id="w13-yard" cx="42%" cy="70%" r="130%">
      <stop offset="0" stop-color="#231510"/><stop offset="0.55" stop-color="#150e09"/><stop offset="1" stop-color="#0c0806"/>
    </radialGradient>
    <radialGradient id="w13-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.5"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w13-yard)"/>

  <!-- 工场棚架（半户外：椽木斜影） -->
  <g stroke="#241610" stroke-width="4.4" fill="none" stroke-linecap="round">
    <path d="M 0 74 L 130 58 M 150 56 L 300 82"/>
    <path d="M 44 74 L 40 92 M 118 64 L 114 84 M 214 68 L 218 92"/>
  </g>
  <path d="M 0 76 L 130 60 M 152 58 L 300 84" stroke="#c98a54" stroke-width="0.7" opacity="0.4" fill="none"/>
  <g fill="#c7cedd" opacity="0.3">
    <circle cx="180" cy="36" r="0.8"/><circle cx="236" cy="46" r="0.7"/><circle cx="66" cy="40" r="0.7"/>
  </g>

  <!-- 挂着的成品杖（次级：一排斜靠，说明这是她的场） -->
  <g stroke="#241509" stroke-linecap="round">
    <path d="M 262 196 L 284 122" stroke-width="4.6"/>
    <path d="M 274 198 L 292 130" stroke-width="4.2"/>
  </g>
  <path d="M 263.4 192 L 284.4 126" stroke="#c98a54" stroke-width="0.7" opacity="0.5"/>

  <!-- 唯一叙事光源：火盆（右下） -->
  <g transform="translate(206 268)">
    <circle r="26" fill="url(#w13-fire)"/>
    <path d="M -14 8 C -16 -4, -8 -14, 0 -16 C 2 -10, 6 -8, 8 -2 C 12 -6, 14 -2, 12 4 C 8 10, -8 12, -14 8 Z" fill="#d9814e" opacity="0.85"/>
    <path d="M -8 4 C -8 -4, -2 -10, 2 -10 C 4 -4, 6 0, 4 4 C 0 8, -6 8, -8 4 Z" fill="#f0b070" opacity="0.9"/>
    <path d="M -18 10 C -6 14, 8 14, 18 9" stroke="#8a5a3a" stroke-width="1.2" fill="none" opacity="0.8"/>
  </g>

  <!-- 王后（主体：站立前倾，双手持一根杖探向火盆引火；侧影朝右） -->
  <g>
    <!-- 长裙身形（侧影） -->
    <path d="M 96 318
             C 92 296, 92 270, 98 248
             C 103 230, 111 216, 122 206
             C 131 198, 141 194, 150 194
             C 154 200, 156 208, 154 216
             C 152 228, 146 240, 138 252
             C 130 266, 122 286, 118 318 Z"
          fill="#1a100c"/>
    <!-- 头（半侧影，微低看火） -->
    <path d="M 148 192 C 146 182, 152 174, 161 174 C 169 174, 174 180, 173 188 C 172 195, 165 199, 158 198 Z" fill="#1a100c"/>
    <!-- 王后冠饰：连续曲线焰冠（水平冠线，细） -->
    <path d="M 149 184 C 155 178, 165 177, 172 182 C 168 180, 158 180, 152 185" stroke="#c98a54" stroke-width="1.2" fill="none"/>
    <path d="M 158 176 C 160 172, 164 172, 166 175" stroke="#d9814e" stroke-width="1.1" fill="none" opacity="0.9"/>
    <!-- 双臂（前伸持杖） -->
    <path d="M 132 226 C 144 224, 158 220, 170 214" stroke="#1a100c" stroke-width="6.6" fill="none" stroke-linecap="round"/>
    <path d="M 136 242 C 148 240, 162 236, 174 230" stroke="#1a100c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 手中的杖（斜探向火盆上方的焰口） -->
    <path d="M 166 208 C 180 210, 192 218, 200 230" stroke="#2e1b10" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M 167 211 C 180 213, 191 220, 199 230" stroke="#c98a54" stroke-width="0.8" fill="none" opacity="0.7"/>
    <!-- 杖尖新焰（火是工具：她把它递过去） -->
    <path d="M 200 230 C 198 224, 202 218, 206 216 C 208 221, 210 225, 208 229 C 205 232, 202 232, 200 230 Z" fill="#f0b070" opacity="0.95"/>
    <path d="M 204 226 C 205 223, 206 221, 206 219" stroke="#f8d8ac" stroke-width="0.9" fill="none" opacity="0.9"/>
    <!-- 火盆光照亮的身形右缘 -->
    <g stroke="#c98a54" fill="none" opacity="0.6">
      <path d="M 152 198 C 156 206, 156 214, 153 224" stroke-width="1"/>
      <path d="M 138 252 C 132 266, 126 288, 122 310" stroke-width="0.9"/>
      <path d="M 168 210 C 178 212, 190 219, 198 228" stroke-width="0.7"/>
    </g>
    <!-- 腰封 -->
    <path d="M 100 252 C 112 256, 128 254, 140 246" stroke="#8a5a3a" stroke-width="1.6" fill="none" opacity="0.8"/>
  </g>

  <!-- 被她修剪下来的焦枝（地上，主动管理的证据） -->
  <g stroke="#241509" stroke-linecap="round">
    <path d="M 44 300 L 74 292" stroke-width="4"/>
    <path d="M 58 297 L 64 288" stroke-width="2.4"/>
  </g>
  <path d="M 46 299 L 72 292.4" stroke="#1a0e07" stroke-width="1" opacity="0.8"/>

  <!-- 地面 -->
  <path d="M 0 292 C 90 288, 200 288, 300 292 L 300 340 L 0 340 Z" fill="#0e0906"/>
  <g stroke="#241610" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 40 316 C 120 310, 220 310, 280 316"/>
  </g>
  <!-- 火光地面暖痕 -->
  <path d="M 186 310 C 198 306, 216 306, 226 310" stroke="#c98a54" stroke-width="0.9" fill="none" opacity="0.4"/>
</svg>
