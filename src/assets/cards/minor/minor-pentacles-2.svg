<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币二：浪线上抛接双环的平衡者">
  <defs>
    <radialGradient id="p2-ground" cx="46%" cy="30%" r="95%">
      <stop offset="0" stop-color="#171f12"/><stop offset="0.62" stop-color="#121810"/><stop offset="1" stop-color="#0a0e09"/>
    </radialGradient>
    <radialGradient id="p2-ring" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8b87a" stop-opacity="0.45"/><stop offset="1" stop-color="#a8b87a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-wave" width="14" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 Q 3.5 0 7 4 T 14 4" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="340" fill="url(#p2-ground)"/>

  <!-- 身后涌起的大浪（排线巨浪，与田垄同构） -->
  <g>
    <path d="M 0 190 C 40 130, 88 108, 150 118 C 214 128, 258 108, 300 140 L 300 250 L 0 250 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 0 190 C 40 130, 88 108, 150 118 C 214 128, 258 108, 300 140 L 300 250 L 0 250 Z"
          fill="url(#p2-wave)" opacity="0.6"/>
    <path d="M 40 160 C 76 126, 122 114, 168 122" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <path d="M 214 122 C 246 118, 274 126, 294 142" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.5"/>
    <path d="M 24 190 C 30 182, 40 178, 50 180" fill="none" stroke="#c7cedd" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 抛起的那枚环（叙事光源：右上空中） -->
  <g transform="translate(212 92)">
    <circle r="20" fill="url(#p2-ring)"/>
    <circle r="13" fill="#0b0f20" stroke="#a8b87a" stroke-width="2.2"/>
    <circle r="8.6" fill="none" stroke="#a8b87a" stroke-width="0.9" opacity="0.8"/>
    <path d="M 0 -5 L 1.2 -1.6 L 4.8 -0.4 L 1.2 0.8 L 0 4.4 L -1.2 0.8 L -4.8 -0.4 L -1.2 -1.6 Z" fill="#a8b87a" opacity="0.95"/>
  </g>

  <!-- 平衡者：侧面剪影站在浪线上，一手上抛一手下接 -->
  <g>
    <path d="M 128 246
             C 130 226, 134 208, 142 194
             C 148 184, 158 178, 168 178
             L 170 168 A 6.4 6.4 0 0 1 181 171
             L 177 182
             C 186 190, 190 202, 190 216
             L 188 246 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <!-- 上抛的手 -->
    <path d="M 176 186 C 186 176, 196 166, 204 154" fill="none" stroke="#c7cedd" stroke-width="1.5" opacity="0.9"/>
    <!-- 下接的手 -->
    <path d="M 138 200 C 130 208, 122 214, 112 218" fill="none" stroke="#c7cedd" stroke-width="1.5" opacity="0.9"/>
    <!-- 接住的那枚环（暗部） -->
    <g transform="translate(104 224)">
      <circle r="12" fill="#0b0f20" stroke="#8a93ad" stroke-width="1.8"/>
      <circle r="7.8" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.7"/>
    </g>
    <!-- ∞ 轨迹虚线 -->
    <path d="M 104 224 C 120 250, 160 250, 178 226 C 196 202, 206 132, 212 100"
          fill="none" stroke="#a8b87a" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 6"/>
  </g>

  <!-- 脚下的起伏垄线（浪即田） -->
  <path d="M 0 250 C 50 240, 110 236, 170 244 C 220 250, 262 246, 300 238" fill="none" stroke="#c7cedd" stroke-width="1.3" opacity="0.85"/>
  <path d="M 0 250 C 50 240, 110 236, 170 244 C 220 250, 262 246, 300 238 L 300 340 L 0 340 Z" fill="url(#p2-wave)" opacity="0.5"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45">
    <path d="M 30 274 C 70 268, 110 268, 150 274 M 170 292 C 210 286, 246 286, 280 292" fill="none"/>
  </g>
  <!-- 垄上新苗 -->
  <g stroke="#a8b87a" stroke-width="1" opacity="0.8" fill="none">
    <path d="M 66 268 C 66 262, 68 258, 72 256 M 72 268 C 74 263, 77 260, 81 259"/>
    <path d="M 236 284 C 236 278, 238 274, 242 272 M 242 284 C 244 279, 247 276, 251 275"/>
  </g>
</svg>
