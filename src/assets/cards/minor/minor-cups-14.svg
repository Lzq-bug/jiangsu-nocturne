<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="圣杯国王：站在堤岸尽头的礁上，海在他脚下翻涌，他不动——海在动，人不动">
  <defs>
    <radialGradient id="c14-night" cx="44%" cy="20%" r="140%">
      <stop offset="0" stop-color="#0f1e2a"/><stop offset="0.55" stop-color="#0b151f"/><stop offset="1" stop-color="#060d14"/>
    </radialGradient>
    <radialGradient id="c14-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7d8e8" stop-opacity="0.4"/><stop offset="1" stop-color="#c7d8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#c14-night)"/>

  <!-- 高月（中上偏右：光位独立） -->
  <g transform="translate(196 52)">
    <circle r="15" fill="url(#c14-moon)"/>
    <path d="M 4.8 -8 A 8.6 8.6 0 1 0 4.8 8 A 6.6 6.6 0 1 1 4.8 -8 Z" fill="#c7d8e8" opacity="0.9"/>
  </g>
  <g fill="#c7cedd" opacity="0.4">
    <circle cx="70" cy="40" r="0.9"/><circle cx="130" cy="30" r="0.8"/><circle cx="256" cy="76" r="0.7"/>
  </g>

  <!-- 远海 -->
  <path d="M 0 150 C 90 146, 200 146, 300 150" stroke="#8a93ad" stroke-width="0.7" opacity="0.35"/>
  <!-- 月光水路 -->
  <g stroke="#c7d8e8" fill="none">
    <path d="M 194 88 L 200 112" stroke-width="1.4" opacity="0.5"/>
    <path d="M 204 124 L 212 156" stroke-width="1.2" opacity="0.4"/>
    <path d="M 218 170 L 226 206" stroke-width="1.1" opacity="0.32"/>
  </g>

  <!-- 翻涌的海（动的环境：浪头、涌弧、碎沫） -->
  <path d="M 0 210 C 60 200, 130 202, 200 212 C 244 219, 278 228, 300 238 L 300 340 L 0 340 Z" fill="#08111a"/>
  <g stroke="#6fc2c9" fill="none">
    <path d="M 0 226 C 50 218, 110 218, 170 226 C 220 233, 266 240, 300 250" stroke-width="0.9" opacity="0.5"/>
    <path d="M 0 254 C 60 246, 130 246, 200 256" stroke-width="1" opacity="0.55"/>
    <path d="M 30 284 C 100 274, 180 274, 260 286" stroke-width="1.1" opacity="0.6"/>
    <path d="M 0 312 C 80 302, 190 302, 280 314" stroke-width="1.2" opacity="0.55"/>
  </g>
  <!-- 浪头涌弧（自左向右推） -->
  <path d="M 10 236 C 40 226, 80 226, 108 238" stroke="#8ed8de" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 130 260 C 158 250, 196 250, 222 262" stroke="#8ed8de" stroke-width="1.1" fill="none" opacity="0.55"/>
  <g stroke="#c7d8e8" stroke-width="0.7" fill="none" opacity="0.35">
    <path d="M 26 238 C 44 233, 66 233, 84 238"/>
    <path d="M 142 262 C 158 258, 178 258, 194 262"/>
  </g>

  <!-- 堤岸与礁（主体所立：画面右中的稳定石构） -->
  <g>
    <path d="M 176 190 C 190 178, 214 174, 234 182 C 252 189, 262 204, 262 222 C 262 240, 250 254, 232 260 C 208 268, 184 262, 174 246 C 166 232, 166 204, 176 190 Z"
          fill="#0d1520" stroke="#c7cedd" stroke-width="1.2"/>
    <!-- 堤石横缝 -->
    <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4" fill="none">
      <path d="M 178 216 C 200 208, 230 208, 254 218"/>
      <path d="M 176 238 C 200 232, 230 232, 256 240"/>
    </g>
    <!-- 浪打礁脚的白沫 -->
    <g stroke="#c7d8e8" stroke-width="0.9" fill="none" opacity="0.5">
      <path d="M 166 250 C 178 258, 196 262, 214 261"/>
      <path d="M 236 258 C 248 254, 258 246, 262 236"/>
    </g>
  </g>

  <!-- 国王（主体：立于礁顶，正面偏侧静立；斗篷压在身上——风大而人定） -->
  <g>
    <!-- 身形（上宽下稳，如碑） -->
    <path d="M 194 252
             C 192 234, 194 214, 200 198
             C 205 184, 213 176, 222 174
             C 231 172, 239 176, 243 184
             C 247 192, 247 202, 244 214
             C 241 228, 238 244, 237 254
             C 224 258, 208 258, 194 252 Z"
          fill="#0b1420"/>
    <!-- 头（半侧影，微扬视海平） -->
    <path d="M 218 172 C 216 163, 222 155, 231 156 C 239 157, 243 163, 242 171 C 241 178, 234 181, 227 180 Z" fill="#0b1420"/>
    <!-- 国王冠饰：潮弧城垛冠（稳定结构+潮弧细节） -->
    <path d="M 219 165 C 225 159, 235 158, 241 164" stroke="#8ed8de" stroke-width="1.3" fill="none"/>
    <path d="M 222 162 L 222 158 L 226 158 L 226 161 M 231 158 L 231 154 L 235 154 L 235 158 M 240 161 L 240 157 L 243 158" stroke="#aebdd6" stroke-width="1.1" fill="none"/>
    <!-- 杯按在身侧（很小的身份符号） -->
    <g>
      <path d="M 236 226 L 250 224 C 251 217, 248 213, 242 211 L 242 206 L 246 203 L 229 203 L 233 206 L 233 211 C 228 213, 225 217, 227 224 Z"
            fill="#0a141e" stroke="#c7cedd" stroke-width="1"/>
      <path d="M 231 216 C 233 214.6, 240 214.6, 242 216" stroke="#8ed8de" stroke-width="0.7" fill="none" opacity="0.8"/>
    </g>
    <!-- 斗篷压褶（风从海上来，向后贴） -->
    <path d="M 194 252 C 190 236, 192 216, 198 202" stroke="#0b1420" stroke-width="5" fill="none" opacity="0.9"/>
    <!-- 月光轮廓（海侧的冷缘） -->
    <g stroke="#aebdd6" fill="none" opacity="0.55">
      <path d="M 240 186 C 243 194, 243 204, 241 214" stroke-width="0.9"/>
      <path d="M 224 176 C 228 172, 233 170, 238 171" stroke-width="0.8"/>
      <path d="M 237 254 C 238 250, 239 246, 240 242" stroke-width="0.7"/>
    </g>
  </g>

  <!-- 礁脚翻涌的浪（动的海 vs 不动的人） -->
  <g stroke="#8ed8de" fill="none">
    <path d="M 160 268 C 176 274, 198 276, 218 272" stroke-width="1.2" opacity="0.65"/>
    <path d="M 240 266 C 256 262, 270 254, 278 244" stroke-width="1" opacity="0.55"/>
  </g>
</svg>
