<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑十：战后的剑之地，断倒埋横弃，地平线上只剩一线晨光——到底之处即是边界">
  <defs>
    <linearGradient id="s10-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a2c"/><stop offset="0.72" stop-color="#0f1524"/><stop offset="1" stop-color="#1a2136"/>
    </linearGradient>
    <linearGradient id="s10-dawn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe8f6" stop-opacity="0"/><stop offset="0.42" stop-color="#dfe8f6" stop-opacity="0.9"/><stop offset="0.62" stop-color="#e8eefb" stop-opacity="0.75"/><stop offset="1" stop-color="#dfe8f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s10-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8f6" stop-opacity="0.3"/><stop offset="1" stop-color="#dfe8f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s10-sky)"/>

  <!-- 将熄的星（晨光将至，星正在退场） -->
  <g fill="#c7cedd">
    <circle cx="52" cy="44" r="0.8" opacity="0.3"/><circle cx="118" cy="30" r="0.7" opacity="0.22"/><circle cx="226" cy="52" r="0.8" opacity="0.26"/>
  </g>

  <!-- 远处残云（被晨光只照亮底缘） -->
  <g fill="#181f34" stroke="#5d6884" stroke-width="0.8">
    <path d="M 20 96 C 60 86, 108 84, 148 92 C 130 102, 62 106, 24 102 C 12 100, 12 98, 20 96 Z"/>
    <path d="M 172 74 C 210 66, 254 66, 284 74 C 262 84, 208 86, 178 82 C 166 80, 164 76, 172 74 Z"/>
  </g>

  <!-- 唯一叙事光源：地平线上一线极细的晨光（到底之处，边界之外是新的天空） -->
  <rect x="30" y="233" width="240" height="2.2" fill="url(#s10-dawn)"/>
  <rect x="70" y="236" width="160" height="26" fill="url(#s10-glow)"/>
  <path d="M 0 236 C 80 234, 220 234, 300 236" stroke="#dfe8f6" stroke-width="0.8" opacity="0.55"/>

  <!-- 战后地面（荒坡碎石，承托残剑） -->
  <path d="M 0 238 C 60 236, 130 238, 200 237 C 240 236, 272 238, 300 237 L 300 340 L 0 340 Z" fill="#0c111d"/>
  <g stroke="#3a4258" stroke-width="0.7" opacity="0.5" fill="none">
    <path d="M 40 258 C 90 254, 150 254, 206 258"/>
    <path d="M 24 286 C 90 280, 170 281, 244 287"/>
    <path d="M 60 316 C 130 310, 210 311, 268 317"/>
  </g>
  <g stroke="#232b40" stroke-width="0.6" opacity="0.6" fill="none">
    <path d="M 100 268 C 130 266, 158 266, 184 268"/>
    <path d="M 70 300 C 110 297, 158 297, 196 300"/>
  </g>
  <!-- 碎石 -->
  <g fill="#1c2438">
    <ellipse cx="88" cy="272" rx="3.4" ry="1.8"/><ellipse cx="212" cy="266" rx="2.8" ry="1.6"/>
    <ellipse cx="52" cy="304" rx="3" ry="1.7"/><ellipse cx="248" cy="298" rx="3.2" ry="1.8"/>
    <ellipse cx="160" cy="322" rx="3.6" ry="1.9"/>
  </g>

  <!-- 十件剑之遗骸：断 / 倒 / 埋 / 横 / 弃（无人物，战场自己说话） -->
  <g stroke-linecap="round">
    <!-- 1. 倒伏的完整剑（前景横陈，刃口受晨光） -->
    <g>
      <path d="M 44 300 L 148 292" stroke="#1e2740" stroke-width="5.4"/>
      <path d="M 46 298 L 146 290.4" stroke="#dfe8f6" stroke-width="1" opacity="0.7"/>
      <path d="M 148 292 L 168 289" stroke="#1e2740" stroke-width="3"/>
      <g transform="translate(172 288.6) rotate(-3.4)">
        <rect x="-9" y="-2" width="18" height="4" fill="#242e4a" stroke="#8a93ad" stroke-width="0.8"/>
        <path d="M 0 2 L 0 10" stroke="#242e4a" stroke-width="3"/>
        <circle cx="0" cy="11.6" r="2.4" fill="#242e4a" stroke="#8a93ad" stroke-width="0.8"/>
      </g>
      <!-- 拖出的浅痕 -->
      <path d="M 60 306 C 90 303, 120 301, 146 300" stroke="#2c344c" stroke-width="0.9" fill="none" opacity="0.8"/>
    </g>
    <!-- 2. 断剑：半截刃斜插 -->
    <g>
      <path d="M 196 250 L 216 288" stroke="#232c44" stroke-width="5"/>
      <path d="M 197.4 251 L 217 285" stroke="#aebdd6" stroke-width="0.9" opacity="0.6"/>
      <path d="M 194 246 L 199 252" stroke="#8a93ad" stroke-width="1.4" opacity="0.9"/>
      <ellipse cx="219" cy="292" rx="5.5" ry="1.6" fill="#161d30"/>
    </g>
    <!-- 3. 断剑：仅剩护手与一寸刃（弃） -->
    <g>
      <path d="M 118 262 L 124 274" stroke="#232c44" stroke-width="4.2"/>
      <g transform="translate(116 259) rotate(-13)">
        <rect x="-8" y="-1.8" width="16" height="3.6" fill="#242e4a" stroke="#8a93ad" stroke-width="0.8"/>
        <path d="M 0 1.8 L 0 8.4" stroke="#232c44" stroke-width="2.6"/>
      </g>
    </g>
    <!-- 4. 埋入土中的剑（只露剑柄与一小段刃，指向晨光） -->
    <g>
      <path d="M 236 228 L 232 248" stroke="#20283f" stroke-width="4.6"/>
      <path d="M 235.4 228 L 231.6 245" stroke="#dfe8f6" stroke-width="0.9" opacity="0.65"/>
      <g transform="translate(238 224) rotate(9)">
        <rect x="-8.6" y="-1.9" width="17.2" height="3.8" fill="#242e4a" stroke="#8a93ad" stroke-width="0.9"/>
        <path d="M 0 1.9 L 0 9.6" stroke="#20283f" stroke-width="3"/>
        <circle cx="0" cy="11.2" r="2.6" fill="#20283f" stroke="#8a93ad" stroke-width="0.9"/>
      </g>
      <path d="M 230 250 C 234 254, 240 254, 244 250" stroke="#2c344c" stroke-width="1" fill="none" opacity="0.9"/>
    </g>
    <!-- 5. 横放的断刃（半截，刃尖折断） -->
    <g>
      <path d="M 178 316 L 236 310" stroke="#1e2740" stroke-width="4.6"/>
      <path d="M 180 314.6 L 232 309.2" stroke="#aebdd6" stroke-width="0.8" opacity="0.55"/>
      <path d="M 236 310 L 243 312" stroke="#1e2740" stroke-width="2.6"/>
    </g>
    <!-- 6. 深埋的断柄（只剩尾球露出） -->
    <g>
      <circle cx="72" cy="252" r="3" fill="#20283f" stroke="#8a93ad" stroke-width="0.9"/>
      <path d="M 72 249 C 71 246, 72 244, 74 243" stroke="#20283f" stroke-width="2.6" fill="none"/>
      <path d="M 66 254 C 70 255, 76 255, 80 253" stroke="#2c344c" stroke-width="0.9" fill="none" opacity="0.9"/>
    </g>
    <!-- 7. 斜靠的完整剑（插在土里，微倾，像随时会倒） -->
    <g>
      <path d="M 96 226 L 108 268" stroke="#232c44" stroke-width="4.6"/>
      <path d="M 97.4 226.6 L 109 265" stroke="#dfe8f6" stroke-width="0.8" opacity="0.5"/>
      <path d="M 96 226 L 92 218" stroke="#232c44" stroke-width="2.8"/>
      <g transform="translate(90 216) rotate(-77)">
        <rect x="-7.6" y="-1.8" width="15.2" height="3.6" fill="#242e4a" stroke="#8a93ad" stroke-width="0.8"/>
      </g>
      <path d="M 104 270 C 108 272, 114 272, 118 270" stroke="#2c344c" stroke-width="0.9" fill="none" opacity="0.8"/>
    </g>
    <!-- 8. 折断的剑尖（遥遥落在别处） -->
    <g>
      <path d="M 262 282 L 276 292" stroke="#1e2740" stroke-width="3.6"/>
      <path d="M 263 281.4 L 275.4 290.8" stroke="#aebdd6" stroke-width="0.7" opacity="0.5"/>
    </g>
    <!-- 9. 只露一寸刃的浅埋剑 -->
    <path d="M 148 244 L 152 258" stroke="#20283f" stroke-width="4"/>
    <path d="M 149.2 244 L 153 256" stroke="#aebdd6" stroke-width="0.7" opacity="0.5"/>
    <!-- 10. 倒扣的护手（最后一件遗骸） -->
    <g transform="translate(30 268) rotate(14)">
      <rect x="-7" y="-1.6" width="14" height="3.2" fill="#242e4a" stroke="#8a93ad" stroke-width="0.8"/>
    </g>
  </g>

  <!-- 晨光落在最近一柄倒剑的刃口上（光只属于结束，不属于任何胜者） -->
  <path d="M 62 297 L 120 292.6" stroke="#e8eefb" stroke-width="1" opacity="0.8"/>
</svg>
