<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="星币八：雕环匠的工作台，八枚环璧自粗坯到成品，铜屑与刻尺之间">
  <defs>
    <radialGradient id="p8-ground" cx="58%" cy="30%" r="112%">
      <stop offset="0" stop-color="#171d11"/><stop offset="0.6" stop-color="#11160c"/><stop offset="1" stop-color="#090c06"/>
    </radialGradient>
    <radialGradient id="p8-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c687" stop-opacity="0.42"/><stop offset="1" stop-color="#e6c687" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#p8-ground)"/>

  <!-- 背墙挂具：锤与两把凿（工坊语境，次级） -->
  <g stroke="#8a93ad" stroke-width="1.2" opacity="0.8">
    <path d="M 196 44 L 196 84 M 188 44 L 204 44" />
    <path d="M 188 40 L 204 40 L 200 52 L 192 52 Z" fill="#141a10" />
    <path d="M 224 40 L 224 88" />
    <path d="M 220 40 L 228 40 L 227 56 L 221 56 Z" fill="#141a10"/>
    <path d="M 244 48 L 250 88" />
  </g>
  <path d="M 180 34 L 268 34" stroke="#8a93ad" stroke-width="1" opacity="0.6"/>

  <!-- 工作台（特写：近景大台面） -->
  <g>
    <path d="M 0 168 L 300 160 L 300 186 L 0 194 Z" fill="#1a2113" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 0 175 L 300 167" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4">
      <path d="M 26 182 L 92 181 M 130 179 L 198 178 M 230 176 L 284 175"/>
    </g>
    <path d="M 0 194 L 300 186 L 300 200 L 0 208 Z" fill="#11160c" stroke="#8a93ad" stroke-width="0.9" opacity="0.95"/>
  </g>

  <!-- 八枚环璧：粗坯 → 半成 → 成品（工序横向展开，高低错落） -->
  <g>
    <!-- 1 毛坯石饼（边角未修） -->
    <g transform="translate(38 152)">
      <path d="M -14 -3 C -15 -10, -8 -14, -1 -14 C 8 -14, 14 -9, 14 -2 C 14 6, 7 11, -2 11 C -9 11, -13 4, -14 -3 Z"
            fill="#232a1a" stroke="#8f9c6e" stroke-width="1.6"/>
      <path d="M -8 -6 L -4 -2 M 5 -8 L 8 -4" stroke="#6d7590" stroke-width="0.7" opacity="0.7"/>
    </g>
    <!-- 2 修边的坯（外廓渐圆） -->
    <g transform="translate(76 148)">
      <circle r="13.6" fill="#202718" stroke="#97a476" stroke-width="1.8"/>
      <path d="M -9 -8 C -3 -12, 5 -12, 10 -7" stroke="#6d7590" stroke-width="0.7" fill="none" opacity="0.7"/>
    </g>
    <!-- 3 环孔初钻（中心小孔） -->
    <g transform="translate(114 146)">
      <circle r="13.8" fill="#1f2617" stroke="#9aa878" stroke-width="1.9"/>
      <circle r="3.4" fill="#0c0f08" stroke="#9aa878" stroke-width="1"/>
    </g>
    <!-- 4 孔扩中（内廓未光） -->
    <g transform="translate(152 148)">
      <circle r="14" fill="#1f2617" stroke="#9fae7c" stroke-width="2"/>
      <circle r="6.4" fill="#0c0f08" stroke="#9fae7c" stroke-width="1.1"/>
      <path d="M 6 -3 L 10 -6" stroke="#6d7590" stroke-width="0.8"/>
    </g>
    <!-- 5 半成品（内圆已成，留刀痕） -->
    <g transform="translate(190 144)">
      <circle r="14.2" fill="#1f2617" stroke="#a4b380" stroke-width="2.1"/>
      <circle r="8" fill="none" stroke="#a4b380" stroke-width="1.3"/>
      <g stroke="#6d7590" stroke-width="0.6" opacity="0.75">
        <path d="M -12 -7 L -9 -10 M -5 -13 L -3 -16 M 4 -13 L 6 -16"/>
      </g>
    </g>
    <!-- 6 近成（纹路刻起） -->
    <g transform="translate(228 150)">
      <circle r="14.4" fill="#1f2617" stroke="#a8b87a" stroke-width="2.2"/>
      <circle r="8.4" fill="none" stroke="#a8b87a" stroke-width="1.4"/>
      <circle r="1.8" fill="#a8b87a" opacity="0.9"/>
      <path d="M -11 -8 C -4 -12, 5 -12, 11 -7" stroke="#7d8f63" stroke-width="0.9" fill="none"/>
    </g>
    <!-- 7 成品（环璧纹完整，搁在托架上） -->
    <g transform="translate(262 158)">
      <circle r="14.6" fill="#1f2617" stroke="#b1c184" stroke-width="2.4"/>
      <circle r="8.6" fill="none" stroke="#b1c184" stroke-width="1.5"/>
      <circle r="2" fill="#b1c184"/>
      <path d="M -12 -8 C -5 -13, 6 -13, 12 -6 M -12 8 C -5 12, 6 12, 12 6" stroke="#7d8f63" stroke-width="1" fill="none"/>
      <path d="M -10 16 L 10 16" stroke="#8a93ad" stroke-width="1.6"/>
    </g>
    <!-- 8 完成品立起（靠在灯旁，受光而亮） -->
    <g transform="translate(284 186)">
      <circle r="13.4" fill="#242c1a" stroke="#c6d494" stroke-width="2.5"/>
      <circle r="7.8" fill="none" stroke="#c6d494" stroke-width="1.6"/>
      <circle r="1.9" fill="#c6d494"/>
      <path d="M -11 -7 C -4 -12, 5 -12, 11 -6" stroke="#8fa06c" stroke-width="1" fill="none"/>
    </g>
  </g>

  <!-- 台上的工具与工序痕迹 -->
  <g>
    <!-- 平凿 -->
    <g transform="translate(96 176) rotate(-8)">
      <rect x="-22" y="-2" width="34" height="4" fill="#2a2f1a" stroke="#8a93ad" stroke-width="0.9"/>
      <path d="M 12 -2 L 20 0 L 12 2 Z" fill="#8a93ad"/>
    </g>
    <!-- 小锤 -->
    <g transform="translate(160 182) rotate(14)">
      <rect x="-14" y="-1.4" width="26" height="2.8" fill="#2a2f1a" stroke="#8a93ad" stroke-width="0.9"/>
      <rect x="8" y="-6" width="9" height="12" fill="#141a10" stroke="#8a93ad" stroke-width="1"/>
    </g>
    <!-- 黄铜卡尺 -->
    <g transform="translate(214 190) rotate(-3)">
      <path d="M -26 0 L 22 0 L 22 3 L -26 3 Z" fill="#1f2413" stroke="#b28c4f" stroke-width="1"/>
      <path d="M -26 0 L -26 -6 L -20 -6 L -20 0" fill="none" stroke="#b28c4f" stroke-width="1"/>
      <path d="M 12 0 L 12 -4" stroke="#b28c4f" stroke-width="0.8"/>
      <path d="M 2 0 L 2 -4" stroke="#b28c4f" stroke-width="0.8"/>
    </g>
    <!-- 铜屑石粉堆 -->
    <g fill="#a8b87a" opacity="0.55">
      <circle cx="134" cy="170" r="1.1"/><circle cx="140" cy="174" r="0.9"/><circle cx="128" cy="176" r="0.8"/>
      <circle cx="62" cy="180" r="1"/><circle cx="70" cy="184" r="0.8"/>
    </g>
    <path d="M 120 186 C 128 182, 140 182, 148 186" stroke="#8a93ad" stroke-width="0.7" fill="none" opacity="0.6"/>
    <!-- 手稿页（工序图） -->
    <g transform="translate(58 228) rotate(-2)">
      <rect x="-26" y="-14" width="52" height="28" fill="#161c2a" stroke="#a9b1c7" stroke-width="1"/>
      <circle cx="-8" cy="-2" r="7" fill="none" stroke="#a9b1c7" stroke-width="0.9"/>
      <circle cx="-8" cy="-2" r="3.6" fill="none" stroke="#8a93ad" stroke-width="0.7"/>
      <g stroke="#8a93ad" stroke-width="0.7" opacity="0.8">
        <path d="M 8 -8 L 20 -8 M 8 -2 L 18 -2 M 8 4 L 20 4"/>
      </g>
    </g>
  </g>

  <!-- 台端小灯（唯一叙事光源：照着最后一环） -->
  <g transform="translate(268 232)">
    <circle r="24" fill="url(#p8-lamp)"/>
    <path d="M -5 8 C -5 4, 5 4, 5 8 L 4 13 L -4 13 Z" fill="#12180e" stroke="#8a93ad" stroke-width="1"/>
    <path d="M 0 3 C 2.2 0, 1.4 -4, 0 -6 C -1.4 -4, -2.2 0, 0 3 Z" fill="#e6c687"/>
  </g>

  <!-- 台下暗影地面 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 40 300 L 120 300 M 180 312 L 256 312"/>
  </g>
</svg>
