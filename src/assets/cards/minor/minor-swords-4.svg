<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="宝剑四：石棺上的静息">
  <defs>
    <radialGradient id="s4-ground" cx="50%" cy="30%" r="92%">
      <stop offset="0" stop-color="#191f2c"/><stop offset="0.6" stop-color="#131824"/><stop offset="1" stop-color="#0b0e17"/>
    </radialGradient>
    <radialGradient id="s4-candle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6c687" stop-opacity="0.45"/><stop offset="1" stop-color="#e6c687" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#s4-ground)"/>

  <!-- 后壁龛（叙事光源：龛内一点烛光） -->
  <g>
    <path d="M 108 128 L 108 60 C 108 34, 126 20, 150 20 C 174 20, 192 34, 192 60 L 192 128 Z"
          fill="#0d1120" stroke="#8a93ad" stroke-width="1.4"/>
    <g transform="translate(150 104)">
      <circle r="26" fill="url(#s4-candle)"/>
      <path d="M -3.4 -6 L 3.4 -6 L 2.6 8 L -2.6 8 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
      <path d="M 0 -10 C 3 -6, 2.6 -2, 0 0 C -2.6 -2, -3 -6, 0 -10 Z" fill="#e6c687"/>
      <circle cx="0" cy="11" r="4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
    </g>
  </g>

  <!-- 跪影合掌（次级，背对观者） -->
  <g>
    <path d="M 128 262 C 128 244, 136 232, 150 228 C 164 232, 172 244, 172 262 L 172 288 L 128 288 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 138 228 C 138 216, 142 208, 150 204 C 158 208, 162 216, 162 226" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
    <!-- 合掌 -->
    <path d="M 146 214 L 150 202 L 154 214 L 150 220 Z" fill="#0b0f20" stroke="#e6c687" stroke-width="1.1"/>
    <g stroke="#8a93ad" stroke-width="0.6" opacity="0.5" fill="none">
      <path d="M 136 244 C 134 258, 134 274, 136 286"/>
      <path d="M 164 244 C 166 258, 166 274, 164 286"/>
    </g>
  </g>

  <!-- 石棺（主体）：明度拉开，顶缘强光 -->
  <g>
    <path d="M 44 296 L 44 268 C 44 258, 52 252, 64 252 L 236 252 C 248 252, 256 258, 256 268 L 256 296 Z"
          fill="#1a2338" stroke="#e9edf5" stroke-width="1.6"/>
    <path d="M 44 268 C 52 262, 64 258, 78 258 L 222 258 C 236 258, 248 262, 256 268"
          fill="none" stroke="#e9edf5" stroke-width="1.4" opacity="0.9"/>
    <path d="M 52 296 L 48 320 L 252 320 L 248 296 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    <!-- 棺面刻纹（简化为两线一徽） -->
    <path d="M 74 282 L 226 282" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    <circle cx="150" cy="283" r="5" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
    <circle cx="150" cy="283" r="1.6" fill="#e6c687" opacity="0.9"/>
    <!-- 平放之剑：横陈棺上，剑尖朝右（重心锚点） -->
    <g transform="translate(150 242)">
      <path d="M -96 0 L 88 -3 L 100 0 L 88 3 Z" fill="#0b0f20" stroke="#e9edf5" stroke-width="1.4"/>
      <path d="M -96 0 L 88 -1" stroke="#8a93ad" stroke-width="0.6" opacity="0.7"/>
      <rect x="-116" y="-4" width="20" height="7" rx="2.5" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <rect x="-100" y="-3" width="4" height="6" fill="#0b0f20" stroke="#c7cedd" stroke-width="0.9"/>
      <circle cx="-120" cy="0" r="3.8" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <circle cx="-120" cy="0" r="1.2" fill="#e6c687" opacity="0.9"/>
    </g>
  </g>

  <!-- 地面排线 -->
  <path d="M 0 320 L 300 320" stroke="#8a93ad" stroke-width="0.8" opacity="0.5"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 36 332 L 120 332 M 180 332 L 266 332"/>
  </g>
</svg>
