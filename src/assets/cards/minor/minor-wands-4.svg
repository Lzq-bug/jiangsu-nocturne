<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="权杖四：营地门架与归来旅者">
  <defs>
    <radialGradient id="w4-ground" cx="50%" cy="30%" r="95%">
      <stop offset="0" stop-color="#231a10"/><stop offset="0.6" stop-color="#1a140b"/><stop offset="1" stop-color="#100b06"/>
    </radialGradient>
    <radialGradient id="w4-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9814e" stop-opacity="0.42"/><stop offset="1" stop-color="#d9814e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="340" fill="url(#w4-ground)"/>

  <!-- 四杖门架：两对斜杖相搭（主体） -->
  <g>
    <!-- 左对 -->
    <path d="M 78 300 L 128 132 L 136 135 L 90 302 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.7"/>
    <path d="M 108 300 L 140 140 L 148 142 L 120 301 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.7"/>
    <!-- 右对 -->
    <path d="M 222 300 L 172 132 L 164 135 L 210 302 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.7"/>
    <path d="M 192 300 L 160 140 L 152 142 L 180 301 Z" fill="#14100c" stroke="#c7cedd" stroke-width="1.7"/>
    <!-- 顶端扎束（小结，非飘带） -->
    <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3">
      <path d="M 118 128 C 128 122, 142 122, 152 128 C 142 134, 128 134, 118 128 Z"/>
      <path d="M 122 124 L 112 112 M 148 124 L 158 112" stroke-width="1.1"/>
    </g>
    <!-- 花穗环带（植物束，横向连成顶棚线） -->
    <g fill="none" stroke="#c7cedd" stroke-width="1.1" opacity="0.9">
      <path d="M 124 136 C 136 130, 148 130, 158 136"/>
    </g>
    <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1">
      <circle cx="128" cy="134" r="3.2"/><circle cx="141" cy="131" r="3.2"/><circle cx="154" cy="134" r="3.2"/>
    </g>
    <!-- 火星连成顶棚（叙事光源：上中） -->
    <g fill="#d9814e">
      <circle cx="112" cy="112" r="1.8" opacity="0.95"/>
      <circle cx="128" cy="100" r="1.4" opacity="0.8"/>
      <circle cx="146" cy="98" r="1.6" opacity="0.9"/>
      <circle cx="164" cy="104" r="1.3" opacity="0.75"/>
      <circle cx="178" cy="114" r="1.7" opacity="0.9"/>
    </g>
    <ellipse cx="140" cy="112" rx="46" ry="18" fill="url(#w4-spark)"/>
    <g stroke="#d9814e" stroke-width="0.7" opacity="0.55">
      <line x1="120" y1="92" x2="122" y2="86"/><line x1="152" y1="88" x2="154" y2="82"/>
      <line x1="172" y1="98" x2="176" y2="93"/>
    </g>
  </g>

  <!-- 门内石台与两只小杯（阶段性完成的小庆典） -->
  <g>
    <path d="M 116 300 L 184 300 L 190 316 L 110 316 Z" fill="#0d1226" stroke="#8a93ad" stroke-width="1.1"/>
    <g transform="translate(136 288)">
      <path d="M -8 -8 L 8 -8 C 8 -1, 4 3, 0 3 C -4 3, -8 -1, -8 -8 Z" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -3 5 L 3 5" stroke="#c7cedd" stroke-width="1"/>
    </g>
    <g transform="translate(164 288)">
      <path d="M -8 -8 L 8 -8 C 8 -1, 4 3, 0 3 C -4 3, -8 -1, -8 -8 Z" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -3 5 L 3 5" stroke="#c7cedd" stroke-width="1"/>
    </g>
  </g>

  <!-- 归来的旅者（右下，提灯走近） -->
  <g>
    <path d="M 246 300
             C 248 282, 252 268, 260 258
             C 265 252, 272 250, 278 252
             L 280 244 A 6.6 6.6 0 0 1 292 247
             L 288 258
             C 294 266, 296 278, 294 290
             L 296 300 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 252 268 L 242 286" stroke="#c7cedd" stroke-width="1.3"/>
    <g transform="translate(240 292)">
      <circle r="9" fill="url(#w4-spark)" opacity="0.8"/>
      <path d="M -3.4 -4 L 3.4 -4 L 2.6 6 L -2.6 6 Z" fill="#0b0f20" stroke="#d9814e" stroke-width="1"/>
      <path d="M 0 -7 C 2 -4, 1.6 -1, 0 0 C -1.6 -1, -2 -4, 0 -7 Z" fill="#d9814e"/>
    </g>
    <!-- 行囊 -->
    <path d="M 268 268 C 274 264, 280 264, 284 268 C 282 274, 274 276, 268 272 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
  </g>

  <!-- 地面草与路 -->
  <path d="M 0 316 L 300 316" stroke="#8a93ad" stroke-width="0.8" opacity="0.55"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45" fill="none">
    <path d="M 24 328 C 70 322, 120 322, 166 328 M 196 330 C 234 326, 264 326, 290 330"/>
    <path d="M 44 300 C 44 294, 47 290, 51 288 M 254 296 C 254 290, 257 286, 261 284"/>
  </g>
</svg>
