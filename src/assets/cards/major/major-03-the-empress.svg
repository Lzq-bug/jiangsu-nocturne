<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="女皇：拱门内的丰饶漩涡">
  <defs>
    <radialGradient id="em-ground" cx="50%" cy="36%" r="90%">
      <stop offset="0" stop-color="#1f1730"/><stop offset="0.62" stop-color="#171128"/><stop offset="1" stop-color="#0e0a18"/>
    </radialGradient>
    <radialGradient id="em-gate" cx="50%" cy="58%" r="62%">
      <stop offset="0" stop-color="#d98a9c" stop-opacity="0.3"/><stop offset="1" stop-color="#d98a9c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="em-wheat" width="14" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M 4 20 C 3 12, 5 6, 4 0 M 10 20 C 9 13, 11 7, 10 1" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#em-ground)"/>

  <!-- 墙面（拱门之外） -->
  <rect width="300" height="420" fill="url(#em-wheat)" opacity="0.25"/>
  <g stroke="#8a93ad" stroke-width="0.7" opacity="0.5" fill="none">
    <path d="M 20 60 C 44 48, 76 48, 98 60" />
    <path d="M 206 84 C 230 72, 260 74, 280 86" />
  </g>

  <!-- 拱门 -->
  <g>
    <path d="M 58 396 L 58 172 C 58 96, 108 52, 150 52 C 192 52, 242 96, 242 172 L 242 396 Z"
          fill="#100a1c" stroke="#c7cedd" stroke-width="2"/>
    <path d="M 70 396 L 70 176 C 70 106, 114 64, 150 64 C 186 64, 230 106, 230 176 L 230 396"
          fill="none" stroke="#8a93ad" stroke-width="0.8" opacity="0.6"/>
    <!-- 门内丰饶光 -->
    <path d="M 70 396 L 70 176 C 70 106, 114 64, 150 64 C 186 64, 230 106, 230 176 L 230 396 Z"
          fill="url(#em-gate)"/>
  </g>

  <!-- 门内的麦浪蔷薇漩涡 -->
  <g clip-path="none">
    <g fill="none" stroke="#c7cedd" stroke-width="1.1" opacity="0.9">
      <path d="M 150 396 C 118 372, 100 340, 104 304 C 108 272, 130 252, 150 250"/>
      <path d="M 150 396 C 182 372, 200 340, 196 304 C 192 272, 170 252, 150 250"/>
      <path d="M 150 372 C 128 354, 118 330, 122 306"/>
      <path d="M 150 372 C 172 354, 182 330, 178 306"/>
    </g>
    <!-- 麦穗排（旋涡内圈） -->
    <g stroke="#8a93ad" stroke-width="0.8" opacity="0.8" fill="none">
      <path d="M 150 250 C 146 232, 148 216, 154 202"/>
      <path d="M 150 250 C 154 232, 152 216, 146 202"/>
      <path d="M 128 262 C 118 248, 114 232, 118 218"/>
      <path d="M 172 262 C 182 248, 186 232, 182 218"/>
    </g>
    <!-- 蔷薇头（漩涡外圈） -->
    <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2">
      <circle cx="112" cy="292" r="7.5"/><circle cx="188" cy="292" r="7.5"/>
      <circle cx="122" cy="336" r="6.5"/><circle cx="178" cy="336" r="6.5"/>
    </g>
    <g fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.8">
      <path d="M 107 290 A 5 5 0 0 1 114 287 M 116 293 A 5.2 5.2 0 0 1 112 297"/>
      <path d="M 183 290 A 5 5 0 0 1 190 287 M 192 293 A 5.2 5.2 0 0 1 188 297"/>
    </g>
    <g fill="#d98a9c" opacity="0.9">
      <circle cx="112" cy="292" r="1.6"/><circle cx="188" cy="292" r="1.6"/>
    </g>
    <!-- 漩涡中心的星冠（次级象征） -->
    <g transform="translate(150 196)">
      <path d="M -22 -4 L -14 -14 L -5 -8 L 0 -20 L 5 -8 L 14 -14 L 22 -4 L 14 2 L -14 2 Z" fill="none" stroke="#e9edf5" stroke-width="1.4"/>
      <circle cx="0" cy="-9" r="2" fill="#d98a9c" opacity="0.95"/>
    </g>
  </g>

  <!-- 门楣上的手（自上垂落，仅手与小臂） -->
  <g>
    <path d="M 244 0 C 240 26, 232 48, 218 64 C 210 72, 200 74, 192 70 C 186 66, 186 58, 192 54 C 202 46, 210 32, 214 12 L 216 0 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 192 70 C 186 74, 180 74, 176 70 C 174 66, 176 62, 180 60" fill="none" stroke="#c7cedd" stroke-width="1.3"/>
    <!-- 搭在门楣上 -->
    <path d="M 180 60 C 186 52, 196 48, 206 48" fill="none" stroke="#c7cedd" stroke-width="1.3" opacity="0.9"/>
  </g>

  <!-- 门前落瓣 -->
  <g fill="none" stroke="#d98a9c" opacity="0.55" stroke-width="0.8">
    <path d="M 84 388 C 87 385, 91 385, 93 388 C 90 391, 86 391, 84 388 Z"/>
    <path d="M 208 392 C 211 389, 215 389, 217 392 C 214 395, 210 395, 208 392 Z"/>
  </g>
</svg>
