<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="倒吊人：水中倒置的世界">
  <defs>
    <radialGradient id="hg-ground" cx="50%" cy="18%" r="100%">
      <stop offset="0" stop-color="#1a2233"/><stop offset="0.5" stop-color="#141b2b"/><stop offset="1" stop-color="#0d1320"/>
    </radialGradient>
    <linearGradient id="hg-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223050" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0f1c" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="hg-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9edf5" stop-opacity="0.4"/><stop offset="1" stop-color="#e9edf5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#hg-ground)"/>

  <!-- 上半：岸上世界（正常视角） -->
  <!-- 弯垂的树枝自上而入 -->
  <g>
    <path d="M 0 44 C 60 40, 130 48, 186 66 C 204 72, 216 80, 222 88" fill="none" stroke="#c7cedd" stroke-width="2"/>
    <path d="M 130 50 C 138 44, 150 42, 158 44" fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.7"/>
    <path d="M 222 88 L 226 96" stroke="#c7cedd" stroke-width="1.4"/>
    <!-- 一枚落叶悬在枝头（将落未落） -->
    <path d="M 230 100 C 226 104, 226 110, 230 114 C 234 110, 234 104, 230 100 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
  </g>
  <!-- 岸边石与草 -->
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2">
    <path d="M 20 176 C 26 164, 44 160, 54 168 C 60 176, 54 188, 40 190 C 30 190, 22 184, 20 176 Z"/>
  </g>
  <g stroke="#c7cedd" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 40 174 C 46 170, 62 168, 78 170 M 96 174 C 108 172, 122 174, 134 178"/>
  </g>

  <!-- 水面（中带分界） -->
  <path d="M 0 200 L 300 200" stroke="#e9edf5" stroke-width="1" opacity="0.5"/>
  <rect x="0" y="200" width="300" height="220" fill="url(#hg-water)"/>
  <!-- 月（空中）与水中月（唯一光源，自上而下的反射） -->
  <g transform="translate(246 84)">
    <circle r="26" fill="url(#hg-moon)"/>
    <circle r="9" fill="#e9edf5" opacity="0.95"/>
  </g>
  <g stroke="#c7cedd" stroke-width="0.7" opacity="0.6">
    <line x1="243" y1="98" x2="241" y2="132"/><line x1="249" y1="98" x2="251" y2="128"/>
  </g>

  <!-- 下半：水中的倒置世界（原创转化：人物以"倒影"倒挂，实体从未出现） -->
  <g>
    <!-- 水中横枝的倒影（上枝的镜像） -->
    <path d="M 0 350 C 60 354, 130 346, 186 330 C 202 325, 214 318, 220 311" fill="none" stroke="#8a93ad" stroke-width="1.6" opacity="0.75"/>
    <!-- 倒挂人影：脚在上（近水面），头垂向深处 -->
    <g transform="translate(196 300) rotate(180)">
      <path d="M -14 0
               C -14 -10, -8 -18, 0 -18
               C 8 -18, 14 -10, 14 0
               C 14 8, 10 14, 4 16
               L 4 22 C 4 30, -2 36, -8 36
               L -20 36 C -24 36, -26 32, -24 28
               L -14 24 C -14 16, -14 8, -14 0 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.4"/>
      <path d="M -14 6 L -26 2" fill="none" stroke="#c7cedd" stroke-width="1.2"/>
      <path d="M 4 22 C 10 20, 16 20, 20 22" fill="none" stroke="#8a93ad" stroke-width="0.8" opacity="0.7"/>
    </g>
    <!-- 水波纹（环绕倒影） -->
    <g stroke="#8a93ad" stroke-width="0.7" opacity="0.6" fill="none">
      <path d="M 150 316 C 170 312, 210 312, 232 316"/>
      <path d="M 142 334 C 168 330, 214 330, 240 334"/>
      <path d="M 130 356 C 160 352, 216 352, 248 356"/>
    </g>
    <!-- 水中气泡与下沉的叶 -->
    <g fill="#8a93ad" opacity="0.6">
      <circle cx="172" cy="322" r="1.4"/><circle cx="228" cy="330" r="1.2"/><circle cx="212" cy="368" r="1.4"/>
    </g>
    <path d="M 186 388 C 182 392, 182 398, 186 402 C 190 398, 190 392, 186 388 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9"/>
  </g>

  <!-- 水面微光（月反射连到倒影，视觉动线垂直贯穿） -->
  <path d="M 226 200 L 218 300" stroke="#e9edf5" stroke-width="0.8" opacity="0.35"/>
</svg>
