<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="世界：黄铜星盘上的世界图谱与桂冠">
  <defs>
    <radialGradient id="wld-ground" cx="50%" cy="34%" r="88%">
      <stop offset="0" stop-color="#1c2140"/><stop offset="0.62" stop-color="#141936"/><stop offset="1" stop-color="#0c1026"/>
    </radialGradient>
    <radialGradient id="wld-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9d9a8" stop-opacity="0.22"/><stop offset="1" stop-color="#e9d9a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wld-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#8a93ad" stroke-width="0.4" opacity="0.3"/>
    </pattern>
    <pattern id="wld-sea" width="10" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 Q 2.5 0 5 3 T 10 3" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#wld-ground)"/>
  <rect width="300" height="420" fill="url(#wld-grid)"/>

  <!-- 四角刻度与四元素小徽记 -->
  <g stroke="#8a93ad" stroke-width="0.8" opacity="0.7" fill="none">
    <path d="M 18 30 L 18 18 L 30 18 M 282 30 L 282 18 L 270 18 M 18 390 L 18 402 L 30 402 M 282 390 L 282 402 L 270 402"/>
  </g>
  <g fill="none" stroke="#8a93ad" stroke-width="1">
    <g transform="translate(34 52)"><circle r="9"/><path d="M -3 4 L -3 -2 C -3 -5, 3 -5, 3 -2 L 3 4 M -5 6 L 5 6"/></g>
    <g transform="translate(266 52)"><circle r="9"/><path d="M 0 -5 C 3 -1, 3 3, 0 5 C -3 3, -3 -1, 0 -5 Z"/></g>
    <g transform="translate(34 368)"><circle r="9"/><path d="M -4 5 L 4 -5 M -2 -5 L 2 -5 M -4 -2 L 0 -2"/></g>
    <g transform="translate(266 368)"><circle r="9"/><circle r="4.2"/></g>
  </g>

  <!-- 烛照纸面的暖光（叙事光源：档案室的灯，不是天体） -->
  <ellipse cx="150" cy="204" rx="132" ry="150" fill="url(#wld-lamp)"/>

  <!-- 黄铜子午环（仪器的框架，哑光无辉光） -->
  <g fill="none" stroke="#b28c4f">
    <ellipse cx="150" cy="204" rx="108" ry="128" stroke-width="2.2" opacity="0.85"/>
    <ellipse cx="150" cy="204" rx="82" ry="128" stroke-width="1.2" opacity="0.6" transform="rotate(24 150 204)"/>
    <ellipse cx="150" cy="204" rx="128" ry="112" stroke-width="1" opacity="0.4"/>
  </g>
  <g stroke="#b28c4f" stroke-width="1" opacity="0.75">
    <line x1="150" y1="72" x2="150" y2="76"/><line x1="150" y1="332" x2="150" y2="336"/>
    <circle cx="150" cy="70" r="3.4" fill="#0c1026"/>
    <circle cx="150" cy="338" r="3.4" fill="#0c1026"/>
  </g>

  <!-- 世界图谱盘：纸上测绘的世界 -->
  <g>
    <circle cx="150" cy="204" r="86" fill="#101733" stroke="#c7cedd" stroke-width="1.8"/>
    <circle cx="150" cy="204" r="86" fill="url(#wld-sea)" opacity="0.5"/>
    <!-- 经纬 -->
    <g fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.6">
      <ellipse cx="150" cy="204" rx="86" ry="30"/>
      <ellipse cx="150" cy="204" rx="86" ry="62"/>
      <ellipse cx="150" cy="204" rx="30" ry="86"/>
      <ellipse cx="150" cy="204" rx="62" ry="86"/>
      <line x1="64" y1="204" x2="236" y2="204"/>
    </g>
    <!-- 抽象大陆线稿 -->
    <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
      <path d="M 108 168 C 118 158, 136 156, 146 162 C 154 168, 150 178, 140 182 C 128 188, 114 186, 108 178 C 104 174, 104 172, 108 168 Z"/>
      <path d="M 168 150 C 180 144, 196 148, 202 158 C 206 166, 200 174, 188 174 C 176 174, 166 168, 164 160 C 163 156, 164 152, 168 150 Z"/>
      <path d="M 176 208 C 188 204, 200 210, 202 220 C 204 230, 196 240, 184 240 C 174 240, 168 232, 170 222 C 171 216, 172 211, 176 208 Z"/>
      <path d="M 116 224 C 126 218, 138 220, 142 228 C 146 236, 140 246, 128 246 C 118 246, 112 240, 112 232 C 112 228, 113 226, 116 224 Z"/>
      <path d="M 148 244 C 156 242, 162 246, 162 252 C 160 258, 152 260, 146 256 C 143 252, 144 246, 148 244 Z"/>
    </g>
    <!-- 盘心舞者：完成之姿 -->
    <g transform="translate(150 200)">
      <circle cx="0" cy="-16" r="5" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 0 -11 C 4 -6, 5 0, 2 6 L 8 16 L 4 18 L -2 8 L -8 16 L -12 14 L -4 4 C -6 -2, -4 -7, 0 -11 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -3 -6 C -10 -10, -14 -16, -14 -22 M 3 -6 C 10 -10, 14 -16, 14 -22" fill="none" stroke="#c7cedd" stroke-width="1.4"/>
    </g>
  </g>

  <!-- 桂冠：自底向上合抱，顶上系一小结 -->
  <g fill="none" stroke="#c7cedd" stroke-width="1.7">
    <path d="M 84 366 C 62 330, 56 280, 72 232 C 80 208, 94 190, 110 178"/>
    <path d="M 216 366 C 238 330, 244 280, 228 232 C 220 208, 206 190, 190 178"/>
  </g>
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
    <path d="M 70 344 C 58 340, 52 332, 52 322 C 64 324, 71 332, 70 344 Z"/>
    <path d="M 65 310 C 53 304, 48 294, 50 284 C 61 288, 67 297, 65 310 Z"/>
    <path d="M 66 274 C 55 266, 52 256, 56 246 C 66 252, 70 262, 66 274 Z"/>
    <path d="M 74 240 C 66 230, 66 220, 72 212 C 80 220, 80 231, 74 240 Z"/>
    <path d="M 88 210 C 82 199, 84 189, 92 182 C 98 192, 95 203, 88 210 Z"/>
    <path d="M 230 344 C 242 340, 248 332, 248 322 C 236 324, 229 332, 230 344 Z"/>
    <path d="M 235 310 C 247 304, 252 294, 250 284 C 239 288, 233 297, 235 310 Z"/>
    <path d="M 234 274 C 245 266, 248 256, 244 246 C 234 252, 230 262, 234 274 Z"/>
    <path d="M 226 240 C 234 230, 234 220, 228 212 C 220 220, 220 231, 226 240 Z"/>
    <path d="M 212 210 C 218 199, 216 189, 208 182 C 202 192, 205 203, 212 210 Z"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.6">
    <line x1="70" y1="344" x2="56" y2="330"/><line x1="65" y1="310" x2="52" y2="292"/>
    <line x1="66" y1="274" x2="56" y2="252"/><line x1="74" y1="240" x2="70" y2="218"/>
    <line x1="230" y1="344" x2="244" y2="330"/><line x1="235" y1="310" x2="248" y2="292"/>
    <line x1="234" y1="274" x2="244" y2="252"/><line x1="226" y1="240" x2="230" y2="218"/>
  </g>
  <!-- 顶部小结（非垂挂横幅） -->
  <g transform="translate(150 172)">
    <path d="M -10 -4 C -4 -8, 4 -8, 10 -4 C 4 0, -4 0, -10 -4 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
    <circle cx="0" cy="-2" r="1.6" fill="#e9d9a8"/>
  </g>
</svg>
