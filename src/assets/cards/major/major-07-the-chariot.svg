<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="战车：静止的极速">
  <defs>
    <radialGradient id="ch-ground" cx="50%" cy="34%" r="92%">
      <stop offset="0" stop-color="#151a2e"/><stop offset="0.62" stop-color="#101430"/><stop offset="1" stop-color="#0a0d20"/>
    </radialGradient>
    <radialGradient id="ch-crown" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b9c4de" stop-opacity="0.4"/><stop offset="1" stop-color="#b9c4de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#ch-ground)"/>

  <!-- 后掠星流（速度感：细短划排线，非光轨） -->
  <g stroke="#8a93ad" stroke-width="0.8" opacity="0.55" stroke-linecap="round">
    <line x1="60" y1="86" x2="96" y2="86"/><line x1="36" y1="120" x2="84" y2="120"/>
    <line x1="52" y1="156" x2="110" y2="156"/><line x1="28" y1="192" x2="92" y2="192"/>
    <line x1="44" y1="228" x2="104" y2="228"/>
    <line x1="244" y1="100" x2="282" y2="100"/><line x1="232" y1="140" x2="286" y2="140"/>
    <line x1="240" y1="180" x2="288" y2="180"/>
  </g>
  <g stroke="#c7cedd" stroke-width="0.9" opacity="0.6" stroke-linecap="round">
    <line x1="72" y1="103" x2="108" y2="103"/><line x1="56" y1="175" x2="98" y2="175"/>
    <line x1="252" y1="120" x2="290" y2="120"/><line x1="248" y1="160" x2="284" y2="160"/>
  </g>

  <!-- 星冠（叙事光源：车顶唯一冷银亮部） -->
  <g transform="translate(150 150)">
    <circle r="30" fill="url(#ch-crown)"/>
    <path d="M -30 8 L -20 -6 L -8 2 L 0 -14 L 8 2 L 20 -6 L 30 8" fill="none" stroke="#e9edf5" stroke-width="1.8"/>
    <circle cx="0" cy="-16" r="2.6" fill="#b9c4de"/>
    <path d="M -30 8 L 30 8" stroke="#8a93ad" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- 战车：正面原地伫立 -->
  <g>
    <!-- 车体 -->
    <path d="M 96 300 L 104 216 L 196 216 L 204 300 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.8"/>
    <path d="M 104 216 L 96 300" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <!-- 车前星徽 -->
    <path d="M 150 238 L 154 250 L 166 254 L 154 258 L 150 270 L 146 258 L 134 254 L 146 250 Z"
          fill="none" stroke="#b9c4de" stroke-width="1.2"/>
    <!-- 双轮 -->
    <circle cx="96" cy="300" r="26" fill="none" stroke="#c7cedd" stroke-width="2"/>
    <circle cx="204" cy="300" r="26" fill="none" stroke="#c7cedd" stroke-width="2"/>
    <g stroke="#8a93ad" stroke-width="0.8" opacity="0.8">
      <path d="M 96 274 L 96 326 M 70 300 L 122 300 M 78 282 L 114 318 M 114 282 L 78 318"/>
      <path d="M 204 274 L 204 326 M 178 300 L 230 300 M 186 282 L 222 318 M 222 282 L 186 318"/>
    </g>
    <circle cx="96" cy="300" r="4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
    <circle cx="204" cy="300" r="4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
  </g>

  <!-- 黑白双兽：缰绳分牵画面两上角（兽身出画，只余颈首） -->
  <g>
    <!-- 白兽（左） -->
    <path d="M 112 216 C 104 200, 92 188, 76 180 C 66 175, 58 176, 54 182 C 50 188, 54 196, 62 198 C 56 204, 58 214, 68 216 C 80 218, 96 218, 112 216 Z"
          fill="#e9edf5" stroke="#0a0814" stroke-width="1.4" paint-order="stroke"/>
    <circle cx="60" cy="186" r="1.4" fill="#0b0f20"/>
    <!-- 黑兽（右） -->
    <path d="M 188 216 C 196 200, 208 188, 224 180 C 234 175, 242 176, 246 182 C 250 188, 246 196, 238 198 C 244 204, 242 214, 232 216 C 220 218, 204 218, 188 216 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.6"/>
    <circle cx="240" cy="186" r="1.4" fill="#c7cedd"/>
    <!-- 交叉缰绳：从车前分向两角 -->
    <path d="M 128 214 C 112 208, 92 198, 70 190" fill="none" stroke="#8a93ad" stroke-width="0.9" opacity="0.8"/>
    <path d="M 172 214 C 188 208, 208 198, 230 190" fill="none" stroke="#8a93ad" stroke-width="0.9" opacity="0.8"/>
    <path d="M 128 214 C 140 206, 160 206, 172 214" fill="none" stroke="#8a93ad" stroke-width="0.9" opacity="0.8"/>
  </g>

  <!-- 城门剪影（遥远的出发地） -->
  <g fill="#0b0f20" stroke="#8a93ad" stroke-width="0.8" opacity="0.8">
    <path d="M 20 380 L 20 344 L 34 344 L 34 330 C 34 322, 42 318, 50 318 C 58 318, 66 322, 66 330 L 66 344 L 80 344 L 80 380 Z"/>
  </g>
  <path d="M 0 380 L 300 380" stroke="#8a93ad" stroke-width="0.8" opacity="0.55"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="392" x2="150" y2="392"/><line x1="170" y1="400" x2="230" y2="400"/>
  </g>
</svg>
