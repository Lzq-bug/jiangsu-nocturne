<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="力量：合掌即驯服">
  <defs>
    <radialGradient id="st-ground" cx="50%" cy="32%" r="92%">
      <stop offset="0" stop-color="#221a10"/><stop offset="0.6" stop-color="#191309"/><stop offset="1" stop-color="#0f0b05"/>
    </radialGradient>
    <radialGradient id="st-palm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d99c5b" stop-opacity="0.45"/><stop offset="1" stop-color="#d99c5b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="st-mane" width="10" height="12" patternUnits="userSpaceOnUse">
      <path d="M 2 0 C 6 4, 6 8, 2 12 M 7 0 C 11 4, 11 8, 7 12" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#st-ground)"/>

  <!-- 环形花环（无限符藏于其中，次级） -->
  <g fill="none" stroke="#c7cedd" stroke-width="1.2" opacity="0.85">
    <ellipse cx="150" cy="238" rx="92" ry="86"/>
    <ellipse cx="150" cy="238" rx="92" ry="86" stroke="#8a93ad" stroke-width="0.6" opacity="0.5" stroke-dasharray="1 7"/>
  </g>
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1">
    <path d="M 66 210 C 58 200, 58 188, 66 180 C 74 188, 74 202, 66 210 Z"/>
    <path d="M 234 210 C 242 200, 242 188, 234 180 C 226 188, 226 202, 234 210 Z"/>
    <path d="M 62 258 C 54 250, 53 238, 60 230 C 69 237, 70 250, 62 258 Z"/>
    <path d="M 238 258 C 246 250, 247 238, 240 230 C 231 237, 230 250, 238 258 Z"/>
  </g>
  <!-- 藏在花环里的无限符 -->
  <path d="M 128 316 C 120 306, 104 306, 104 316 C 104 326, 120 326, 128 316 C 136 306, 152 306, 152 316 C 152 326, 136 326, 128 316 Z"
        fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.7"/>

  <!-- 巨狮：右侧坐姿侧影（面朝左），鬃毛如缓缓合拢的门帘 -->
  <g>
    <path d="M 236 300
             C 240 268, 236 236, 220 214
             C 206 196, 186 186, 166 186
             C 158 178, 146 178, 140 186
             C 132 180, 122 182, 118 190
             C 112 200, 116 212, 124 218
             C 116 232, 112 250, 114 268
             C 116 284, 124 296, 138 300 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.7"/>
    <!-- 鬃毛波弧（外圈） -->
    <g fill="none" stroke="#c7cedd" stroke-width="1.1" opacity="0.9">
      <path d="M 196 200 C 206 190, 218 186, 230 190 C 226 202, 214 210, 202 210"/>
      <path d="M 214 232 C 226 226, 238 228, 246 236 C 238 246, 224 248, 214 242"/>
      <path d="M 220 268 C 232 266, 242 272, 246 282 C 236 288, 222 286, 214 278"/>
    </g>
    <path d="M 220 214 C 236 220, 244 236, 242 254 C 240 272, 230 288, 216 296 L 236 300 C 248 290, 254 268, 250 246 C 246 226, 236 210, 220 214"
          fill="url(#st-mane)" opacity="0.5"/>
    <!-- 狮首侧影（朝左，无凶相） -->
    <path d="M 140 186 C 130 176, 128 162, 136 152 C 146 142, 162 142, 170 152 C 176 160, 176 172, 170 180 C 176 184, 180 190, 180 196 L 148 200 C 144 196, 141 191, 140 186 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 148 162 C 154 158, 162 158, 166 163" fill="none" stroke="#e9edf5" stroke-width="1.6"/>
    <circle cx="150" cy="168" r="2.2" fill="#e9edf5"/>
    <path d="M 140 178 C 136 178, 133 180, 132 183" fill="none" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 168 172 C 172 174, 175 177, 176 181" fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- 少女侧影（左）：伸手抚狮额 -->
  <g>
    <path d="M 96 300
             C 94 274, 96 250, 104 232
             C 110 220, 120 212, 132 210
             L 134 200 A 7.4 7.4 0 0 1 147 202
             L 144 214
             C 154 220, 160 230, 162 242
             L 164 300 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <!-- 伸出的手 -->
    <path d="M 148 226 C 158 218, 168 210, 176 202" fill="none" stroke="#c7cedd" stroke-width="1.6" opacity="0.95"/>
    <path d="M 176 202 C 180 199, 184 198, 187 199" fill="none" stroke="#e9edf5" stroke-width="1.8"/>
    <!-- 长发垂背 -->
    <path d="M 128 212 C 122 226, 118 244, 118 262" fill="none" stroke="#c7cedd" stroke-width="1.1" opacity="0.8"/>
  </g>

  <!-- 合掌落点：狮额上的暖光（叙事光源，居中） -->
  <g transform="translate(182 196)">
    <circle r="26" fill="url(#st-palm)"/>
    <circle cx="0" cy="0" r="3" fill="#d99c5b" opacity="0.95"/>
  </g>
</svg>
