<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 412" role="img" aria-label="恋人：共根双生的蔷薇">
  <defs>
    <radialGradient id="lov-ground" cx="50%" cy="36%" r="85%">
      <stop offset="0" stop-color="#1c1c38"/><stop offset="0.62" stop-color="#141530"/><stop offset="1" stop-color="#0c0f24"/>
    </radialGradient>
    <radialGradient id="lov-heart" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4526a" stop-opacity="0.5"/><stop offset="1" stop-color="#c4526a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lov-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(52)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a93ad" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#lov-ground)"/>

  <!-- 两条独立的星轨：各自升起，顶端各悬一星，彼此接近而不相交 -->
  <g stroke="#8a93ad" fill="none" opacity="0.6">
    <path d="M 118 348 C 112 268, 112 190, 122 116" stroke-width="0.9" stroke-dasharray="1 6"/>
    <path d="M 182 348 C 188 268, 188 190, 178 116" stroke-width="0.9" stroke-dasharray="1 6"/>
  </g>
  <g fill="#c7cedd">
    <path d="M 122 104 L 124.4 111.6 L 132 114 L 124.4 116.4 L 122 124 L 119.6 116.4 L 112 114 L 119.6 111.6 Z" opacity="0.9"/>
    <path d="M 178 104 L 180.4 111.6 L 188 114 L 180.4 116.4 L 178 124 L 175.6 116.4 L 168 114 L 175.6 111.6 Z" opacity="0.9"/>
  </g>
  <g fill="#c7cedd" opacity="0.6">
    <circle cx="96" cy="86" r="1.2"/><circle cx="204" cy="80" r="1.2"/><circle cx="150" cy="52" r="1"/><circle cx="66" cy="140" r="1"/>
  </g>

  <!-- 共根：地表之下的根系如手稿解剖图 -->
  <path d="M 0 356 L 300 356" stroke="#8a93ad" stroke-width="0.9" opacity="0.55"/>
  <g fill="url(#lov-hatch)" opacity="0.55">
    <path d="M 0 356 L 300 356 L 300 420 L 0 420 Z"/>
  </g>
  <g stroke="#c7cedd" fill="none" stroke-width="1.3" opacity="0.9">
    <path d="M 150 356 C 148 366, 140 372, 128 378 C 116 384, 104 384, 94 392"/>
    <path d="M 150 356 C 152 366, 160 372, 172 378 C 184 384, 196 384, 206 392"/>
    <path d="M 150 356 C 150 370, 148 384, 152 398"/>
    <path d="M 128 378 C 120 382, 116 388, 112 396" stroke-width="0.9" opacity="0.7"/>
    <path d="M 172 378 C 180 382, 184 388, 188 396" stroke-width="0.9" opacity="0.7"/>
  </g>

  <!-- 双生茎干：两条 S 形各自向上 -->
  <g stroke="#c7cedd" fill="none">
    <path d="M 142 356 C 128 316, 122 274, 128 232 C 133 198, 128 162, 116 132" stroke-width="2.2"/>
    <path d="M 158 356 C 172 316, 178 274, 172 232 C 167 198, 172 162, 184 132" stroke-width="2.2"/>
  </g>
  <!-- 茎上小刺 -->
  <g stroke="#c7cedd" stroke-width="0.9" opacity="0.75">
    <path d="M 126 300 L 118 294"/><path d="M 124 260 L 116 256"/><path d="M 128 214 L 120 210"/>
    <path d="M 174 300 L 182 294"/><path d="M 176 260 L 184 256"/><path d="M 172 214 L 180 210"/>
  </g>
  <!-- 对生叶片 -->
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2">
    <path d="M 130 322 C 116 318, 106 308, 104 296 C 118 296, 128 306, 130 322 Z"/>
    <path d="M 170 322 C 184 318, 194 308, 196 296 C 182 296, 172 306, 170 322 Z"/>
    <path d="M 126 258 C 112 254, 104 244, 102 232 C 116 233, 125 243, 126 258 Z"/>
    <path d="M 174 258 C 188 254, 196 244, 198 232 C 184 233, 175 243, 174 258 Z"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.6" fill="none">
    <path d="M 126 318 L 108 300"/><path d="M 174 318 L 192 300"/>
    <path d="M 122 254 L 106 238"/><path d="M 178 254 L 194 238"/>
  </g>

  <!-- 两朵蔷薇：相向倾斜，尚未触碰 -->
  <g transform="translate(112 118) rotate(-14)">
    <circle cx="-10" cy="-2" r="14" fill="url(#lov-heart)" opacity="0.5"/>
    <circle r="15" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <g fill="none" stroke="#c7cedd" stroke-width="1">
      <path d="M -9 -4 A 10 10 0 0 1 8 -7"/>
      <path d="M 8 -7 A 10.5 10.5 0 0 1 11 4"/>
      <path d="M 11 4 A 11 11 0 0 1 -2 12"/>
      <path d="M -2 12 A 11.5 11.5 0 0 1 -12 3"/>
      <path d="M -5 -4 A 6.5 6.5 0 0 1 4 -3 A 6.8 6.8 0 0 1 5 5 A 7 7 0 0 1 -3 8"/>
      <path d="M -2 -1 A 3 3 0 0 1 2 1 A 3.1 3.1 0 0 1 -1 4"/>
    </g>
    <circle cx="0" cy="1.6" r="1.7" fill="#c4526a" opacity="0.95"/>
  </g>
  <g transform="translate(188 118) rotate(14)">
    <circle cx="10" cy="-2" r="14" fill="url(#lov-heart)" opacity="0.5"/>
    <circle r="15" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <g fill="none" stroke="#c7cedd" stroke-width="1">
      <path d="M 9 -4 A 10 10 0 0 0 -8 -7"/>
      <path d="M -8 -7 A 10.5 10.5 0 0 0 -11 4"/>
      <path d="M -11 4 A 11 11 0 0 0 2 12"/>
      <path d="M 2 12 A 11.5 11.5 0 0 0 12 3"/>
      <path d="M 5 -4 A 6.5 6.5 0 0 0 -4 -3 A 6.8 6.8 0 0 0 -5 5 A 7 7 0 0 0 3 8"/>
      <path d="M 2 -1 A 3 3 0 0 0 -2 1 A 3.1 3.1 0 0 0 1 4"/>
    </g>
    <circle cx="0" cy="1.6" r="1.7" fill="#c4526a" opacity="0.95"/>
  </g>

  <!-- 两花之间的光隙（叙事光源）：接近而未触 -->
  <circle cx="150" cy="112" r="17" fill="url(#lov-heart)" opacity="0.85"/>
  <path d="M 150 118 L 151.6 123 L 156.6 124.6 L 151.6 126.2 L 150 131.2 L 148.4 126.2 L 143.4 124.6 L 148.4 123 Z"
        fill="#c4526a" opacity="0.9" transform="translate(0 -8)"/>

  <!-- 根部的两枚环：相扣而不重叠 -->
  <g fill="none" stroke="#c7cedd" stroke-width="1.5">
    <circle cx="138" cy="344" r="7.5"/>
    <circle cx="152" cy="344" r="7.5" stroke="#c4526a" stroke-opacity="0.85"/>
  </g>
</svg>
