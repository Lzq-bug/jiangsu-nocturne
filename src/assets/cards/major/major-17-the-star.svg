<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="星星：夜航水岸与导航之星">
  <defs>
    <radialGradient id="star-ground" cx="60%" cy="22%" r="100%">
      <stop offset="0" stop-color="#121c2c"/><stop offset="0.55" stop-color="#0e1624"/><stop offset="1" stop-color="#08101a"/>
    </radialGradient>
    <radialGradient id="star-main" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5e1e8" stop-opacity="0.5"/><stop offset="1" stop-color="#a5e1e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#star-ground)"/>

  <!-- 真实夜空：小星疏落（无星云无舞台） -->
  <g fill="#c7cedd" opacity="0.6">
    <circle cx="42" cy="60" r="1"/><circle cx="96" cy="44" r="0.9"/><circle cx="150" cy="70" r="1"/>
    <circle cx="196" cy="50" r="0.9"/><circle cx="270" cy="80" r="1"/><circle cx="120" cy="110" r="0.8"/>
  </g>

  <!-- 主要导航星：低垂于水线之上，灯塔式（唯一亮部） -->
  <g transform="translate(232 132)">
    <circle r="30" fill="url(#star-main)"/>
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#a5e1e8"/>
    <g stroke="#a5e1e8" stroke-width="0.8" opacity="0.6">
      <line x1="0" y1="-18" x2="0" y2="-24"/><line x1="0" y1="18" x2="0" y2="24"/>
      <line x1="-18" y1="0" x2="-24" y2="0"/><line x1="18" y1="0" x2="24" y2="0"/>
    </g>
  </g>

  <!-- 远处海岸塔灯（呼应"灯塔式星光"） -->
  <g transform="translate(58 160)">
    <path d="M -4 24 L -2 -6 L 2 -6 L 4 24 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9"/>
    <path d="M -2.4 -6 L 2.4 -6 L 1.2 -11 L -1.2 -11 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.8"/>
    <circle cx="0" cy="-8.4" r="1.5" fill="#a5e1e8" opacity="0.9"/>
  </g>

  <!-- 水线 -->
  <path d="M 0 216 L 300 216" stroke="#8a93ad" stroke-width="0.9" opacity="0.6"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 24 232 L 96 232 M 140 244 L 220 244 M 60 258 L 150 258"/>
  </g>

  <!-- 水面的星光反射（垂直光弦，细碎） -->
  <g stroke="#a5e1e8" stroke-width="1" opacity="0.7">
    <line x1="230" y1="224" x2="229" y2="268"/>
    <line x1="224" y1="228" x2="223" y2="252"/><line x1="236" y1="228" x2="237" y2="256"/>
  </g>
  <g fill="#a5e1e8" opacity="0.6">
    <circle cx="229" cy="278" r="1.3"/><circle cx="222" cy="296" r="1.1"/><circle cx="237" cy="310" r="1.1"/>
  </g>

  <!-- 水岸人物：蹲姿，伸手在水面描摹星图（次级主体） -->
  <g>
    <path d="M 96 328
             C 94 306, 98 288, 110 278
             C 120 270, 134 268, 144 274
             L 146 264 A 7.4 7.4 0 0 1 159 267
             L 155 280
             C 162 290, 164 302, 160 314
             L 162 328 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.5"/>
    <!-- 伸向水面的手 -->
    <path d="M 148 292 C 160 296, 172 296, 182 292" fill="none" stroke="#c7cedd" stroke-width="1.5" opacity="0.95"/>
    <circle cx="188" cy="291" r="1.8" fill="#a5e1e8" opacity="0.9"/>
    <!-- 手边一张摊开的星图（纸面坐标，次级象征） -->
    <g transform="translate(158 316) rotate(-5)">
      <path d="M -22 -6 C -10 -10, 12 -10, 24 -6 C 12 -2, -10 -2, -22 -6 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="1"/>
      <g stroke="#8a93ad" stroke-width="0.5" opacity="0.7" fill="none">
        <path d="M -14 -6 L -4 -9 L 4 -7 L 14 -9"/>
      </g>
      <g fill="#a5e1e8" opacity="0.8">
        <circle cx="-4" cy="-8" r="0.9"/><circle cx="4" cy="-7" r="0.9"/>
      </g>
    </g>
  </g>

  <!-- 水岸石与苇 -->
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
    <path d="M 34 336 C 40 326, 54 322, 64 328 C 60 338, 46 342, 34 336 Z"/>
  </g>
  <g stroke="#c7cedd" stroke-width="0.8" opacity="0.65" fill="none">
    <path d="M 30 340 C 30 332, 32 326, 36 322 M 262 340 C 262 334, 264 328, 268 324"/>
  </g>
</svg>
