<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="太阳：高窗晨光斜落，银壶反光，植物向光，晒褪的桌纸">
  <defs>
    <linearGradient id="sun-room" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1c2140"/><stop offset="0.55" stop-color="#121730"/><stop offset="1" stop-color="#0b0f22"/>
    </linearGradient>
    <linearGradient id="sun-beam" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#f0d48a" stop-opacity="0.32"/><stop offset="0.6" stop-color="#f0d48a" stop-opacity="0.12"/><stop offset="1" stop-color="#f0d48a" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="sun-glint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0d48a" stop-opacity="0.55"/><stop offset="1" stop-color="#f0d48a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#sun-room)"/>

  <!-- 墙上旧画摘去后的未褪矩形（阳光长年作用之证） -->
  <rect x="196" y="52" width="74" height="92" fill="#ffffff" opacity="0.035"/>
  <circle cx="233" cy="46" r="1.4" fill="#8a93ad" opacity="0.7"/>

  <!-- 高百叶窗（叙事光源所在：太阳不出场，光从窗来） -->
  <g>
    <rect x="26" y="34" width="76" height="92" fill="#0a0e1e" stroke="#c7cedd" stroke-width="1.6"/>
    <rect x="33" y="41" width="62" height="78" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <!-- 叶片板：缝隙里透出晨光（全牌最亮处之一） -->
    <g>
      <rect x="36" y="46" width="56" height="7" fill="#f0d48a" opacity="0.75"/>
      <rect x="36" y="62" width="56" height="7" fill="#f0d48a" opacity="0.6"/>
      <rect x="36" y="78" width="56" height="7" fill="#f0d48a" opacity="0.5"/>
      <rect x="36" y="94" width="56" height="7" fill="#f0d48a" opacity="0.4"/>
      <g fill="#1a2036">
        <rect x="36" y="53" width="56" height="9"/><rect x="36" y="69" width="56" height="9"/>
        <rect x="36" y="85" width="56" height="9"/><rect x="36" y="101" width="56" height="12"/>
      </g>
    </g>
  </g>

  <!-- 晨光光带：自百叶窗斜贯而下（构图主动线：强对角） -->
  <path d="M 36 118 L 96 118 L 246 306 L 156 306 Z" fill="url(#sun-beam)"/>
  <!-- 叶片在光带上的三道影（证明光经过了百叶） -->
  <g fill="#0b0f22" opacity="0.5">
    <path d="M 52 148 L 74 148 L 66 162 L 45 162 Z"/>
    <path d="M 84 188 L 102 188 L 96 200 L 78 200 Z"/>
  </g>
  <!-- 光带中的浮尘（少量，非漂浮宇宙） -->
  <g fill="#f0d48a" opacity="0.55">
    <circle cx="92" cy="170" r="1.2"/><circle cx="120" cy="204" r="1"/><circle cx="142" cy="238" r="1.2"/>
    <circle cx="104" cy="232" r="0.9"/><circle cx="164" cy="266" r="1"/>
  </g>

  <!-- 桌面（重心所在：中下） -->
  <g>
    <path d="M 30 306 L 300 306 L 300 318 L 30 318 Z" fill="#171226" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 30 318 L 300 318" stroke="#8a93ad" stroke-width="0.8" opacity="0.5"/>
    <!-- 光落在桌面上的亮池 -->
    <path d="M 168 306 L 246 306 L 226 316 L 158 316 Z" fill="#f0d48a" opacity="0.16"/>
  </g>

  <!-- 晒褪的地图/星图（阳光的后果：曝晒处纸色变淡） -->
  <g transform="translate(196 332) rotate(-4)">
    <rect x="-44" y="-13" width="88" height="26" fill="#232a44" stroke="#8a93ad" stroke-width="1"/>
    <rect x="2" y="-13" width="42" height="26" fill="#3a4060" opacity="0.55"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.6" fill="none">
      <path d="M -34 -4 C -20 -8, -2 -2, 12 -6 M -34 4 C -18 1, 4 6, 20 2 M -30 9 L 8 7"/>
    </g>
    <circle cx="-12" cy="-3" r="1" fill="#8a93ad"/><circle cx="6" cy="3" r="1" fill="#8a93ad"/>
  </g>

  <!-- 向光植物：盆栽自阴影折向光带（次级主体） -->
  <g>
    <path d="M 74 306 L 112 306 L 106 278 L 80 278 Z" fill="#101426" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 77 278 L 109 278" stroke="#8a93ad" stroke-width="0.8" opacity="0.7"/>
    <!-- 折向光的主茎 -->
    <path d="M 93 278 C 92 258, 86 240, 70 224" fill="none" stroke="#9aa886" stroke-width="1.8"/>
    <path d="M 91 262 C 100 254, 106 252, 114 252" fill="none" stroke="#9aa886" stroke-width="1.2"/>
    <!-- 朝光的叶（受光面亮） -->
    <g fill="#1a2436" stroke="#c7cedd" stroke-width="1.1">
      <path d="M 70 224 C 58 218, 50 208, 50 196 C 62 200, 70 210, 72 222 Z"/>
      <path d="M 68 226 C 74 214, 84 206, 96 204 C 92 216, 82 224, 70 228 Z" fill="#2a3450"/>
    </g>
    <path d="M 52 200 C 58 204, 64 210, 68 218" fill="none" stroke="#f0d48a" stroke-width="0.8" opacity="0.6"/>
    <path d="M 92 208 C 88 214, 84 220, 74 226" fill="none" stroke="#f0d48a" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- 旧银壶：壶口一点星芒反光（光被"拿到手里"的象征物，key symbol） -->
  <g>
    <path d="M 186 306 C 184 288, 190 274, 202 268 L 202 260 L 214 260 L 214 268 C 228 272, 236 286, 234 306 Z"
          fill="#0e1226" stroke="#c7cedd" stroke-width="1.5"/>
    <path d="M 202 268 C 210 272, 218 274, 226 278" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.7"/>
    <!-- 壶流 -->
    <path d="M 214 266 C 222 262, 228 256, 230 248 L 234 252 C 232 260, 226 268, 216 272 Z" fill="#0e1226" stroke="#c7cedd" stroke-width="1.2"/>
    <!-- 受光的星芒高光（唯一亮部核心） -->
    <circle cx="206" cy="272" r="16" fill="url(#sun-glint)"/>
    <path d="M 206 264 L 208 270 L 214 272 L 208 274 L 206 280 L 204 274 L 198 272 L 204 270 Z" fill="#f0d48a"/>
    <circle cx="206" cy="272" r="1.4" fill="#fff7e0"/>
  </g>

  <!-- 墙脚与地纹 -->
  <path d="M 0 356 L 300 356" stroke="#8a93ad" stroke-width="0.7" opacity="0.4"/>
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 34 372 L 108 372 M 150 386 L 240 386 M 60 400 L 150 400"/>
  </g>
</svg>
