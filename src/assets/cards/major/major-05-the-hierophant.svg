<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="教皇：三重冠下只有钥匙没有脸">
  <defs>
    <radialGradient id="hi-ground" cx="50%" cy="26%" r="92%">
      <stop offset="0" stop-color="#221c12"/><stop offset="0.6" stop-color="#181409"/><stop offset="1" stop-color="#0e0b05"/>
    </radialGradient>
    <radialGradient id="hi-crown" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#c9a25c" stop-opacity="0.34"/><stop offset="1" stop-color="#c9a25c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hi-curt" width="10" height="16" patternUnits="userSpaceOnUse">
      <path d="M 3 0 C 1 5, 5 11, 3 16 M 8 0 C 6 5, 10 11, 8 16" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#hi-ground)"/>

  <!-- 祭坛高窗暗拱 -->
  <path d="M 40 420 L 40 150 C 40 78, 92 36, 150 36 C 208 36, 260 78, 260 150 L 260 420"
        fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.5"/>

  <!-- 三重冠（悬空，主体） -->
  <g transform="translate(150 118)">
    <circle r="52" fill="url(#hi-crown)"/>
    <path d="M -34 22 C -34 4, -26 -6, -18 -10 L -18 -22 C -10 -30, -4 -34, 0 -34 C 4 -34, 10 -30, 18 -22 L 18 -10 C 26 -6, 34 4, 34 22 Z"
          fill="#0b0f20" stroke="#c9a25c" stroke-width="1.8"/>
    <path d="M -26 6 L 26 6 M -22 -6 L 22 -6" stroke="#c9a25c" stroke-width="1" opacity="0.85"/>
    <circle cx="0" cy="-40" r="3" fill="#c9a25c"/>
    <path d="M -3 -34 L 0 -37 L 3 -34" fill="none" stroke="#c9a25c" stroke-width="1.1"/>
    <circle cx="-22" cy="0" r="1.6" fill="#e9edf5" opacity="0.8"/>
    <circle cx="22" cy="0" r="1.6" fill="#e9edf5" opacity="0.8"/>
  </g>

  <!-- 垂幕：冠下只余织物，无脸 -->
  <g>
    <path d="M 96 158 C 100 210, 100 260, 92 306 L 208 306 C 200 260, 200 210, 204 158 C 186 150, 114 150, 96 158 Z"
          fill="#0e0b18" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 96 158 C 100 210, 100 260, 92 306 L 208 306 C 200 260, 200 210, 204 158 C 186 150, 114 150, 96 158 Z"
          fill="url(#hi-curt)" opacity="0.7"/>
    <path d="M 128 158 C 126 210, 126 258, 124 304 M 172 158 C 174 210, 174 258, 176 304"
          stroke="#8a93ad" stroke-width="0.7" opacity="0.55" fill="none"/>
  </g>

  <!-- 十字交叉双钥匙（垂幕前） -->
  <g transform="translate(150 244)">
    <g transform="rotate(28)">
      <path d="M 0 -44 L 0 30" stroke="#c7cedd" stroke-width="2.2"/>
      <circle cx="0" cy="-52" r="9" fill="none" stroke="#c7cedd" stroke-width="1.8"/>
      <path d="M -5 24 L 5 24 M -4 32 L 4 32" stroke="#c7cedd" stroke-width="1.6"/>
    </g>
    <g transform="rotate(-28)">
      <path d="M 0 -44 L 0 30" stroke="#c9a25c" stroke-width="2.2"/>
      <circle cx="0" cy="-52" r="9" fill="none" stroke="#c9a25c" stroke-width="1.8"/>
      <path d="M -5 24 L 5 24 M -4 32 L 4 32" stroke="#c9a25c" stroke-width="1.6"/>
    </g>
  </g>

  <!-- 阶下两跪影（背影剪影） -->
  <g>
    <path d="M 86 356 C 88 342, 96 334, 108 334 C 118 334, 124 340, 126 348 L 126 356 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 174 356 C 176 342, 184 334, 196 334 C 206 334, 212 340, 214 348 L 214 356 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 100 334 C 100 326, 104 320, 108 318 C 112 320, 116 326, 116 332" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
    <path d="M 188 334 C 188 326, 192 320, 196 318 C 200 320, 204 326, 204 332" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
  </g>

  <!-- 石阶 -->
  <g stroke="#8a93ad" stroke-width="0.7" opacity="0.6">
    <line x1="60" y1="366" x2="240" y2="366"/><line x1="46" y1="384" x2="254" y2="384"/><line x1="32" y1="402" x2="268" y2="402"/>
  </g>
</svg>
