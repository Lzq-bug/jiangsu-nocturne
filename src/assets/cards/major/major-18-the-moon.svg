<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="月亮：兽径尽头的水洼倒月">
  <defs>
    <radialGradient id="mn-ground" cx="42%" cy="24%" r="100%">
      <stop offset="0" stop-color="#161d31"/><stop offset="0.55" stop-color="#111729"/><stop offset="1" stop-color="#0a0e1d"/>
    </radialGradient>
    <radialGradient id="mn-crescent" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#afc4de" stop-opacity="0.4"/><stop offset="1" stop-color="#afc4de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#mn-ground)"/>

  <!-- 夜空只有一弯远小的蛾眉月（右上角，非 UI 大满月） -->
  <g transform="translate(252 64)">
    <circle r="20" fill="url(#mn-crescent)"/>
    <path d="M 3 -12 A 12.5 12.5 0 1 0 3 12 A 9.5 12.5 0 1 1 3 -12 Z" fill="#e9edf5" opacity="0.92"/>
  </g>
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="60" cy="54" r="0.9"/><circle cx="130" cy="40" r="0.8"/><circle cx="196" cy="66" r="0.9"/>
  </g>

  <!-- 两道矮墙（远中景，透视收束向右） -->
  <g>
    <path d="M 0 218 L 96 210 L 96 150 L 74 150 L 74 118 L 58 118 L 58 96 L 34 96 L 34 150 L 0 150 Z"
          fill="#0b0f20" stroke="#8a93ad" stroke-width="1.2"/>
    <path d="M 300 236 L 210 224 L 210 168 L 196 168 L 196 130" fill="none" stroke="#8a93ad" stroke-width="1.1" opacity="0.8"/>
    <path d="M 196 130 L 214 130" stroke="#8a93ad" stroke-width="1.1" opacity="0.8"/>
    <path d="M 34 102 L 74 102" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <g fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9">
      <rect x="40" y="122" width="8" height="11"/><rect x="56" y="126" width="8" height="11"/>
    </g>
  </g>

  <!-- 兽径：自左下延向右中（对角动线） -->
  <path d="M 0 372 C 60 344, 120 316, 178 292 C 216 276, 248 262, 276 248" fill="none" stroke="#c7cedd" stroke-width="1.2" opacity="0.7"/>
  <path d="M 0 372 C 60 344, 120 316, 178 292 C 216 276, 248 262, 276 248 L 300 236 L 300 420 L 0 420 Z"
        fill="#0c1120" opacity="0.9"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45" fill="none">
    <path d="M 60 356 L 110 336 M 130 328 L 184 306 M 200 292 L 248 272"/>
  </g>

  <!-- 犬影：径上驻足回望（次级主体，剪影） -->
  <g transform="translate(148 300)">
    <path d="M -18 24 C -18 12, -12 4, -2 2 C 6 0, 14 2, 18 8 C 24 6, 30 8, 32 12 L 26 16 L 24 24 L 16 24 L 16 18 C 8 20, -2 20, -8 18 L -8 24 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
    <!-- 回望的头（朝左后） -->
    <path d="M 30 8 C 36 2, 44 0, 50 4 C 52 8, 50 12, 44 14 L 46 20 L 38 20 L 36 14 C 34 12, 32 10, 30 8 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
    <circle cx="47" cy="8" r="1.2" fill="#afc4de"/>
    <path d="M 50 4 L 56 -2" stroke="#c7cedd" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- 水洼中的倒月（叙事光源：径旁低处一小片亮） -->
  <g transform="translate(84 384)">
    <ellipse cx="0" cy="0" rx="40" ry="12" fill="#0e1526" stroke="#8a93ad" stroke-width="0.8"/>
    <ellipse cx="-4" cy="0" rx="16" ry="5" fill="url(#mn-crescent)"/>
    <path d="M -8 -3 A 8 8 0 1 0 -8 3 A 6 8 0 1 1 -8 -3 Z" fill="#e9edf5" opacity="0.9"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.6" fill="none">
      <path d="M 14 2 L 30 2 M 18 5 L 28 5"/>
    </g>
  </g>

  <!-- 塔上的旗（远处微动，暗部） -->
  <path d="M 60 96 L 60 74" stroke="#8a93ad" stroke-width="1.1" opacity="0.7"/>
  <path d="M 60 74 L 76 78 L 60 84 Z" fill="#0b0f20" stroke="#8a93ad" stroke-width="0.8"/>
</svg>
