<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="魔术师：抬起的手与四器之环">
  <defs>
    <radialGradient id="mag-ground" cx="52%" cy="30%" r="90%">
      <stop offset="0" stop-color="#15223a"/><stop offset="0.6" stop-color="#101a30"/><stop offset="1" stop-color="#0a1120"/>
    </radialGradient>
    <radialGradient id="mag-inf" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd6d0" stop-opacity="0.4"/><stop offset="1" stop-color="#7fd6d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mag-wood" width="10" height="14" patternUnits="userSpaceOnUse">
      <path d="M 1 0 C 0 5, 2 9, 1 14 M 6 0 C 5 5, 7 9, 6 14" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#mag-ground)"/>

  <!-- 疏星 -->
  <g fill="#c7cedd" opacity="0.55">
    <circle cx="48" cy="60" r="1"/><circle cx="252" cy="48" r="1.2"/><circle cx="96" cy="120" r="0.9"/><circle cx="230" cy="150" r="1"/>
  </g>

  <!-- ∞ 光弧（叙事光源）：指上悬浮的四器之环 -->
  <g transform="translate(150 130)">
    <circle r="58" fill="url(#mag-inf)"/>
    <path d="M 0 0 C -12 -20, -42 -20, -42 0 C -42 20, -12 20, 0 0 C 12 -20, 42 -20, 42 0 C 42 20, 12 20, 0 0 Z"
          fill="none" stroke="#7fd6d0" stroke-width="1.8" opacity="0.9"/>
    <path d="M 0 0 C -12 -20, -42 -20, -42 0" fill="none" stroke="#c7cedd" stroke-width="0.8" opacity="0.5"/>
    <!-- 四件微缩器物悬浮于环上 -->
    <g transform="translate(-42 0)">
      <path d="M 0 -9 L 0 8 M -3 -3 L 3 -3" stroke="#c7cedd" stroke-width="1.3" fill="none"/>
      <path d="M 0 -9 C 2 -6, 2 -3, 0 -1" fill="none" stroke="#7fd6d0" stroke-width="1" opacity="0.8"/>
    </g>
    <g transform="translate(-14 -14)">
      <path d="M -6 -5 L 6 -5 C 6 1, 3 4, 0 4 C -3 4, -6 1, -6 -5 Z M -2 6 L 2 6 M -4 9 L 4 9" stroke="#c7cedd" stroke-width="1.2" fill="none"/>
    </g>
    <g transform="translate(14 -14)">
      <path d="M 0 -9 L 0 8 M -3 -2 L 3 -2 M -4 7 L 4 7" stroke="#c7cedd" stroke-width="1.2" fill="none"/>
    </g>
    <g transform="translate(42 0)">
      <circle r="6.4" fill="none" stroke="#c7cedd" stroke-width="1.3"/>
      <circle r="2.6" fill="none" stroke="#7fd6d0" stroke-width="0.9" opacity="0.85"/>
    </g>
    <!-- 光弧上的珐琅点 -->
    <circle cx="-42" cy="0" r="1.4" fill="#7fd6d0" opacity="0.9"/>
    <circle cx="42" cy="0" r="1.4" fill="#7fd6d0" opacity="0.9"/>
  </g>

  <!-- 指尖 -->
  <g transform="translate(150 196)">
    <circle r="2.6" fill="#7fd6d0" opacity="0.9"/>
    <path d="M -1 -8 L 1 -8 L 1 -3 L -1 -3 Z" fill="#7fd6d0" opacity="0.6"/>
  </g>

  <!-- 举起的手：自右缘入画 -->
  <g>
    <path d="M 300 300
             C 268 292, 244 278, 228 258
             C 222 250, 220 240, 224 232
             C 230 220, 244 218, 252 226
             C 258 232, 262 240, 268 244
             L 282 250 L 300 254 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 150 200 L 150 224 M 146 202 L 146 222" stroke="#c7cedd" stroke-width="0" fill="none"/>
    <!-- 指向∞的手臂轮廓 -->
    <path d="M 232 258 C 218 244, 202 232, 184 226 C 172 222, 160 222, 152 224" fill="none" stroke="#c7cedd" stroke-width="1.4" opacity="0.85"/>
    <path d="M 152 214 C 148 218, 148 226, 152 230 C 156 232, 160 231, 162 228" fill="none" stroke="#c7cedd" stroke-width="1.4"/>
    <circle cx="153" cy="205" r="4.6" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
  </g>

  <!-- 桌案一角（下带）：旧木 + 玫瑰与百合 -->
  <g>
    <path d="M 0 348 L 300 336 L 300 420 L 0 420 Z" fill="#0d1226" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 0 348 L 300 336 L 300 348 L 0 360 Z" fill="url(#mag-wood)" opacity="0.7"/>
    <path d="M 0 380 L 300 368" stroke="#8a93ad" stroke-width="0.7" opacity="0.5" fill="none"/>
    <path d="M 0 400 L 300 390" stroke="#8a93ad" stroke-width="0.6" opacity="0.4" fill="none"/>
    <!-- 玫瑰（左） -->
    <g transform="translate(70 342)">
      <path d="M 0 0 L 0 -16" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 0 -6 C -7 -8, -10 -13, -8 -18 C -2 -16, 1 -11, 0 -6 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>
      <circle cx="0" cy="-22" r="6" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
      <path d="M -3.4 -23 A 4 4 0 0 1 2 -25 M 3 -22.6 A 4.2 4.2 0 0 1 2.4 -19.6" fill="none" stroke="#c7cedd" stroke-width="0.8"/>
    </g>
    <!-- 百合（右） -->
    <g transform="translate(228 338)">
      <path d="M 0 0 L 0 -14" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 0 -16 C -6 -18, -8 -24, -4 -28 C 0 -24, 2 -19, 0 -16 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 0 -16 C 6 -18, 8 -24, 4 -28" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 0 -28 L 0 -34" stroke="#c7cedd" stroke-width="1" opacity="0.8"/>
      <circle cx="0" cy="-36" r="1.6" fill="#7fd6d0" opacity="0.85"/>
    </g>
  </g>

  <!-- 桌面落影排线 -->
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4">
    <line x1="34" y1="364" x2="94" y2="360"/><line x1="206" y1="356" x2="268" y2="352"/>
  </g>
</svg>
