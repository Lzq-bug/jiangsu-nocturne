<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="命运之轮：沉入台面的偏轴刻度轮">
  <defs>
    <radialGradient id="wf-ground" cx="58%" cy="30%" r="95%">
      <stop offset="0" stop-color="#1c1a10"/><stop offset="0.6" stop-color="#15130a"/><stop offset="1" stop-color="#0d0b05"/>
    </radialGradient>
    <radialGradient id="wf-hub" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#c08a4a" stop-opacity="0.42"/><stop offset="1" stop-color="#c08a4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wf-desk" width="18" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 6 L 18 6 M 0 12 L 18 12" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#wf-ground)"/>

  <!-- 台面（右下切入，轮的下半沉入其后） -->
  <g>
    <path d="M 0 420 L 0 342 C 70 334, 150 330, 224 336 C 252 338, 278 342, 300 348 L 300 420 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 0 342 C 70 334, 150 330, 224 336 C 252 338, 278 342, 300 348" fill="none" stroke="#e9edf5" stroke-width="0.8" opacity="0.5"/>
    <path d="M 0 356 L 300 364" stroke="#8a93ad" stroke-width="0.5" opacity="0.35"/>
  </g>
  <path d="M 0 300 L 300 300 L 300 342 C 224 336, 70 334, 0 342 Z" fill="url(#wf-desk)" opacity="0.5"/>

  <!-- 命运刻度轮：偏轴、右半大半可见、下缘没入台面 -->
  <g transform="translate(178 208) rotate(-14)">
    <!-- 轮体（哑光黄铜，非发光） -->
    <circle r="118" fill="none" stroke="#b28c4f" stroke-width="3.4"/>
    <circle r="106" fill="none" stroke="#8a93ad" stroke-width="1" opacity="0.6"/>
    <circle r="34" fill="none" stroke="#b28c4f" stroke-width="2.2"/>
    <circle r="10" fill="#0b0f20" stroke="#c08a4a" stroke-width="1.8"/>
    <!-- 轮辐（不完整：下半被台面遮去） -->
    <g stroke="#b28c4f" stroke-width="1.3" opacity="0.85">
      <line x1="0" y1="-106" x2="0" y2="-34"/>
      <line x1="74" y1="-74" x2="24" y2="-24"/>
      <line x1="106" y1="0" x2="34" y2="0"/>
      <line x1="74" y1="74" x2="24" y2="24"/>
      <line x1="-74" y1="-74" x2="-24" y2="-24"/>
      <line x1="-106" y1="0" x2="-34" y2="0"/>
    </g>
    <!-- 轮缘刻度：上升侧密、下降侧疏（不对称） -->
    <g stroke="#c7cedd" stroke-width="1.2" opacity="0.9">
      <line x1="0" y1="-118" x2="0" y2="-128"/>
      <line x1="24" y1="-115" x2="27" y2="-125"/>
      <line x1="47" y1="-107" x2="52" y2="-116"/>
      <line x1="68" y1="-95" x2="74" y2="-103"/>
      <line x1="86" y1="-79" x2="93" y2="-85"/>
      <line x1="99" y1="-59" x2="107" y2="-64"/>
      <line x1="109" y1="-37" x2="117" y2="-40"/>
      <line x1="114" y1="-13" x2="123" y2="-14"/>
    </g>
    <g stroke="#8a93ad" stroke-width="1" opacity="0.6">
      <line x1="-114" y1="-13" x2="-123" y2="-14"/>
      <line x1="-109" y1="-37" x2="-117" y2="-40"/>
      <line x1="-99" y1="-59" x2="-107" y2="-64"/>
    </g>
    <!-- 轮缘四枚小符号（狮/瓶/杖痕/星） -->
    <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
      <circle cx="0" cy="-112" r="5"/>
      <circle cx="94" cy="-63" r="5"/>
      <circle cx="-94" cy="-63" r="5"/>
    </g>
    <path d="M -3 -115 L 3 -115 M 0 -118 L 0 -112" stroke="#8a93ad" stroke-width="0.8"/>
    <!-- 轮轴暖光（叙事光源，偏上不居中） -->
    <circle cx="0" cy="-10" r="34" fill="url(#wf-hub)"/>
    <circle cx="0" cy="-10" r="4" fill="#e6c687" opacity="0.95"/>
  </g>

  <!-- 轮上升侧：一枚攀升的小星钉在最高刻度旁 -->
  <g transform="translate(268 74)">
    <path d="M 0 -6 L 1.6 -1.6 L 6 0 L 1.6 1.6 L 0 6 L -1.6 1.6 L -6 0 L -1.6 -1.6 Z" fill="#e6c687" opacity="0.95"/>
    <path d="M -1 8 L -3 14" stroke="#e6c687" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- 左侧：斯芬克斯小剪影静坐观望 -->
  <g transform="translate(48 300)">
    <path d="M -16 10 C -16 0, -10 -8, 0 -10 C 4 -14, 10 -14, 12 -10 C 18 -8, 20 -2, 18 4 L 20 10 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.3"/>
    <path d="M 12 -10 C 16 -14, 20 -14, 22 -11" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
    <circle cx="19" cy="-12" r="1.2" fill="#c7cedd"/>
  </g>

  <!-- 沉入处的阴影排线 -->
  <g fill="#0b0f20" opacity="0.55">
    <path d="M 96 330 C 140 318, 190 312, 240 318 L 300 326 L 300 342 C 224 336, 70 334, 0 342 L 0 342 C 30 337, 64 334, 96 330 Z"/>
  </g>
</svg>
