<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="死神：镰刃地平线上的白马与黑玫瑰">
  <defs>
    <radialGradient id="dth-ground" cx="46%" cy="30%" r="90%">
      <stop offset="0" stop-color="#171327"/><stop offset="0.6" stop-color="#100d1f"/><stop offset="1" stop-color="#0a0814"/>
    </radialGradient>
    <linearGradient id="dth-dawn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e08a4c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e08a4c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e08a4c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e08a4c" stop-opacity="0.34"/><stop offset="1" stop-color="#e08a4c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dth-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(64)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8a93ad" stroke-width="0.6" opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#dth-ground)"/>

  <!-- 夜空疏星 -->
  <g fill="#c7cedd" opacity="0.5">
    <circle cx="58" cy="58" r="1.1"/><circle cx="150" cy="40" r="0.9"/><circle cx="238" cy="66" r="1.2"/>
    <circle cx="98" cy="110" r="0.9"/><circle cx="266" cy="140" r="1"/>
  </g>

  <!-- 枯枝与最后一片叶（左上） -->
  <g stroke="#c7cedd" fill="none" opacity="0.8">
    <path d="M 24 34 C 52 48, 78 66, 96 92 M 52 48 C 58 42, 62 36, 64 28 M 76 62 C 84 60, 92 54, 96 46" stroke-width="1.2"/>
  </g>
  <path d="M 64 28 C 60 18, 66 10, 74 8 C 76 16, 72 24, 64 28 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1"/>

  <!-- 镰刃地平线：从左下扫向右上 -->
  <g>
    <path d="M 0 286 C 74 268, 168 232, 300 150" fill="none" stroke="#c7cedd" stroke-width="2.4"/>
    <path d="M 0 286 C 74 268, 168 232, 300 150 L 300 158 C 172 240, 78 276, 2 292 Z" fill="url(#dth-hatch)"/>
    <path d="M 40 274 C 110 258, 190 226, 268 172" fill="none" stroke="#8a93ad" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- 地平线上的曙光（叙事光源） -->
  <rect x="60" y="304" width="180" height="3" fill="url(#dth-dawn)"/>
  <ellipse cx="150" cy="305" rx="120" ry="26" fill="url(#dth-glow)" opacity="0.6"/>

  <!-- 白马：沿刃脊而行（深色描边环保证小尺寸可辨） -->
  <g>
    <path d="M 118 236
             C 124 230, 132 227, 141 227
             L 150 218 L 156 226
             C 168 224, 182 226, 194 232
             C 206 237, 212 244, 210 251
             L 202 252 L 200 262 L 194 262 L 194 254
             C 182 258, 166 259, 154 256
             L 152 266 L 146 266 L 146 254
             C 138 252, 130 248, 126 243
             L 116 246 C 112 243, 114 238, 118 236 Z"
          fill="#e9edf5" stroke="#0a0814" stroke-width="1.8" paint-order="stroke"/>
    <path d="M 150 218 C 144 210, 146 202, 152 198 C 156 204, 155 212, 152 218 Z" fill="#e9edf5" stroke="#0a0814" stroke-width="1.2" paint-order="stroke"/>
    <path d="M 210 240 C 220 234, 228 232, 234 234" fill="none" stroke="#e9edf5" stroke-width="2" opacity="0.85"/>
    <circle cx="152" cy="214" r="1.1" fill="#0b0f20"/>
  </g>

  <!-- 刃下的黑玫瑰田 -->
  <g>
    <g stroke="#c7cedd" stroke-width="1" opacity="0.8" fill="none">
      <path d="M 34 348 C 36 336, 34 326, 30 318 M 88 356 C 90 344, 88 334, 84 324 M 146 360 C 148 348, 146 338, 142 328 M 208 356 C 210 344, 208 336, 204 326 M 262 348 C 264 338, 262 330, 258 322"/>
    </g>
    <g stroke="#8a93ad" stroke-width="0.7" opacity="0.6" fill="none">
      <path d="M 60 352 C 62 342, 60 334, 56 326 M 118 358 C 120 348, 118 340, 114 330 M 178 358 C 180 348, 178 340, 174 332 M 236 352 C 238 344, 236 336, 232 328"/>
    </g>
    <!-- 玫瑰头：暗底银缘 -->
    <g>
      <g transform="translate(30 312)">
        <circle r="10" fill="#0a0814" stroke="#8a93ad" stroke-width="1.2"/>
        <path d="M -5 -2 A 6 6 0 0 1 3 -5 M 4 -3 A 6.4 6.4 0 0 1 5 3 M 3 5 A 6.6 6.6 0 0 1 -4 5" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
        <circle r="1.6" fill="#e08a4c" opacity="0.85"/>
      </g>
      <g transform="translate(84 318)">
        <circle r="10" fill="#0a0814" stroke="#8a93ad" stroke-width="1.2"/>
        <path d="M -5 -2 A 6 6 0 0 1 3 -5 M 4 -3 A 6.4 6.4 0 0 1 5 3 M 3 5 A 6.6 6.6 0 0 1 -4 5" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
        <circle r="1.6" fill="#e08a4c" opacity="0.85"/>
      </g>
      <g transform="translate(142 322)">
        <circle r="11" fill="#0a0814" stroke="#c7cedd" stroke-width="1.3"/>
        <path d="M -5.5 -2 A 6.6 6.6 0 0 1 3.3 -5.5 M 4.4 -3.3 A 7 7 0 0 1 5.5 3.3 M 3.3 5.5 A 7.2 7.2 0 0 1 -4.4 5.5" fill="none" stroke="#c7cedd" stroke-width="1"/>
        <circle r="1.8" fill="#e08a4c"/>
      </g>
      <g transform="translate(204 320)">
        <circle r="10" fill="#0a0814" stroke="#8a93ad" stroke-width="1.2"/>
        <path d="M -5 -2 A 6 6 0 0 1 3 -5 M 4 -3 A 6.4 6.4 0 0 1 5 3 M 3 5 A 6.6 6.6 0 0 1 -4 5" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
        <circle r="1.6" fill="#e08a4c" opacity="0.85"/>
      </g>
      <g transform="translate(258 316)">
        <circle r="9" fill="#0a0814" stroke="#8a93ad" stroke-width="1.1"/>
        <path d="M -4.5 -2 A 5.4 5.4 0 0 1 2.7 -4.5 M 3.6 -2.7 A 5.8 5.8 0 0 1 4.5 2.7" fill="none" stroke="#8a93ad" stroke-width="0.9"/>
        <circle r="1.5" fill="#e08a4c" opacity="0.85"/>
      </g>
    </g>
    <!-- 地表碎屑排线 -->
    <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4">
      <line x1="46" y1="376" x2="76" y2="376"/><line x1="120" y1="384" x2="158" y2="384"/>
      <line x1="196" y1="378" x2="228" y2="378"/><line x1="86" y1="396" x2="110" y2="396"/>
    </g>
  </g>

  <!-- 飘落的花瓣 -->
  <g fill="#0a0814" stroke="#8a93ad" stroke-width="0.7">
    <path d="M 96 214 C 92 210, 94 204, 100 204 C 102 209, 100 213, 96 214 Z"/>
    <path d="M 196 196 C 192 192, 194 186, 200 186 C 202 191, 200 195, 196 196 Z"/>
    <path d="M 236 262 C 232 258, 234 252, 240 252 C 242 257, 240 261, 236 262 Z"/>
  </g>
</svg>
