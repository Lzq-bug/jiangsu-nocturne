<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="高塔：正在断裂的结构">
  <defs>
    <radialGradient id="tw-ground" cx="44%" cy="26%" r="98%">
      <stop offset="0" stop-color="#1b1a22"/><stop offset="0.6" stop-color="#14131b"/><stop offset="1" stop-color="#0b0a12"/>
    </radialGradient>
    <radialGradient id="tw-flash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ede3c8" stop-opacity="0.5"/><stop offset="1" stop-color="#ede3c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tw-brick" width="14" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 14 4 M 7 0 L 7 4 M 3.5 4 L 3.5 8" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#tw-ground)"/>

  <!-- 乌云压顶（横向层线，风暴方向自左） -->
  <g stroke="#8a93ad" stroke-width="0.8" opacity="0.5" fill="none">
    <path d="M 0 54 C 44 46, 96 48, 140 58"/>
    <path d="M 0 82 C 52 74, 110 76, 158 88"/>
    <path d="M 10 112 C 60 104, 118 106, 164 116"/>
  </g>

  <!-- 斜贯闪电（构图强对角线，叙事光源） -->
  <g>
    <path d="M 36 30 L 108 96 L 84 100 L 150 168 L 132 170 L 176 226" fill="none" stroke="#ede3c8" stroke-width="2.6"/>
    <path d="M 108 96 L 84 100 L 150 168" fill="none" stroke="#ede3c8" stroke-width="1" opacity="0.5"/>
    <circle cx="150" cy="168" r="30" fill="url(#tw-flash)" opacity="0.7"/>
  </g>

  <!-- 高塔：塔身倾斜，顶部三分之一整体断失 -->
  <g>
    <path d="M 96 420
             C 98 350, 102 290, 110 240
             C 116 204, 126 176, 140 158
             L 150 130
             L 168 138
             C 176 160, 186 186, 190 220
             C 196 272, 198 344, 196 420 Z"
          fill="#0b0f20" stroke="#c7cedd" stroke-width="1.8" transform="rotate(4 150 420)"/>
    <path d="M 96 420 C 98 350, 102 290, 110 240 C 116 204, 126 176, 140 158 L 150 130 L 168 138"
          fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.5" transform="rotate(4 150 420)"/>
    <!-- 断口毛刺 -->
    <g stroke="#e9edf5" stroke-width="1.3" opacity="0.9">
      <path d="M 138 158 L 132 148 L 142 152 L 138 142"/>
      <path d="M 150 130 L 158 122 L 162 132 L 168 138"/>
    </g>
    <!-- 塔窗内焰 -->
    <rect x="122" y="252" width="9" height="13" fill="#ede3c8" opacity="0.55" transform="rotate(4 150 420)"/>
    <rect x="158" y="300" width="8" height="11" fill="#ede3c8" opacity="0.4" transform="rotate(4 150 420)"/>
  </g>

  <!-- 坠落的王冠与人影 -->
  <g>
    <path d="M 214 96 C 224 88, 238 88, 246 96 L 242 108 L 218 108 Z" fill="#0b0f20" stroke="#e9edf5" stroke-width="1.2"/>
    <path d="M 218 88 L 214 80 M 230 86 L 230 78 M 242 88 L 246 80" stroke="#e9edf5" stroke-width="1.2"/>
    <!-- 小人影坠落（姿态失衡） -->
    <g transform="translate(206 150) rotate(-24)">
      <circle cx="0" cy="-12" r="4.4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -2 -8 C -6 -2, -6 6, -2 12 L -8 22 L -3 24 L 2 14 C 6 8, 6 0, 2 -6 Z"
            fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -2 -6 C 4 -10, 10 -12, 14 -10" fill="none" stroke="#c7cedd" stroke-width="1.1"/>
    </g>
  </g>

  <!-- 坠砖 -->
  <g fill="#0b0f20" stroke="#8a93ad" stroke-width="0.9">
    <rect x="228" y="176" width="12" height="7" transform="rotate(18 234 179)"/>
    <rect x="184" y="128" width="10" height="6" transform="rotate(-12 189 131)"/>
    <rect x="250" y="220" width="11" height="6" transform="rotate(30 255 223)"/>
  </g>

  <!-- 烟尘排线（自断口斜向上） -->
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.5" fill="none">
    <path d="M 148 120 C 156 104, 168 92, 184 84 M 160 128 C 170 116, 182 106, 196 100"/>
  </g>

  <!-- 地面：震裂的石台 -->
  <g>
    <path d="M 0 420 L 0 384 C 60 376, 130 372, 200 378 C 240 382, 272 382, 300 378 L 300 420 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.3"/>
    <g stroke="#e9edf5" stroke-width="0.9" opacity="0.6" fill="none">
      <path d="M 60 396 L 110 384 L 96 412 M 110 384 L 150 404"/>
    </g>
  </g>
</svg>
