<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="审判：火漆崩裂，名册的纸页自册中逆重升起">
  <defs>
    <linearGradient id="jd-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1228"/><stop offset="0.6" stop-color="#0b0f22"/><stop offset="1" stop-color="#080b1a"/>
    </linearGradient>
    <linearGradient id="jd-call" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9b36c" stop-opacity="0.3"/><stop offset="0.6" stop-color="#d9b36c" stop-opacity="0.1"/><stop offset="1" stop-color="#d9b36c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="jd-seed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9b36c" stop-opacity="0.4"/><stop offset="1" stop-color="#d9b36c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#jd-ground)"/>

  <!-- 两侧档案架的暗影（垂直结构语境，压暗作框） -->
  <g fill="#0a0d1c" stroke="#8a93ad" stroke-width="0.8" opacity="0.85">
    <path d="M 0 420 L 0 120 L 34 128 L 34 420 Z"/>
    <path d="M 300 420 L 300 108 L 268 116 L 268 420 Z"/>
  </g>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.4">
    <path d="M 4 190 L 30 196 M 4 262 L 30 268 M 270 180 L 296 174 M 270 252 L 296 246"/>
  </g>

  <!-- 召唤之光：细柱自崩裂的火漆垂直升起（唯一叙事光源，主动线：向上） -->
  <path d="M 139 306 C 138 240, 136 160, 134 66 L 170 66 C 168 160, 166 240, 165 306 Z" fill="url(#jd-call)"/>
  <circle cx="152" cy="298" r="22" fill="url(#jd-seed)"/>

  <!-- 案台 -->
  <path d="M 58 322 L 246 322 L 252 336 L 52 336 Z" fill="#141830" stroke="#c7cedd" stroke-width="1.3"/>

  <!-- 厚重的名册（唯一主体锚点：书脊 + 书口纸页线 + 崩开的封漆） -->
  <g>
    <path d="M 76 322
             C 74 314, 76 306, 82 302
             L 216 296
             C 224 296, 230 300, 232 308
             C 233 314, 230 320, 224 322 Z"
          fill="#0f1330" stroke="#a9b1c7" stroke-width="1.4"/>
    <!-- 书脊（左） -->
    <path d="M 76 322 C 74 314, 76 306, 82 302 L 96 301 C 91 306, 89 314, 91 322 Z" fill="#1a2040" stroke="#c7cedd" stroke-width="1.2"/>
    <!-- 书口纸页线（右） -->
    <g stroke="#8a93ad" stroke-width="0.55" opacity="0.7">
      <path d="M 218 299 L 222 320 M 212 299.5 L 216 320.5 M 206 300 L 210 321"/>
    </g>
    <!-- 封面压痕框 -->
    <path d="M 104 306 C 130 303, 176 301, 206 300" fill="none" stroke="#8a93ad" stroke-width="0.6" opacity="0.6"/>
    <!-- 崩开的火漆：两半分开 -->
    <g transform="translate(158 300)">
      <path d="M -7 -8 L 2 -8 L -1 -1 L -6 0 Z" fill="#6e2c27" stroke="#a85a50" stroke-width="0.7" transform="translate(-7 -1) rotate(-18)"/>
      <path d="M -7 -8 L 2 -8 L -1 -1 L -6 0 Z" fill="#8a3a32" stroke="#b06a5e" stroke-width="0.7" transform="translate(10 4) rotate(24)"/>
    </g>
  </g>

  <!-- 升起的纸页（主视觉：近垂直的纸带，缘线平行，上缘前卷，比光更亮） -->
  <g>
    <path d="M 136 296
             L 140 168
             C 141 148, 146 126, 158 108
             C 164 99, 172 92, 182 88
             L 186 96
             C 178 100, 172 106, 168 114
             C 160 130, 156 150, 155 170
             L 158 294 Z"
          fill="#2a3154" stroke="#dfe4ef" stroke-width="1.5"/>
    <!-- 纸页内缘 -->
    <path d="M 145 292 L 148 172 C 149 152, 154 132, 164 116" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.75"/>
    <!-- 名讳行（被重新开启的记录） -->
    <g stroke="#c7cedd" stroke-width="0.7" opacity="0.85">
      <path d="M 149 190 C 157 186, 165 184, 173 184"/>
      <path d="M 148 214 C 156 210, 164 208, 172 208"/>
      <path d="M 149 240 C 157 236, 165 234, 174 234"/>
      <path d="M 150 264 C 158 260, 166 258, 175 258"/>
    </g>
    <!-- 上缘卷角（纸性） -->
    <path d="M 182 88 C 188 84, 195 84, 199 88 C 196 93, 190 95, 185 94 Z" fill="#39426e" stroke="#dfe4ef" stroke-width="1"/>
    <!-- 页梢受光段 -->
    <path d="M 170 108 C 176 100, 182 94, 188 90" fill="none" stroke="#e9d9a8" stroke-width="1.2" opacity="0.9"/>
  </g>
  <!-- 被唤起的页角（贴近光柱，极少量） -->
  <g fill="#2a3154" stroke="#a9b1c7" stroke-width="0.8">
    <path d="M 196 76 L 205 70 L 208 78 L 200 83 Z"/>
    <path d="M 124 138 L 131 132 L 135 138 L 127 145 Z" opacity="0.9"/>
  </g>

  <!-- 光柱内微尘与台面落光 -->
  <g fill="#e9d9a8" opacity="0.5">
    <circle cx="150" cy="236" r="1"/><circle cx="156" cy="196" r="0.9"/><circle cx="147" cy="156" r="0.9"/>
  </g>
  <path d="M 108 336 L 196 336 L 186 343 L 116 343 Z" fill="#d9b36c" opacity="0.1"/>

  <!-- 桌脚阴影线 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M 64 356 L 132 356 M 176 370 L 244 370"/>
  </g>
</svg>
