<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="恶魔：契约桌前的影子戏">
  <defs>
    <radialGradient id="dv-ground" cx="38%" cy="38%" r="98%">
      <stop offset="0" stop-color="#1e1420"/><stop offset="0.6" stop-color="#160f18"/><stop offset="1" stop-color="#0c0810"/>
    </radialGradient>
    <radialGradient id="dv-candle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c2453a" stop-opacity="0.35"/><stop offset="1" stop-color="#c2453a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#dv-ground)"/>

  <!-- 墙上的角形手影（"恶魔"只以影子存在） -->
  <g>
    <path d="M 176 128
             C 196 118, 214 120, 224 132
             C 232 126, 244 126, 250 134
             C 258 130, 266 134, 266 142
             C 266 152, 254 156, 244 152
             C 236 158, 222 158, 214 152
             C 204 156, 192 152, 188 144
             C 180 142, 174 136, 176 128 Z"
          fill="#080510" stroke="#c2453a" stroke-width="0.9" opacity="0.85"/>
    <!-- 双角轮廓（影中影） -->
    <path d="M 204 124 C 200 112, 204 102, 212 98 M 232 120 C 238 110, 238 100, 232 94"
          fill="none" stroke="#c2453a" stroke-width="1.1" opacity="0.7"/>
    <!-- 两条锁链自影中垂下 -->
    <g fill="none" stroke="#8a93ad" stroke-width="1.4">
      <path d="M 210 156 C 204 190, 200 220, 202 250"/>
      <path d="M 244 156 C 250 190, 254 220, 252 250"/>
    </g>
    <g fill="none" stroke="#8a93ad" stroke-width="0.8" opacity="0.8">
      <ellipse cx="201" cy="196" rx="4" ry="2.6"/><ellipse cx="203" cy="222" rx="4" ry="2.6"/>
      <ellipse cx="251" cy="196" rx="4" ry="2.6"/><ellipse cx="252" cy="222" rx="4" ry="2.6"/>
    </g>
    <!-- 链末端的两只空环（从未锁上任何人） -->
    <g fill="none" stroke="#8a93ad" stroke-width="1.6">
      <circle cx="202" cy="262" r="7"/>
      <circle cx="252" cy="262" r="7" stroke="#c2453a" stroke-opacity="0.8"/>
    </g>
  </g>

  <!-- 契约桌（主体，叙事光源：烛照契约） -->
  <g>
    <path d="M 30 312 L 226 312 L 218 340 L 38 340 Z" fill="#0d1226" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 30 312 L 226 312" stroke="#e9edf5" stroke-width="0.9" opacity="0.55"/>
    <!-- 摊开的契约 -->
    <g transform="translate(112 296) rotate(-4)">
      <path d="M -44 -14 C -22 -20, 22 -20, 44 -14 L 46 10 C 24 4, -22 4, -46 10 Z"
            fill="#141020" stroke="#e9edf5" stroke-width="1.2"/>
      <g stroke="#8a93ad" stroke-width="0.6" opacity="0.75">
        <path d="M -32 -10 L 34 -12 M -30 -4 L 32 -6 M -26 2 L 28 0" fill="none"/>
      </g>
      <!-- 签押处的一枚暗指印 -->
      <ellipse cx="24" cy="4" rx="5" ry="3.4" fill="#c2453a" opacity="0.75"/>
    </g>
    <!-- 羽毛笔 -->
    <g transform="translate(172 286) rotate(38)">
      <path d="M 0 0 C 6 -14, 12 -22, 22 -26 C 18 -16, 12 -8, 4 -2 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 22 -26 L 26 -30" stroke="#c7cedd" stroke-width="1.2"/>
    </g>
    <!-- 烛（唯一光源，火光偏红） -->
    <g transform="translate(60 288)">
      <circle r="30" fill="url(#dv-candle)"/>
      <path d="M -4 -6 L 4 -6 L 3.4 10 L -3.4 10 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M 0 -12 C 4 -7, 3.4 -2, 0 1 C -3.4 -2, -4 -7, 0 -12 Z" fill="#c2453a"/>
      <circle cx="0" cy="-15" r="1.2" fill="#c2453a" opacity="0.8"/>
    </g>
    <!-- 烛光投向契约与墙影的方向感 -->
    <path d="M 66 296 C 90 302, 120 304, 146 300" stroke="#c2453a" stroke-width="0.8" opacity="0.4" fill="none"/>
  </g>

  <!-- 地面：一截磨断的旧链环 -->
  <g transform="translate(258 372)">
    <circle r="7.4" fill="none" stroke="#8a93ad" stroke-width="1.6" opacity="0.9"/>
    <path d="M -7 0 C -3 -3, 3 -3, 7 0" fill="none" stroke="#0b0f20" stroke-width="1.6"/>
  </g>

  <!-- 地面排线 -->
  <g stroke="#8a93ad" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 40 386 L 120 384 M 150 396 L 230 394"/>
  </g>
</svg>
