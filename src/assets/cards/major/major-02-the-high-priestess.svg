<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="女祭司：帷幕只掀开一线">
  <defs>
    <radialGradient id="hp-ground" cx="50%" cy="34%" r="90%">
      <stop offset="0" stop-color="#191f3c"/><stop offset="0.62" stop-color="#121731"/><stop offset="1" stop-color="#0b0f22"/>
    </radialGradient>
    <radialGradient id="hp-seam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7cedd" stop-opacity="0.34"/><stop offset="1" stop-color="#c7cedd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hp-fold" width="9" height="18" patternUnits="userSpaceOnUse">
      <path d="M 3 0 C 1 6, 5 12, 3 18 M 7 0 C 5 6, 9 12, 7 18" fill="none" stroke="#8a93ad" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="300" height="420" fill="url(#hp-ground)"/>

  <!-- 内殿地台 -->
  <path d="M 0 356 L 300 356 L 300 420 L 0 420 Z" fill="#0c1126"/>
  <path d="M 0 356 L 300 356" stroke="#8a93ad" stroke-width="1" opacity="0.6"/>
  <g stroke="#8a93ad" stroke-width="0.6" opacity="0.45">
    <line x1="24" y1="372" x2="276" y2="372"/><line x1="40" y1="388" x2="260" y2="388"/><line x1="56" y1="404" x2="244" y2="404"/>
  </g>

  <!-- 双柱：一银一黑 -->
  <g>
    <rect x="52" y="88" width="26" height="268" fill="#141b36" stroke="#c7cedd" stroke-width="1.7"/>
    <rect x="222" y="88" width="26" height="268" fill="#0a0d1c" stroke="#8a93ad" stroke-width="1.5"/>
    <rect x="46" y="80" width="38" height="12" fill="#141b36" stroke="#c7cedd" stroke-width="1.3"/>
    <rect x="216" y="80" width="38" height="12" fill="#0a0d1c" stroke="#8a93ad" stroke-width="1.2"/>
    <path d="M 65 100 L 65 348 M 235 100 L 235 348" stroke="#8a93ad" stroke-width="0.6" opacity="0.5"/>
    <g fill="#c7cedd" opacity="0.6">
      <circle cx="65" cy="120" r="1.2"/><circle cx="235" cy="140" r="1.2"/><circle cx="65" cy="200" r="1"/>
    </g>
  </g>

  <!-- 帷幕：只掀开中央一线 -->
  <g>
    <!-- 左幕 -->
    <path d="M 78 92 C 96 150, 96 260, 84 356 L 128 356 C 138 270, 140 176, 134 92 Z"
          fill="#0e1330" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 78 92 C 96 150, 96 260, 84 356 L 128 356 C 138 270, 140 176, 134 92 Z" fill="url(#hp-fold)" opacity="0.7"/>
    <!-- 右幕 -->
    <path d="M 222 92 C 204 150, 204 260, 216 356 L 172 356 C 162 270, 160 176, 166 92 Z"
          fill="#0e1330" stroke="#c7cedd" stroke-width="1.4"/>
    <path d="M 222 92 C 204 150, 204 260, 216 356 L 172 356 C 162 270, 160 176, 166 92 Z" fill="url(#hp-fold)" opacity="0.7"/>
  </g>

  <!-- 幕缝：静水与新月（叙事光源：冷的银） -->
  <g>
    <ellipse cx="150" cy="240" rx="34" ry="86" fill="url(#hp-seam)"/>
    <rect x="134" y="92" width="32" height="264" fill="#080b18"/>
    <!-- 缝内静水 -->
    <path d="M 134 288 L 166 288 L 166 356 L 134 356 Z" fill="#0c1428"/>
    <path d="M 134 292 L 166 292" stroke="#c7cedd" stroke-width="0.8" opacity="0.7"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.6">
      <path d="M 137 302 L 163 302 M 139 312 L 161 312 M 137 322 L 163 322 M 140 332 L 160 332"/>
    </g>
    <!-- 新月悬于缝中 -->
    <g transform="translate(150 150)">
      <path d="M 6 -18 A 19 19 0 1 0 6 18 A 14 19 0 1 1 6 -18 Z" fill="#e9edf5" opacity="0.95"/>
      <circle r="24" fill="url(#hp-seam)" opacity="0.8"/>
    </g>
    <!-- 石榴：缝前景台一角 -->
    <g transform="translate(150 344)">
      <circle r="6.4" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1"/>
      <path d="M -2 -6 L 0 -9 L 2 -6" fill="none" stroke="#c7cedd" stroke-width="0.9"/>
      <circle cx="-1.6" cy="1" r="0.9" fill="#c4526a" opacity="0.9"/>
      <circle cx="1.8" cy="-0.4" r="0.9" fill="#c4526a" opacity="0.9"/>
    </g>
  </g>

  <!-- 前景石阶与摊开的经卷 -->
  <g>
    <path d="M 96 356 L 204 356 L 216 384 L 84 384 Z" fill="#101736" stroke="#8a93ad" stroke-width="1.1"/>
    <path d="M 84 384 L 216 384 L 226 412 L 74 412 Z" fill="#0d1330" stroke="#8a93ad" stroke-width="1"/>
    <!-- 经卷 -->
    <g transform="translate(150 402)">
      <path d="M -46 -4 C -30 -10, 30 -10, 46 -4 C 30 2, -30 2, -46 -4 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
      <g stroke="#8a93ad" stroke-width="0.6" opacity="0.7">
        <path d="M -34 -5 C -18 -8, 18 -8, 34 -5" fill="none"/>
        <path d="M -30 -2 C -16 -4, 16 -4, 30 -2" fill="none"/>
      </g>
      <circle cx="0" cy="-3" r="1.4" fill="#c7cedd" opacity="0.8"/>
    </g>
  </g>
</svg>
