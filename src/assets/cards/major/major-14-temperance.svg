<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="节制：昼夜双泉绞合成一线">
  <defs>
    <radialGradient id="tp-ground" cx="50%" cy="30%" r="95%">
      <stop offset="0" stop-color="#141f28"/><stop offset="0.6" stop-color="#101a22"/><stop offset="1" stop-color="#091119"/>
    </radialGradient>
    <radialGradient id="tp-node" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fc2c9" stop-opacity="0.5"/><stop offset="1" stop-color="#6fc2c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tp-node2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d99c5b" stop-opacity="0.3"/><stop offset="1" stop-color="#d99c5b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#tp-ground)"/>

  <!-- 左崖（夜侧·冷泉） -->
  <g>
    <path d="M 0 420 L 0 150 C 30 146, 56 156, 74 176 C 88 192, 94 214, 92 238 L 84 420 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 0 150 C 30 146, 56 156, 74 176 C 88 192, 94 214, 92 238" fill="none" stroke="#e9edf5" stroke-width="0.9" opacity="0.55"/>
    <path d="M 14 180 C 30 176, 44 184, 52 196" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <!-- 冷泉口（石雕狮口意象简化为岩槽） -->
    <path d="M 66 172 L 84 168 L 84 184 L 66 188 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
  </g>

  <!-- 右崖（昼侧·暖泉）：轮廓镜像但更低 -->
  <g>
    <path d="M 300 420 L 300 196 C 272 194, 248 204, 232 222 C 220 236, 216 256, 218 278 L 226 420 Z"
          fill="#0d1226" stroke="#c7cedd" stroke-width="1.6"/>
    <path d="M 300 196 C 272 194, 248 204, 232 222 C 220 236, 216 256, 218 278" fill="none" stroke="#e9edf5" stroke-width="0.9" opacity="0.55"/>
    <path d="M 286 224 C 272 222, 260 230, 254 240" fill="none" stroke="#8a93ad" stroke-width="0.7" opacity="0.6"/>
    <path d="M 216 268 L 234 264 L 234 280 L 216 284 Z" fill="#0b0f20" stroke="#c7cedd" stroke-width="1.2"/>
  </g>

  <!-- 双泉绞合（构图动线：两股对角线交汇于中轴） -->
  <g>
    <!-- 冷流（左，青） -->
    <path d="M 78 186 C 96 210, 112 226, 136 240 C 148 247, 152 254, 150 262" fill="none" stroke="#6fc2c9" stroke-width="2" opacity="0.85"/>
    <path d="M 86 196 C 100 214, 114 228, 132 238" fill="none" stroke="#6fc2c9" stroke-width="0.9" opacity="0.5"/>
    <!-- 暖流（右，金） -->
    <path d="M 224 276 C 206 286, 186 288, 166 280 C 156 276, 150 270, 150 262" fill="none" stroke="#d99c5b" stroke-width="2" opacity="0.8"/>
    <path d="M 216 286 C 200 292, 184 292, 170 286" fill="none" stroke="#d99c5b" stroke-width="0.9" opacity="0.5"/>
    <!-- 交汇结（唯一主叙事光源） -->
    <circle cx="150" cy="262" r="26" fill="url(#tp-node)"/>
    <circle cx="150" cy="262" r="10" fill="url(#tp-node2)"/>
    <circle cx="150" cy="262" r="5.4" fill="none" stroke="#e9edf5" stroke-width="0.8" opacity="0.55"/>
    <circle cx="150" cy="262" r="3" fill="#e9edf5" opacity="0.95"/>
  </g>

  <!-- 合流落入下方静池，水面左夜右昼 -->
  <g>
    <path d="M 150 268 C 150 292, 148 316, 148 340" fill="none" stroke="#6fc2c9" stroke-width="1.6" opacity="0.8"/>
    <!-- 池 -->
    <ellipse cx="150" cy="352" rx="86" ry="20" fill="#0c1428" stroke="#8a93ad" stroke-width="1.1"/>
    <path d="M 150 340 L 150 366" stroke="#e9edf5" stroke-width="0.8" opacity="0.5"/>
    <!-- 左夜右昼的池面 -->
    <path d="M 70 348 C 90 344, 116 344, 142 348" fill="none" stroke="#6fc2c9" stroke-width="0.8" opacity="0.7"/>
    <path d="M 158 348 C 184 344, 210 344, 230 348" fill="none" stroke="#d99c5b" stroke-width="0.8" opacity="0.6"/>
    <g stroke="#8a93ad" stroke-width="0.5" opacity="0.5" fill="none">
      <path d="M 84 360 L 128 360 M 172 360 L 216 360"/>
    </g>
  </g>

  <!-- 池边鸢尾两株（次级，左右各一） -->
  <g fill="#0b0f20" stroke="#c7cedd" stroke-width="1.1">
    <path d="M 58 332 C 54 318, 58 306, 66 300 C 70 310, 66 322, 58 332 Z"/>
    <path d="M 244 340 C 248 326, 244 314, 236 308 C 232 318, 236 330, 244 340 Z"/>
  </g>
</svg>
