<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>water-shader-check</title>
<script type="importmap">
{"imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" }}
</script>
<style>html,body{margin:0;background:#000}pre{position:fixed;left:0;top:0;color:#0f0;font:11px monospace;z-index:9;white-space:pre-wrap}</style>
</head>
<body><pre id="out">running</pre>
<script type="module">
const out = [];
const log = (s) => { out.push(String(s)); document.getElementById('out').textContent = out.join('\n'); };
const e0 = console.error, e1 = console.warn;
console.error = (...a) => { log('ERR ' + a.join(' ').slice(0, 3000)); e0(...a); };
console.warn = (...a) => { log('WARN ' + a.join(' ').slice(0, 800)); e1(...a); };
window.addEventListener('error', (ev) => log('THROW ' + ev.message));

const THREE = await import('three');
const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
const W = await import('./src/water.js');
const E = await import('./src/environment.js');
const { tideAt } = await import('./src/tide.js');
const L = await import('./src/layout.js');

const qs = new URLSearchParams(location.search);
const mode = qs.get('shot');           // 截图模式：跑一帧就停
const tideH = Number(qs.get('tide') || 7.9);
const cam = qs.get('cam') || 'beach';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1280, 720);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
log('gl2=' + renderer.capabilities.isWebGL2);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color('#070c16'), 0.0042);
const camera = new THREE.PerspectiveCamera(60, 1280 / 720, 0.1, 4200);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1024, 1024), 0.74, 0.55, 1.0));
composer.addPass(new OutputPass());

/* 替身地形：只为看水陆交界，B 组的真地形另行 */
const TW = 260, TD = 170, TX0 = -1150, TX1 = 800, TZ0 = -460, TZ1 = 380;
const pos = new Float32Array((TW + 1) * (TD + 1) * 3);
let k = 0;
for (let j = 0; j <= TD; j++) {
  const z = TZ0 + (TZ1 - TZ0) * j / TD;
  for (let i = 0; i <= TW; i++) {
    const x = TX0 + (TX1 - TX0) * i / TW;
    pos[k++] = x; pos[k++] = E.terrainH(x, z); pos[k++] = z;
  }
}
const tg = new THREE.BufferGeometry();
tg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const idx = [];
for (let j = 0; j < TD; j++) for (let i = 0; i < TW; i++) {
  const a = j * (TW + 1) + i, b = a + 1, c = a + TW + 1, d = c + 1;
  idx.push(a, c, b, b, c, d);
}
tg.setIndex(idx); tg.computeVertexNormals();
const terr = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ color: '#6b6154', roughness: 0.95 }));
scene.add(terr);
scene.add(new THREE.HemisphereLight(new THREE.Color('#33415f'), new THREE.Color('#0d0b08'), 0.7));
const dl = new THREE.DirectionalLight(new THREE.Color('#b9cbe8'), 0.7);
dl.position.copy(E.MOON_DIR).multiplyScalar(900); scene.add(dl);

const t0 = performance.now();
const rings = new W.WaveRings();
const water = W.buildWater(scene, rings);
const bakeMs = performance.now() - t0;
log('bake+build ms=' + bakeMs.toFixed(1));
log('hm=' + water.uniforms.uHM.value.image.width + 'x' + water.uniforms.uHM.value.image.height
  + ' foamSameTex=' + (water.foamUniforms.uHM.value === water.uniforms.uHM.value));
log('rings speed=' + rings.speed.toFixed(2) + ' span=' + Math.round(rings.span));

const q = new THREE.Group();
for (const b of L.BUOYS) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1.2, 10, 8), new THREE.MeshBasicMaterial({ color: b.hue }));
  m.position.set(b.x, 3.2, b.z); q.add(m);
}
const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3.2, L.LIGHTHOUSE.h, 12),
  new THREE.MeshStandardMaterial({ color: '#dfe4ea' }));
tower.position.set(L.LIGHTHOUSE.x, L.LIGHTHOUSE.h / 2, L.LIGHTHOUSE.z); q.add(tower);
scene.add(q);

const reflections = new W.Reflections(scene);
reflections.add(q);
const columns = new W.LightColumns(scene);
log('columns items=' + columns.items.length + ' mesh=' + columns.mesh.type);

const cams = {
  beach: [[-60, 0, 150], [-60, 0, 20]],
  harbor: [[-500, 0, -110], [-660, 0, -230]],
  aerial: [[180, 220, 620], [-380, -10, -180]],
  sheep: [[640, 0, 190], [700, 0, 40]],
};
const [cp, cl] = cams[cam] || cams.beach;
const level = tideAt(tideH);
camera.position.set(cp[0], Math.max(2.2, level + 2.4) + (cam === 'aerial' ? 220 : 0) + (cam === 'sheep' ? 12 : 0), cp[2]);
camera.lookAt(cl[0], level + 1.0 + (cam === 'aerial' ? -10 : 0), cl[2]);

rings.emit(L.LIGHTHOUSE.x, L.LIGHTHOUSE.z, 1.2, 1);
rings.emit(L.LIGHTHOUSE.x, L.LIGHTHOUSE.z, 3.0, 0.85);
rings.emit(L.LIGHTHOUSE.x, L.LIGHTHOUSE.z, 4.6, 0.7);

let t = 5.0;
const Q = (n) => qs.get(n) === '1';
if (Q('norings')) rings.items.length = 0;
if (Q('nobase')) for (const u of ['uDeep', 'uMid', 'uShelf', 'uSilt']) water.uniforms[u].value.setRGB(0, 0, 0);
water.update(t, 0.9, level);
if (Q('nof')) water.foam.visible = false;
if (Q('now')) water.mesh.visible = false;
if (Q('nocol')) columns.mesh.visible = false;
if (Q('norefl')) reflections.enabled = false;
if (Q('nolamp')) water.uniforms.uLampGain.value = 0;
if (Q('foamred')) {
  water.foamUniforms.uFoamCol.value.setRGB(4, 0, 0);
  water.foamUniforms.uWarm.value.setRGB(4, 0, 0);
}
if (Q('foamoff')) { water.foamUniforms.uFoamCol.value.setRGB(0, 0, 0); water.foamUniforms.uWarm.value.setRGB(0, 0, 0); }
columns.update(t, 0.9, 1.0);
reflections.update(t, level);
renderer.compile(scene, camera);
composer.render();
log('level=' + level.toFixed(2) + ' shoreZ=' + E.shoreZat(-60, level).toFixed(1)
  + ' terrain@shore=' + E.terrainH(-60, E.shoreZat(-60, level)).toFixed(2));

if (!mode) {
  const tick = () => {
    t += 0.016;
    const lv = tideAt(tideH + t * 0.01);
    water.update(t, 0.9, lv);
    columns.update(t, 0.9, 1.0);
    reflections.update(t, lv);
    composer.render();
    requestAnimationFrame(tick);
  };
  tick();
} else {
  log('programs=' + renderer.info.programs.length + ' calls=' + renderer.info.render.calls);
  log('DONE');
}
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
